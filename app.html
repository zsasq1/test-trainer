/* ---------- presence: «сейчас в сети» and «сегодня» for the admin page ---------- */
const Presence = {
  sid: Math.random().toString(36).slice(2, 12) + Date.now().toString(36),
  timer: 0,
  url: path => FIREBASE_DB.replace(/\/+$/, '') + '/' + path + '.json',
  vid() {
    try {
      let v = localStorage.getItem('TestTrainer.vid');
      if (!v) { v = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('TestTrainer.vid', v); }
      return v;
    } catch (e) { return this.sid; }
  },
  started: Date.now(),
  device() {
    const u = navigator.userAgent;
    if (/iPad/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1)) return 'iPad';
    return /iPhone/.test(u) ? 'iPhone' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : 'Другое';
  },
  where() {
    const s = curSet();
    if (!s || bankStatus !== 'ready') return '';
    return (setTitle(s) + ' · ' + (S.test ? 'тест' : (S.starOnly ? '★ ' : '') + CAT_TITLE_RU[S.category])).slice(0, 120);
  },
  // where the person is; with an account also who (u = uid, checked by the rules). Readable only by the site owner.
  live() {
    if (!FIREBASE_DB || !this.timer) return;
    const d = { t: SV, s: this.started, v: this.vid(), d: this.device(), w: this.where() };
    this.lastWhere = d.w;
    const put = auth => fetch(this.url('live/' + this.sid) + (auth ? '?auth=' + auth : ''), { method: 'PUT', body: JSON.stringify(d) }).catch(() => {});
    const u = Account.user;
    if (!u || !Account.ready()) return put('');
    Account.token().then(t => { if (t && Account.user === u) d.u = u.uid; put(t); }, () => put(''));
  },
  // after a render: tell where the person is now, if that changed (at most every 3 s)
  touch() {
    if (!this.timer || this.touchT || this.where() === this.lastWhere) return;
    this.touchT = setTimeout(() => { this.touchT = 0; this.live(); }, 3000);
  },
  beat() {
    fetch(this.url('online/' + this.sid), { method: 'PUT', body: '{".sv":"timestamp"}' }).catch(() => {});
    this.live();
    if (Account.user && Date.now() - Account.syncAt > 300000) Account.sync(true);
    const day = new Date().toLocaleDateString('sv'); // 2026-11-23
    let seen = '';
    try { seen = localStorage.getItem('TestTrainer.day') || ''; } catch (e) {}
    if (seen !== day) {
      fetch(this.url('days/' + day + '/' + this.vid()), { method: 'PUT', body: 'true' })
        .then(r => { if (r.ok) try { localStorage.setItem('TestTrainer.day', day); } catch (e) {} }).catch(() => {});
    }
  },
  on() {
    if (this.timer || !FIREBASE_DB || Account.blocked() || document.visibilityState !== 'visible') return;
    this.timer = setInterval(() => this.beat(), 60000);
    this.beat();
  },
  off() {
    if (!this.timer) return;
    clearInterval(this.timer); this.timer = 0;
    fetch(this.url('online/' + this.sid), { method: 'DELETE', keepalive: true }).catch(() => {});
    fetch(this.url('live/' + this.sid), { method: 'DELETE', keepalive: true }).catch(() => {});
  },
  start() {
    if (!FIREBASE_DB) return;
    const sync = () => {
      if (document.visibilityState === 'visible') { this.on(); Account.sync(); } else this.off();
    };
    document.addEventListener('visibilitychange', sync);
    window.addEventListener('pagehide', () => this.off());
    sync();
  }
};

// → the course files of every faculty, or null when the list didn't load.
// No «fac» = Лечебное дело (everything from before faculties); an unknown one is skipped, not shown to everybody.
async function loadBundledList() {
  try {
    const r = await fetch('data/sets.json', { cache: 'no-cache' });
    if (!r.ok) return null;
    const list = await r.json();
    const facIn = x => facOf(x.fac == null || x.fac === '' ? 'lech' : x.fac);
    const courseIn = x => +x.course || +(x.file.match(/(?:^|\/)([1-6])\//) || [])[1] || 0;
    // a course the faculty doesn't have (e.g. a 6th for Стоматология) is skipped, not shown under every course
    return (Array.isArray(list) ? list : []).filter(x => x && typeof x.file === 'string' && facIn(x) && courseIn(x) <= facIn(x).courses)
      .map(x => {
        const fac = facIn(x), c = courseIn(x);
