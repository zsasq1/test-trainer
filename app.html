<title>Тренажёр тестов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&family=Literata:opsz,wght@7..72,500..700&display=swap">
<style>
/* Layout: one-screen trainer — top bar, scrolling question, thumb-zone controls at the bottom; menu slides in from the left.
   Look: Claude-style warm ivory and near-black, clay accent for actions. Ink marks what you chose, green is right, crimson is wrong. */
:root{
  --bg:#F5F4ED; --surface:#FFFFFF; --line:#E3E0D5; --text:#1F1E1D; --muted:#6E6B63;
  --ink-soft:#EEECE3; --ink-line:rgba(31,30,29,.55);
  --accent:#B85735; --accent-btn:#B85735; --soft-accent:#F6E9E2; --accent-line:rgba(184,87,53,.45);
  --green:#3E7A35; --green-btn:#3E7A35; --soft-green:#E7F0E1; --green-line:rgba(62,122,53,.45);
  --red:#B12C44; --soft-red:#F8E5E7; --red-line:rgba(177,44,68,.45);
  --gray-btn:#FFFFFF; --star:#C38A00; --soft-star:rgba(195,138,0,.13);
  --switch-off:#DAD6CB; --knob:#FFFFFF; --on-accent:#FFFFFF;
  --scrim:rgba(31,30,29,.32); --shadow:rgba(31,30,29,.13); --bar:rgba(245,244,237,.92);
  --toast-bg:#1F1E1D; --toast-fg:#F5F4ED; --glow:rgba(62,122,53,.3);
  --side:#EDEBE2; --side-sel:rgba(31,30,29,.075); --side-hover:rgba(31,30,29,.045);
  --font:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs:1;
  --ease-out:cubic-bezier(0.23,1,0.32,1);  /* strong ease-out for things that appear */
  --ease-ios:cubic-bezier(0.32,0.72,0,1);  /* iOS sheet curve for things that glide */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#262624; --surface:#30302E; --line:#42413D; --text:#F2F0E8; --muted:#A8A59B;
    --ink-soft:#3B3A37; --ink-line:rgba(242,240,232,.55);
    --accent:#E2896A; --accent-btn:#B85735; --soft-accent:#45312A; --accent-line:rgba(226,137,106,.5);
    --green:#8DC57C; --green-btn:#3E7A35; --soft-green:#2D3A29; --green-line:rgba(141,197,124,.45);
    --red:#F08A96; --soft-red:#472A30; --red-line:rgba(240,138,150,.5);
    --gray-btn:#30302E; --star:#F0C04E; --soft-star:rgba(240,192,78,.13);
    --switch-off:#4A4945; --knob:#FFFFFF; --on-accent:#FFFFFF;
    --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.45); --bar:rgba(38,38,36,.92);
    --toast-bg:#F2F0E8; --toast-fg:#262624; --glow:rgba(141,197,124,.3);
    --side:#1F1E1D; --side-sel:rgba(255,255,255,.075); --side-hover:rgba(255,255,255,.045);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#30302E; --line:#42413D; --text:#F2F0E8; --muted:#A8A59B;
  --ink-soft:#3B3A37; --ink-line:rgba(242,240,232,.55);
  --accent:#E2896A; --accent-btn:#B85735; --soft-accent:#45312A; --accent-line:rgba(226,137,106,.5);
  --green:#8DC57C; --green-btn:#3E7A35; --soft-green:#2D3A29; --green-line:rgba(141,197,124,.45);
  --red:#F08A96; --soft-red:#472A30; --red-line:rgba(240,138,150,.5);
  --gray-btn:#30302E; --star:#F0C04E; --soft-star:rgba(240,192,78,.13);
  --switch-off:#4A4945; --knob:#FFFFFF; --on-accent:#FFFFFF;
  --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.45); --bar:rgba(38,38,36,.92);
  --toast-bg:#F2F0E8; --toast-fg:#262624; --glow:rgba(141,197,124,.3);
  --side:#1F1E1D; --side-sel:rgba(255,255,255,.075); --side-hover:rgba(255,255,255,.045);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.4 var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.i.f{fill:currentColor;stroke:none}
.i .fillc{fill:currentColor;stroke:currentColor}
.i .onfill{stroke:var(--on-accent)}

/* ---------- shell ---------- */
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}
.topbar{flex:none;display:flex;align-items:center;gap:6px;padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.icon-btn{width:42px;height:42px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:17px}
.icon-btn:active:not(:disabled){background:var(--ink-soft)}
.icon-btn:disabled{opacity:.38}
.titles{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;text-align:left;padding:0 6px;border-radius:10px}
.titles:active:not(:disabled){background:var(--ink-soft)}
.topbar .icon-btn{width:40px;height:40px;position:relative}
.topbar .icon-btn::after{content:'';position:absolute;inset:-3px}
.title{display:block;font-size:17px;font-weight:650;line-height:1.25;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-row{display:flex;align-items:center;gap:2px;min-width:0;margin-top:1px;color:var(--muted)}
.progress-row .i{font-size:11px;stroke-width:2.6}
.titles:disabled .progress-row .i{display:none}
.progress{min-width:0;font-size:13px;font-weight:500;line-height:1.25;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.progress .p-n{color:var(--text)}
.progress span+span{margin-left:9px}
.top-actions{flex:none;display:flex;align-items:center;gap:2px}
.plain-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-size:19px;border-radius:10px}
.star-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:21px;border-radius:10px}
.star-btn.on{color:var(--star)}
.star-btn.pop .i{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.3)}}
.switch{position:relative;width:46px;height:28px;flex:none;border-radius:999px;background:var(--switch-off);transition:background .2s}
.switch span{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px var(--shadow);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent-btn)}
.switch[aria-checked="true"] span{transform:translateX(18px)}


.scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.content{display:flex;flex-direction:column;gap:18px;padding-block:20px 28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.content.enter{animation:fadein .2s ease}
@keyframes fadein{from{opacity:.3}to{opacity:1}}

.bottombar{flex:none;display:flex;align-items:center;gap:6px;padding-block:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--bar);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.actions-row{flex:1;min-width:0;display:flex;gap:6px}
.bottombar .icon-btn{width:46px;height:48px;border-radius:14px}
.bottombar .act{flex:1 1 auto;height:48px;min-width:0;gap:6px;padding:0 10px;border-radius:14px;font-size:15.5px;white-space:nowrap}
.bottombar .act .i{font-size:18px}
.bottombar .act .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.bottombar .act.icon-only,.actions-row [data-act="finish"]{flex:none;width:52px;padding:0}
/* labels by width: last test question always shows the eye only; narrow phones too */
.actions-row.last [data-act="reveal"]{flex:none;width:52px;padding:0}
.actions-row.last [data-act="reveal"] .lbl{display:none}
@media (max-width:399px){.bottombar .act{font-size:14.5px;gap:5px;padding:0 8px}}
@media (max-width:379px){.bottombar [data-act="reveal"]{flex:none;width:52px;padding:0}.bottombar [data-act="reveal"] .lbl,.actions-row.last [data-act="check"] .lbl{display:none}}
.act{height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;color:var(--on-accent);font-size:16px;font-weight:600;padding:0 14px}
.act .i{font-size:19px}
.act.gray{background:var(--gray-btn);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.act.green{background:var(--accent-btn)}
.act.red{background:var(--red)}
.act.wide{width:100%}
.act:active:not(:disabled){filter:brightness(.9)}
.act.gray:active:not(:disabled){filter:none;background:var(--ink-soft)}
.act:disabled{opacity:.42}

/* ---------- question ---------- */
.q{display:flex;flex-direction:column;gap:16px}
.prompt{font-family:var(--serif);font-size:calc(20px * var(--fs));font-weight:600;line-height:1.42;letter-spacing:-.002em;text-wrap:pretty;overflow-wrap:anywhere;font-optical-sizing:auto}
.prompt.sm{font-size:calc(18px * var(--fs))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;font-weight:600;color:var(--muted)}
.ctx{font-size:calc(16px * var(--fs));line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere}
.choices,.dd-list{display:flex;flex-direction:column;gap:10px}
.choice{width:100%;display:flex;align-items:flex-start;gap:12px;padding:13px 14px;text-align:left;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:calc(16px * var(--fs));line-height:1.42;transition:background-color .15s,border-color .15s,box-shadow .15s,transform .12s}
.choice:active{transform:scale(.99)}
.choice .ico{width:24px;height:calc(22px * var(--fs));min-height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;flex:none}
.choice.is-sel{background:var(--ink-soft);border-color:var(--ink-line);box-shadow:inset 0 0 0 1px var(--ink-line)}
.choice.is-sel .ico.base{color:var(--text)}
.choice.is-sel .ico.base .onfill{stroke:var(--surface)}
.ctext{flex:1;min-width:0;overflow-wrap:anywhere}
.choice .ico.status{display:none}
.choice.st-ok .ico.status{color:var(--green)}
.choice.st-bad .ico.status{color:var(--red)}
.q[data-hl="1"] .choice.st-ok{background:var(--soft-green);border-color:var(--green-line);box-shadow:none}
.q[data-hl="1"] .choice.st-ok.is-sel{box-shadow:inset 0 0 0 1px var(--green-line)}
.q[data-hl="1"] .choice.st-bad{background:var(--soft-red);border-color:var(--red-line);box-shadow:inset 0 0 0 1px var(--red-line)}
.q[data-hl="1"] .choice.st-ok .ico.base,.q[data-hl="1"] .choice.st-bad .ico.base{display:none}
.q[data-hl="1"] .choice.st-ok .ico.status,.q[data-hl="1"] .choice.st-bad .ico.status{display:inline-flex}

.dd-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(118px,44%);gap:12px;align-items:start;padding:12px 12px 12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.dd-left{font-size:calc(16px * var(--fs));font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.dd-right{min-width:0;display:flex;flex-direction:column;gap:6px}
.dd-btn{width:100%;display:flex;align-items:flex-start;gap:8px;padding:8px 10px;text-align:left;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:calc(16px * var(--fs));font-weight:600;line-height:1.35}
.dd-btn:active{background:var(--ink-soft)}
.dd-btn>span{flex:1;min-width:0;overflow-wrap:anywhere}
.dd-btn .ph{color:var(--muted);font-weight:500}
.dd-btn .i{font-size:13px;color:var(--muted);margin-top:3px}
.hint-correct{display:none;color:var(--green);font-size:calc(15px * var(--fs));font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.q[data-hl="1"] .hint-correct{display:block}
.field .hint-correct{margin-top:8px;white-space:pre-wrap}
.q[data-hl="1"] .dd-row.st-ok{background:var(--soft-green);border-color:var(--green-line)}
.q[data-hl="1"] .dd-row.st-bad{background:var(--soft-red);border-color:var(--red-line)}

.sort-hint{font-size:14px;font-weight:500;color:var(--muted);margin-bottom:-8px}
.sort-list{display:flex;flex-direction:column;gap:8px;position:relative}
.sort-row{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);transition:transform .18s ease;position:relative}
.sort-row.dragging{transition:none;z-index:3;border-color:var(--ink-line);box-shadow:0 10px 24px var(--shadow)}
.num{width:24px;height:24px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.stext{flex:1;min-width:0;font-size:calc(16px * var(--fs));font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.handle{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:19px;touch-action:none;cursor:grab;border-radius:10px}
.sort-row.dragging .handle{cursor:grabbing;color:var(--text)}
.sort-row .ico.status{display:none;font-size:20px}
.sort-row.st-ok .ico.status{color:var(--green)}
.sort-row.st-bad .ico.status{color:var(--red)}
.q[data-hl="1"] .sort-row .num,.q[data-hl="1"] .handle,.q[data-hl="1"] .sort-hint{display:none}
.q[data-hl="1"] .sort-row .ico.status{display:inline-flex}
.q[data-hl="1"] .sort-row{padding-right:12px}
.q[data-hl="1"] .sort-row.st-ok{background:var(--soft-green);border-color:var(--green-line)}
.q[data-hl="1"] .sort-row.st-bad{background:var(--soft-red);border-color:var(--red-line)}

.field{display:flex;flex-direction:column;gap:8px}
.txt{width:100%;display:block;resize:none;overflow:hidden;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:max(16px,calc(17px * var(--fs)));font-weight:600;line-height:1.35;min-height:48px}
.txt:focus{outline:none;border-color:var(--ink-line);box-shadow:inset 0 0 0 1px var(--ink-line)}
.q[data-hl="1"] .txt.st-ok{background:var(--soft-green);border-color:var(--green-line);box-shadow:none}
.q[data-hl="1"] .txt.st-bad{background:var(--soft-red);border-color:var(--red-line);box-shadow:none}

.case-sub{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.sublabel{font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sublabel.own{color:var(--accent)}
.mini-del{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--red);font-size:15px;border-radius:8px}
.pulse{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 transparent}35%{transform:scale(1.03);box-shadow:0 0 14px 2px var(--glow)}100%{transform:scale(1);box-shadow:0 0 0 0 transparent}}

.state{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px 8px}
.state .big{font-size:36px;color:var(--muted)}
.state h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.3;text-wrap:balance}
.state p{margin:0;font-size:15px;color:var(--muted);max-width:34ch;text-wrap:pretty}
.state .act{margin-top:6px;min-width:220px}
.state .ghost-btn{margin-top:2px}
.ghost-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:10px;color:var(--accent);font-weight:600;font-size:15px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .24s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:40;width:min(88vw,350px);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);column-gap:8px;row-gap:12px;background:var(--surface);box-shadow:8px 0 28px var(--shadow);transform:translateX(-106%);transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(var(--dpad),env(safe-area-inset-left,0px));padding-right:var(--dpad);padding-bottom:0;visibility:hidden;--dpad:16px}
.drawer.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
/* search box and the close button share the first row; the list fills the rest */
.drawer>.searchbox{grid-column:1;grid-row:1}
.d-head{grid-column:2;grid-row:1;display:flex;align-items:center}
.d-head .icon-btn{width:44px;height:44px}
@media (max-width:360px){.drawer{--dpad:12px}}
.searchbox{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.searchbox:focus-within{border-color:var(--ink-line)}
.searchbox input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:16px;color:var(--text)}
.searchbox input::placeholder{color:var(--muted)}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox button{color:var(--muted);font-size:18px;display:inline-flex}
.menu-body{grid-column:1/-1;grid-row:2;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:20px;padding-top:2px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));margin-right:calc(-1 * var(--dpad));padding-right:var(--dpad)}
.msec{display:flex;flex-direction:column;gap:2px}
.sec-label{font-size:13.5px;font-weight:600;color:var(--muted);margin:0 4px 5px}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.sec-row .sec-label{margin-bottom:0}
.sec-chip{display:inline-flex;align-items:center;gap:3px;min-width:0;max-width:62%;min-height:28px;padding:3px 6px 3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.sec-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-chip .i{width:15px;height:15px}
.sec-chip:active{background:var(--line)}
.msec-note{margin:0;padding:6px 4px;font-size:15px;color:var(--muted)}
.m-note{margin:0 4px 4px;font-size:13px;line-height:1.35;color:var(--muted)}
.mline{display:flex;align-items:center;gap:2px}
.mrow{width:100%;min-height:46px;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:12px;text-align:left;font-size:16px;font-weight:600}
.mrow:active{background:var(--bg)}
.mrow.on{background:var(--ink-soft)}
.mrow .mico{width:22px;display:inline-flex;justify-content:center;color:var(--muted);font-size:18px;flex:none}
.mrow.on .mico{color:var(--text)}
.mrow .mtxt{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.28}
.mrow .mtxt small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.mrow .mtick{color:var(--text);font-size:15px}
.m-res .ok{color:var(--green)}
.m-res .bad{color:var(--red)}
.mrow.static{cursor:default}

/* ---------- sheets & dialogs ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}

.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px var(--shadow);animation:up .24s cubic-bezier(.2,.8,.2,1);padding-block:20px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet.full{height:calc(100% - 10px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;overflow:hidden;padding:0}
.sheet-wrap.closing .sheet{animation:down .18s ease forwards}
.sheet-wrap.closing .sheet-scrim{animation:fade .18s ease reverse forwards}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}

  .sheet-wrap{align-items:center;padding:24px}
  .sheet{border-radius:20px}
  .sheet.full{height:min(820px,calc(100% - 48px))}
  @keyframes up{from{transform:translateY(24px);opacity:0}}
  @keyframes down{to{transform:translateY(24px);opacity:0}}
}

.sheet-foot{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* file «…» actions sheet */

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-right:-16px;padding-right:16px}
.chip{flex:none;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600}

.chip.on{background:var(--text);border-color:transparent;color:var(--surface)}

.sheet.mt .sheet-head{padding-block:6px;gap:6px}

.mt-ico{color:var(--text);font-size:18px;display:inline-flex;flex:none}

@media (max-width:340px){.mt-ctrls .sq-btn{width:34px}.mt-ctrls{gap:3px}.mt-steps{gap:8px}.mt-title{font-size:15px}.mt-top{gap:8px}.mt-ord{gap:4px}.mt-ord .sq-btn{width:38px}.mt-card{padding-left:10px}.mt-go{padding:0 12px 0 10px}}

/* keyboard hints, only where there is a keyboard and a mouse */

<script>
(() => {
'use strict';

/* =========================================================
   Constants & small helpers
   ========================================================= */
const CATS = ['multiple', 'single', 'dropdown', 'sortable', 'text', 'caseStudy'];
const CAT_TITLE = {
  multiple: 'Несколько ответов', single: 'Один ответ', dropdown: 'Выпадающий список',
  sortable: 'Правильный порядок', text: 'Текстовый ответ', caseStudy: 'Кейсы'
};
const SUB_TYPES = [
  ['single', 'Один', 'Один правильный ответ'],
  ['multiple', 'Несколько', 'Несколько правильных ответов'],
  ['dropdown', 'Список', 'Выпадающий список'],
  ['sortable', 'Порядок', 'Правильный порядок'],
  ['text', 'Текст', 'Написать текст']
];
const SUB_TITLE = Object.fromEntries(SUB_TYPES.map(t => [t[0], t[2]]));
const LS_KEY = 'TestTrainer.web.v1';
const TEXT_PLACEHOLDERS = new Set(['текстовая строка (без учета регистра)', 'текстовая строка']);
const coll = new Intl.Collator('ru', { numeric: true, sensitivity: 'base' });

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const range = n => Array.from({ length: n }, (_, i) => i);
const uniq = arr => { const s = new Set(); return arr.filter(v => !s.has(v) && s.add(v)); };
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
const sid = (prefix, text) => prefix + '-' + cyrb53(prefix + '|' + text).toString(36);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shuffledDifferent(values) {
  if (values.length <= 1) return values.slice();
  const s = shuffle(values.slice());
  if (s.some((v, i) => v !== values[i])) return s;
  return values.slice(1).concat(values[0]);
}
const isPerm = (arr, n) => Array.isArray(arr) && arr.length === n && new Set(arr).size === n && arr.every(v => Number.isInteger(v) && v >= 0 && v < n);
const normText = v => String(v || '').trim().replace(/,/g, '.').split(/\s+/).filter(Boolean).join(' ').toLowerCase().replace(/ё/g, 'е');
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
function firstSentence(t) { const s = String(t).trim(); return s.length > 96 ? s.slice(0, 96).trimEnd() + '…' : s; }

/* ---------- icons ---------- */
const sv = (body, filled) => `<svg class="i${filled ? ' f' : ''}" viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
const I = {
  menu: sv('<path d="M4 7h16M4 12h16M4 17h16"/>'),
  x: sv('<path d="M6 6l12 12M18 6 6 18"/>'),
  chevL: sv('<path d="m15 18-6-6 6-6"/>'),
  chevR: sv('<path d="m9 6 6 6-6 6"/>'),
  chevD: sv('<path d="m6 9 6 6 6-6"/>'),
  eye: sv('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'),
  eyeOff: sv('<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.3-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
  check: sv('<path d="M5 12.5 9.5 17 19 7.5"/>'),
  star: sv('<path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9Z"/>'),
  starF: sv('<path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9Z"/>', true),
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  minus: sv('<path d="M5 12h14"/>'),
  search: sv('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>'),

  paste: sv('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/>'),
  test: sv('<path d="M7 3h7l5 5v13H7Z"/><path d="M14 3v5h5M10 13l1.5 1.5L14.5 11.5M10 18h5"/>'),
  ok: sv('<circle cx="12" cy="12" r="9.5" class="fillc"/><path d="m7.6 12.3 3 3 5.8-5.8" class="onfill"/>'),
  bad: sv('<circle cx="12" cy="12" r="9.5" class="fillc"/><path d="m9 9 6 6M15 9l-6 6" class="onfill"/>'),
  radioOff: sv('<circle cx="12" cy="12" r="8.5"/>'),
  radioOn: sv('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.4" class="fillc"/>'),
  boxOff: sv('<rect x="4" y="4" width="16" height="16" rx="3.5"/>'),
  boxOn: sv('<rect x="4" y="4" width="16" height="16" rx="3.5" class="fillc"/><path d="m8 12.3 2.7 2.7L16 9.6" class="onfill"/>')

I.cat = {
  multiple: sv('<path d="M10.5 6H20M10.5 12H20M10.5 18H20"/><path d="m3.5 6 1.6 1.6L8 4.7M3.5 12l1.6 1.6L8 10.7M3.5 18l1.6 1.6L8 16.7"/>'),
  single: I.radioOn,
  dropdown: sv('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m9 11 3 3 3-3"/>'),
  sortable: sv('<path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4"/>'),
  text: sv('<path d="M12 4v16M9 4h6M9 20h6"/>'),
  caseStudy: I.doc

I.sub = { single: I.radioOn, multiple: I.boxOn, dropdown: I.cat.dropdown, sortable: I.cat.sortable, text: sv('<path d="M4 20h4L19 9l-4-4L4 16Z"/>') };

/* =========================================================
   Question bank (port of QuestionBank.swift)
   ========================================================= */
const EMPTY_BANK = Object.freeze({ byCat: Object.fromEntries(CATS.map(c => [c, []])), byId: new Map(), total: 0, skipped: 0 });

function buildBank(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
    throw new Error('Ожидался объект вида {"Текст вопроса": {"type": "single", "all_options": [...]}}.');
  }
  const keys = Object.keys(raw);
  const keyIndex = new Map(keys.map((k, i) => [k, i]));
  const entries = keys.map(k => ({ prompt: k, r: raw[k] })).filter(e => e.r && typeof e.r === 'object' && !Array.isArray(e.r));
  entries.sort((a, b) => coll.compare(a.prompt, b.prompt));
  const groups = { single: [], multiple: [], dropdown: [], sortable: [], text: [] };
  let skipped = 0;
  for (const { prompt, r } of entries) {
    const ctx = typeof r.main_text === 'string' && r.main_text.trim() ? r.main_text : null;
    const opts = Array.isArray(r.all_options) ? r.all_options.filter(o => o && typeof o === 'object') : [];
    const answers = Array.isArray(r.answers) ? r.answers.filter(a => typeof a === 'string') : [];
    const seed = prompt + '|' + (ctx || '');
    switch (r.type) {
      case 'single':
      case 'multiple': {
        const options = opts.filter(o => typeof o.text === 'string' && o.text !== '').map(o => ({ text: o.text, correct: o.correct === true }));
        if (!options.length) { skipped++; break; }
        groups[r.type].push({ kind: r.type, id: sid(r.type, seed), prompt, context: ctx, options });
        break;
      }
      case 'dropdown': {
        const rows = opts.filter(o => typeof o.left === 'string' && o.left && typeof o.correct_value === 'string' && o.correct_value)
          .map(o => ({ left: o.left, value: o.correct_value }));
        if (!rows.length) { skipped++; break; }
        groups.dropdown.push({ kind: 'dropdown', id: sid('dropdown', seed), prompt, context: ctx, rows, choices: uniq(rows.map(x => x.value)) });
        break;
      }
      case 'sortable': {
        const order = opts.filter(o => Number.isFinite(o.position) && typeof o.text === 'string' && o.text)
          .sort((a, b) => a.position - b.position).map(o => o.text);
        if (!order.length) { skipped++; break; }
        groups.sortable.push({ kind: 'sortable', id: sid('sortable', seed), prompt, context: ctx, order });
        break;
      }
      case 'drag_and_drop':
      case 'text_input': {
        const accepted = uniq(answers.concat(opts.filter(o => o.correct === true && typeof o.text === 'string').map(o => o.text))
          .map(s => s.trim()).filter(s => s && !TEXT_PLACEHOLDERS.has(s.toLowerCase())));
        groups.text.push({ kind: 'text', id: sid('text', seed), prompt, context: ctx, accepted });
        break;
      }
      case 'cluster_member':
        break; // заголовок кейса: сами подвопросы приходят с main_text
      default:
        skipped++;
    }
  }
  const all = [].concat(groups.single, groups.multiple, groups.dropdown, groups.sortable, groups.text);
  const caseMap = new Map();
  for (const q of all) if (q.context) { if (!caseMap.has(q.context)) caseMap.set(q.context, []); caseMap.get(q.context).push(q); }
  const inCase = new Set();
  const cases = [...caseMap.keys()].sort(coll.compare).map(mainText => {
    const subs = caseMap.get(mainText).sort((a, b) =>
      ((keyIndex.has(a.prompt) ? keyIndex.get(a.prompt) : 1e9) - (keyIndex.has(b.prompt) ? keyIndex.get(b.prompt) : 1e9)) || coll.compare(a.prompt, b.prompt));
    subs.forEach(s => inCase.add(s.id));
    return { kind: 'case', id: sid('case', mainText), mainText, subs, category: 'caseStudy', title: firstSentence(mainText), searchSrc: [mainText].concat(subs.map(s => s.prompt)).join(' ') };
  });
  const tag = (list, cat, src) => list.filter(q => !inCase.has(q.id)).map(q => Object.assign(q, { category: cat, title: q.prompt, searchSrc: src(q) }));
  const choiceSrc = q => [q.context, q.prompt].concat(q.options.map(o => o.text)).filter(Boolean).join(' ');
  const byCat = {
    multiple: tag(groups.multiple, 'multiple', choiceSrc),
    single: tag(groups.single, 'single', choiceSrc),
    dropdown: tag(groups.dropdown, 'dropdown', q => [q.prompt].concat(q.rows.map(x => x.left + ' ' + x.value)).join(' ')),
    sortable: tag(groups.sortable, 'sortable', q => [q.prompt].concat(q.order).join(' ')),
    text: tag(groups.text, 'text', q => [q.context, q.prompt].concat(q.accepted).filter(Boolean).join(' ')),
    caseStudy: cases
  };
  const byId = new Map();
  for (const c of CATS) for (const it of byCat[c]) byId.set(it.id, it);
  return { byCat, byId, total: all.length, skipped };
}

function searchBank(bank, query) {
  const nq = norm(query);
  if (!nq) return [];
  const toks = nq.split(' ');
  const isSubseq = (needle, hay) => { let i = 0; for (const ch of hay) { if (ch === needle[i]) i++; if (i === needle.length) return true; } return i === needle.length; };
  const out = [];
  for (const c of CATS) for (const it of bank.byCat[c]) {
    const hay = it.hay || (it.hay = norm(it.searchSrc));
    if (!hay) continue;
    let sc;
    if (hay.includes(nq)) sc = 0;
    else if (toks.every(t => hay.includes(t))) sc = 1;
    else {
      const words = hay.split(' ');
      const hit = toks.filter(t => hay.includes(t) || (t.length > 2 && words.some(w => isSubseq(t, w)))).length;
      if (hit >= Math.max(1, Math.ceil(toks.length / 2))) sc = 2; else continue;
    }
    out.push({ it, sc, len: hay.length });
  }
  out.sort((a, b) => a.sc - b.sc || a.len - b.len);
  return out.slice(0, 80).map(x => x.it);
}

/* =========================================================
   Persistence: claude.ai account (db + assets) or this browser
   ========================================================= */
const IDB_NAME = 'TestTrainer', IDB_STORE = 'files';
let idbPromise = null;
function idb() {
  if (!idbPromise) idbPromise = new Promise((resolve, reject) => {
    try {
      const r = indexedDB.open(IDB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE, { keyPath: 'id' });
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    } catch (e) { reject(e); }
  });
  return idbPromise;
}
async function idbReq(mode, fn) {
  const d = await idb();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(IDB_STORE, mode);
    const req = fn(tx.objectStore(IDB_STORE));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}
const idbGet = id => idbReq('readonly', s => s.get(id)).catch(() => null);
const idbPut = rec => idbReq('readwrite', s => s.put(rec)).then(() => true, () => false);
const idbDel = id => idbReq('readwrite', s => s.delete(id)).catch(() => null);
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

const Store = {
  mode: 'local', db: null, assets: null, uid: null, warned: false, downloads: null,
  async init() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') {
      // Own site (GitHub Pages / Mac): ask the browser not to clear saved files and progress.
      try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
      return;
    }
    try {
      const [db, user, assets, downloads] = await Promise.all([c.use('db'), c.use('user'), c.use('assets'), c.use('downloads')]);
      this.downloads = downloads; // claude.ai: files are handed to the viewer only through this
      const uid = db && user ? await user.id() : null;
      if (db && uid) { this.db = db; this.uid = uid; this.assets = assets; this.mode = 'cloud'; }
    } catch (e) { /* stay local */ }
  },
  stateDoc() { return this.db.doc('data/users/' + this.uid + '/state'); },
  readLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } },
  async loadState() {
    const local = this.readLocal();
    if (this.mode === 'cloud') {
      try {
        const snap = await withTimeout(this.stateDoc().get(), 10000);
        if (snap.exists) {
          const d = snap.data();
          if (d && typeof d.json === 'string') { this.lastCloud = d.json; return { state: JSON.parse(d.json), fresh: false }; }
        }
        return { state: local, fresh: true };
      } catch (e) {
        this.mode = 'local';
        this.cloudDown = true;
      }
    }
    return { state: local, fresh: false };
  },
  writing: false, pending: null, lastCloud: '',
  persist(str) {
    try { localStorage.setItem(LS_KEY, str); } catch (e) { /* storage full or blocked */ }
    if (this.mode === 'cloud') this.writeCloud(str);
  },
  async writeCloud(str) {
    if (str === this.lastCloud) return;
    if (this.writing) { this.pending = str; return; }
    this.writing = true;
    try {
      await this.stateDoc().set({ json: str });
      this.lastCloud = str;
    } catch (e) {
      if (!this.warned) { this.warned = true; toast('Не удалось сохранить прогресс в аккаунте. Он сохранится в этом браузере.'); }
    }
    this.writing = false;
    if (this.pending != null) { const p = this.pending; this.pending = null; this.writeCloud(p); }
  },
  async putFile(text) {
    if (this.mode === 'cloud' && this.assets) {
      try {
        const r = await this.assets.upload(new Blob([text], { type: 'application/json' }), { type: 'application/json' });
        return { store: 'cloud', ref: r.id };
      } catch (e) { /* fall back to this browser */ }
    }
    const ref = 'f-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    if (!(await idbPut({ id: ref, text }))) throw new Error('Память браузера недоступна (частный режим?). Файл не сохранился.');
    return { store: 'local', ref };
  },
  async getFile(rec) {
    if (rec.store === 'cloud') {
      const r = await fetch('/_blob/' + rec.ref);
      if (!r.ok) throw new Error('Файл не открылся из аккаунта (код ' + r.status + '). Загрузите его заново.');
      return r.text();
    }
    const row = await idbGet(rec.ref);
    if (!row) throw new Error('Файла нет в памяти этого браузера. Загрузите его заново.');
    return row.text;
  },
  async delFile(rec) {
    try {
      if (rec.store === 'cloud') { if (this.assets) await this.assets.delete(rec.ref); }
      else await idbDel(rec.ref);
    } catch (e) { /* ignore */ }
  },
  async migrateLocalFiles(sets) {
    if (this.mode !== 'cloud' || !this.assets) return false;
    let changed = false;
    for (const rec of sets) {
      if (rec.store !== 'local') continue;
      const row = await idbGet(rec.ref);
      if (!row) continue;
      try {
        const r = await this.assets.upload(new Blob([row.text], { type: 'application/json' }), { type: 'application/json' });
        rec.store = 'cloud'; rec.ref = r.id; changed = true;
      } catch (e) { break; }
    }
    return changed;
  }
};

/* =========================================================
   App state (port of QuizStore.swift)
   ========================================================= */
const defaults = () => ({
  setId: '', category: 'multiple', starOnly: false, index: 0, indexByScope: {}, answers: {},
  starred: {}, savedTests: [], test: null, autoAdvance: true, fontScale: 1, customSubs: {},
  sets: [], hiddenBundled: [], titles: {}, results: {}, tour: {}

let S = defaults();
let BUNDLED = [];          // [{id, file, title}] from data/sets.json
let SETS = [];             // what the menu lists
const BANKS = new Map();   // id -> bank | {error}
const LOADING = new Map(); // id -> promise
let bank = EMPTY_BANK, bankStatus = 'boot', bankError = '';

let QMAP = new Map();

let saveTimer = 0;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, Store.mode === 'cloud' ? 900 : 150); }
function flush() {
  clearTimeout(saveTimer); saveTimer = 0;

  let str;

}
function pruneAnswers() {
  for (const [k, r] of Object.entries(S.answers)) {
    if (!r.checked && !r.reveal && !r.moved && r.sel == null && !(r.multi && r.multi.length) && !(r.text) && !(r.dd && Object.keys(r.dd).length)) delete S.answers[k];

}
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

const setTitle = s => (s && (S.titles[s.id] || s.title)) || '';

const scopeKey = (cat = S.category) => S.setId + '|' + cat;
const akey = id => S.setId + '|' + id;
const bankReady = () => bankStatus === 'ready';

function rebuildSets() {
  const recs = new Map(S.sets.map(r => [r.id, r]));
  const list = [];
  for (const b of BUNDLED) {

  for (const r of S.sets) if (!list.some(s => s.id === r.id)) list.push({ id: r.id, title: r.title, bundled: false, rec: r });

/* ---------- answer records ---------- */
const EMPTY_REC = Object.freeze({ sel: null, multi: Object.freeze([]), dd: Object.freeze({}), order: null, text: '', shuf: null, checked: false, reveal: false });
const rec = id => S.answers[akey(id)] || EMPTY_REC;
function mut(id, fn) {
  const k = akey(id);
  if (!S.answers[k]) S.answers[k] = { sel: null, multi: [], dd: {}, order: null, text: '', shuf: null, checked: false, reveal: false };
  fn(S.answers[k]);
  save();
}
const clearRec = id => { delete S.answers[akey(id)]; };
// Last check of each question (1 right, -1 wrong) — survives moving on; counted in the menu.
const resultOf = id => S.results[akey(id)] || 0;
function setResult(id, ok) {
  const k = akey(id);
  delete S.results[k];
  S.results[k] = ok ? 1 : -1;
  const keys = Object.keys(S.results);
  if (keys.length > 4000) keys.slice(0, keys.length - 3000).forEach(x => delete S.results[x]);
}
const dropResults = setId => { for (const k of Object.keys(S.results)) if (k.startsWith(setId + '|')) delete S.results[k]; };
const hlVisible = id => { const r = rec(id); return r.checked || r.reveal; };
const customSubsOf = caseId => S.customSubs[caseId] || [];

function subToQ(s) {
  switch (s.type) {
    case 'single': case 'multiple':
      return { kind: s.type, id: s.id, prompt: s.prompt, context: null, options: (s.options || []).map(o => ({ text: o.text, correct: !!o.correct })) };
    case 'dropdown': {
      const rows = (s.rows || []).map(r => ({ left: r.left, value: r.value }));
      return { kind: 'dropdown', id: s.id, prompt: s.prompt, context: null, rows, choices: (s.choices && s.choices.length) ? s.choices : uniq(rows.map(r => r.value)) };
    }
    case 'sortable':
      return { kind: 'sortable', id: s.id, prompt: s.prompt, context: null, order: s.order || [] };
    default:
      return { kind: 'text', id: s.id, prompt: s.prompt, context: null, accepted: s.accepted || [] };
  }
}
const subsOfCase = it => it.subs.concat(customSubsOf(it.id).map(subToQ));

function ensureShuf(id, n) {
  const r = rec(id);
  if (isPerm(r.shuf, n)) return r.shuf;
  const s = shuffledDifferent(range(n));
  mut(id, x => { x.shuf = s; });
  return s;
}
function sortOrder(q) {
  const r = rec(q.id), n = q.order.length;
  if (isPerm(r.order, n)) return r.order;
  const o = shuffledDifferent(range(n));
  mut(q.id, x => { x.order = o; });
  return o;
}
function isCorrect(q) {
  const r = rec(q.id);
  switch (q.kind) {
    case 'single': return r.sel != null && !!(q.options[r.sel] && q.options[r.sel].correct);
    case 'multiple': {
      const sel = new Set(r.multi);
      const want = q.options.map((o, i) => o.correct ? i : -1).filter(i => i >= 0);
      return sel.size === want.length && want.every(i => sel.has(i));
    }
    case 'dropdown': return q.rows.every((row, i) => r.dd[i] === row.value);
    case 'sortable': { const o = sortOrder(q); return o.every((oi, pos) => q.order[oi] === q.order[pos]); }
    case 'text': { const a = normText(r.text); return !!a && q.accepted.some(x => normText(x) === a); }
    case 'case': return subsOfCase(q).every(isCorrect);
  }
  return false;
}
function answerText(q, short) {
  switch (q.kind) {
    case 'single': { const o = q.options.find(o => o.correct); return o ? o.text : (short ? 'не найден' : 'Правильный ответ не найден.'); }
    case 'multiple': return q.options.filter(o => o.correct).map(o => o.text).join('\n') || 'нет верных вариантов';
    case 'dropdown': return q.rows.map(r => r.left + ' — ' + r.value).join('\n');
    case 'sortable': return q.order.map((v, i) => (i + 1) + '. ' + v).join('\n');
    case 'text': return q.accepted.length ? q.accepted.join('\n') : (short ? 'не найден' : 'Правильный ответ не указан в JSON.');
    case 'case': {
      const built = q.subs.map((s, i) => (i + 1) + '. ' + s.prompt + '\nОтвет: ' + answerText(s, true));
      const own = customSubsOf(q.id).map((s, i) => 'Ваш вопрос ' + (i + 1) + '. ' + s.prompt + '\nОтвет: ' + answerText(subToQ(s), true));
      return built.concat(own).join('\n\n');
    }
  }
  return '';
}

/* ---------- navigation & selection ---------- */
function currentItems() {
  if (!bankReady()) return [];
  if (S.test) return S.test.ids.map(id => bank.byId.get(id)).filter(Boolean);
  const base = bank.byCat[S.category] || [];
  if (S.starOnly) { const st = new Set(S.starred[S.setId] || []); return base.filter(it => st.has(it.id)); }
  return base;
}
const currentItem = () => currentItems()[S.index] || null;
function remember() { if (bankReady() && !S.test && !S.starOnly) S.indexByScope[scopeKey()] = S.index; }
function clampIndex() {
  if (!bankReady()) return;
  const n = currentItems().length;
  if (!Number.isInteger(S.index) || S.index < 0) S.index = 0;
  if (n === 0) S.index = 0; else if (S.index >= n) S.index = n - 1;
  remember();
}
function resetItem(it) {
  if (!it) return;
  clearRec(it.id);
  if (it.kind === 'case') subsOfCase(it).forEach(s => clearRec(s.id));
}
function shuffleQ(q) {
  switch (q.kind) {
    case 'single': case 'multiple': mut(q.id, r => { r.shuf = shuffledDifferent(range(q.options.length)); r.checked = false; r.reveal = false; }); break;
    case 'dropdown': mut(q.id, r => { r.shuf = shuffledDifferent(range(q.choices.length)); r.checked = false; r.reveal = false; }); break;
    case 'sortable': mut(q.id, r => { r.order = shuffledDifferent(range(q.order.length)); r.moved = false; r.checked = false; r.reveal = false; }); break;
    case 'case': subsOfCase(q).forEach(shuffleQ); break;
  }
}
function endTest() {
  if (!S.test) return;
  if (bankReady()) S.test.ids.forEach(id => resetItem(bank.byId.get(id)));
  S.test = null;
  S.index = S.indexByScope[scopeKey()] || 0;
  clampIndex();
  save();
}
function selectSet(id) {
  if (!SETS.some(s => s.id === id)) return;
  if (id === S.setId && bankStatus !== 'error') return;
  endTest();
  remember();
  S.setId = id;
  S.starOnly = false;
  S.index = S.indexByScope[scopeKey()] || 0;
  activateSet();
  save();
}
function selectCategory(cat) {
  endTest();
  remember();
  S.category = cat;
  S.starOnly = false;
  S.index = S.indexByScope[scopeKey()] || 0;
  clampIndex();
  save();
}
function selectStarred(cat) {
  endTest();
  remember();
  S.category = cat;
  S.starOnly = true;
  S.index = 0;
  clampIndex();
  save();
}
function selectItem(cat, id) {
  endTest();
  remember();
  const i = (bank.byCat[cat] || []).findIndex(x => x.id === id);
  S.category = cat;
  S.starOnly = false;
  S.index = i < 0 ? 0 : i;
  remember();
  save();
}
function goPrev() {
  if (S.index <= 0) return;
  S.index--;
  checkSeq++;
  remember();
  save();
}
function goNext() {
  const items = currentItems();
  if (!items.length) return;
  const leaving = S.test ? null : items[S.index];
  S.index = S.index >= items.length - 1 ? 0 : S.index + 1;
  if (leaving) resetItem(leaving);
  checkSeq++;
  remember();
  save();
}
function jumpTo(i) {
  const n = currentItems().length;
  if (!n) return;
  S.index = clamp(i, 0, n - 1);
  checkSeq++;
  remember();
  save();
}

/* ---------- answering ---------- */
function answerChanged(qid) {
  checkSeq++;
  const it = currentItem();
  if (it && it.kind === 'case' && it.id !== qid && subsOfCase(it).some(s => s.id === qid)) {
    mut(it.id, r => { r.checked = false; r.reveal = false; });
  }
}
function pick(qid, i) {
  const q = QMAP.get(qid);
  if (!q) return;
  if (q.kind === 'single') mut(qid, r => { r.sel = i; r.checked = false; r.reveal = false; });
  else mut(qid, r => { const s = new Set(r.multi); s.has(i) ? s.delete(i) : s.add(i); r.multi = [...s]; r.checked = false; r.reveal = false; });
  answerChanged(qid);
}
function setDD(qid, row, value) {
  mut(qid, r => { if (value) r.dd[row] = value; else delete r.dd[row]; r.checked = false; r.reveal = false; });
  answerChanged(qid);
}
function setOrder(qid, order) {
  mut(qid, r => { r.order = order; r.moved = true; r.checked = false; r.reveal = false; });
  answerChanged(qid);
}
function setText(qid, text) {
  mut(qid, r => { r.text = text; r.checked = false; r.reveal = false; });
  answerChanged(qid);
}
function check() {
  const it = currentItem();
  if (!it) return;
  mut(it.id, r => { r.checked = true; r.reveal = false; });
  const ok = isCorrect(it);
  const seq = ++checkSeq;
  haptic();
  setResult(it.id, ok);
  if (ok) pulse = { scope: it.id };
  render();
  const items = currentItems();
  const lastInTest = S.test && S.index >= items.length - 1;
  if (ok && S.autoAdvance && !lastInTest) {
    setTimeout(() => {
      const cur = currentItem();
      if (cur && cur.id === it.id && checkSeq === seq && !anySheet()) { goNext(); render(); }
    }, 800);
  } else if (ok && !S.autoAdvance && !S.test) {
    setTimeout(() => {
      const cur = currentItem();
      if (cur && cur.id === it.id && checkSeq === seq) { resetItem(it); shuffleQ(it); save(); render(); }
    }, 800);
  }
}
function reveal() {
  const it = currentItem();
  if (!it) return;
  // «Подглядеть» works after «Проверить» too: only an open answer is hidden again
  if (rec(it.id).reveal) { resetItem(it); shuffleQ(it); }
  else mut(it.id, r => { r.reveal = true; if (!S.test) r.checked = false; });
  checkSeq++;
  save();
}
const isStarred = id => (S.starred[S.setId] || []).includes(id);
function toggleStar(id) {
  const list = new Set(S.starred[S.setId] || []);
  list.has(id) ? list.delete(id) : list.add(id);
  if (list.size) S.starred[S.setId] = [...list]; else delete S.starred[S.setId];
  if (S.starOnly) clampIndex();
  save();
}

/* ---------- custom test ---------- */
const pointsFor = it => (S.test && S.test.points[it.category]) || 0;
const testTotal = () => currentItems().reduce((a, it) => a + pointsFor(it), 0);
const testEarned = () => currentItems().reduce((a, it) => a + (rec(it.id).checked && isCorrect(it) ? pointsFor(it) : 0), 0);
function startTest(configs, shouldSave) {
  const ids = [], points = {}, saved = [];
  for (const c of configs) {
    if (!(c.count > 0)) continue;
    const avail = bank.byCat[c.cat] || [];
    const n = Math.min(c.count, avail.length);
    if (!n) continue;
    shuffle(avail.slice()).slice(0, n).forEach(it => ids.push(it.id));
    points[c.cat] = Math.max(0, c.points | 0);
    saved.push({ cat: c.cat, count: n, points: points[c.cat] });
  }
  if (!ids.length) return false;
  if (shouldSave) {
    let k = S.savedTests.length + 1;
    while (S.savedTests.some(t => t.title === 'Тест ' + k)) k++;
    S.savedTests.unshift({ id: sid('saved-test', S.setId + '|' + k + '|' + Date.now()), title: 'Тест ' + k, setId: S.setId, setTitle: setTitle(curSet()), configs: saved, createdAt: Date.now() });
  }
  remember();
  S.test = { setId: S.setId, ids, points };
  S.starOnly = false;
  S.index = 0;
  ids.forEach(id => { const it = bank.byId.get(id); resetItem(it); shuffleQ(it); });
  save();
  return true;
}

/* =========================================================
   Loading sets
   ========================================================= */
async function loadBank(entry) {
  if (BANKS.has(entry.id)) return BANKS.get(entry.id);
  if (LOADING.has(entry.id)) return LOADING.get(entry.id);
  const p = (async () => {
    let text;
    if (entry.rec) text = await Store.getFile(entry.rec);
    else {
      const r = await fetch('data/' + encodeURIComponent(entry.file));
      if (!r.ok) throw new Error('Встроенный файл не открылся (код ' + r.status + ').');
      text = await r.text();
    }
    text = text.replace(/^﻿/, '');
    entry.hash = cyrb53(text).toString(36);
    const b = buildBank(JSON.parse(text));
    BANKS.set(entry.id, b);
    return b;
  })().catch(e => { const v = { error: e.message || String(e) }; BANKS.set(entry.id, v); return v; })
    .finally(() => LOADING.delete(entry.id));
  LOADING.set(entry.id, p);
  return p;
}
function applyBank(b) {
  if (!b || b.error) { bank = EMPTY_BANK; bankStatus = 'error'; bankError = (b && b.error) || 'Неизвестная ошибка'; return; }
  bank = b; bankStatus = 'ready'; bankError = '';
  if (S.test && (S.test.setId !== S.setId || !S.test.ids.some(id => bank.byId.has(id)))) S.test = null;
  clampIndex();
}
function activateSet() {
  const s = curSet();
  if (!s) { bank = EMPTY_BANK; bankStatus = 'ready'; loadingPromise = Promise.resolve(); return loadingPromise; }
  if (BANKS.has(s.id)) { applyBank(BANKS.get(s.id)); loadingPromise = Promise.resolve(); return loadingPromise; }
  bank = EMPTY_BANK; bankStatus = 'loading'; bankError = '';
  const id = s.id;
  loadingPromise = loadBank(s).then(b => { if (S.setId === id) { applyBank(b); renderAll(); } });
  return loadingPromise;
}

/* ---------- import ---------- */
function uniqueTitle(t) {
  const taken = new Set(SETS.map(s => setTitle(s).toLowerCase()));
  if (!taken.has(t.toLowerCase())) return t;
  let k = 2;
  while (taken.has((t + ' (' + k + ')').toLowerCase())) k++;
  return t + ' (' + k + ')';
}
async function importFiles(files) {
  for (const f of files) {
    let text;
    try { text = await f.text(); } catch (e) { await alertDlg('Не удалось прочитать файл', f.name); continue; }
    await importText(text, (f.name || '').replace(/\.[^.]+$/, '').trim() || 'вопросы');
  }
}
async function importText(text, title) {
  text = String(text).replace(/^﻿/, '').trim();
  title = (title || '').trim() || 'вопросы';
  let raw;
  try { raw = JSON.parse(text); }
  catch (e) { return alertDlg('Это не JSON', '«' + title + '» не читается как JSON: ' + e.message + '\n\nПроверьте, что файл скопирован целиком.'); }
  let b;
  try { b = buildBank(raw); } catch (e) { return alertDlg('Формат не подходит', e.message); }
  if (!b.total) return alertDlg('В файле нет вопросов', 'Ожидается объект вида {"Текст вопроса": {"type": "single", "all_options": [...]}}. Поддерживаются типы single, multiple, dropdown, sortable, text_input и drag_and_drop.');
  const hash = cyrb53(text).toString(36);
  const same = SETS.find(s => (s.rec && s.rec.hash === hash) || s.hash === hash);
  if (same) {
    selectSet(same.id); closeDrawer(); renderAll();
    return toast('«' + setTitle(same) + '» уже загружен — открыл его');
  }
  let targetId = null;
  const twin = SETS.find(s => setTitle(s).toLowerCase() === title.toLowerCase());
  if (twin) {
    const r = await dialog({
      title: 'Файл «' + title + '» уже есть',
      message: 'Обновить его этой версией? Прогресс и избранное сохранятся у совпадающих вопросов.',
      buttons: [{ id: 'update', label: 'Обновить', kind: 'primary' }, { id: 'new', label: 'Добавить отдельным файлом' }, { id: 'cancel', label: 'Отмена' }],
      vertical: true
    });
    if (r.id === 'cancel') return;
    if (r.id === 'update') targetId = twin.id; else title = uniqueTitle(title);
  }
  const done = busy('Сохраняю файл…');
  let ref;
  try { ref = await Store.putFile(text); }
  catch (e) { done(); return alertDlg('Файл не сохранился', e.message); }
  done();
  const id = targetId || ('imp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  const old = S.sets.find(r => r.id === id);
  const entry = { id, title: targetId ? ((old && old.title) || twin.title) : title, store: ref.store, ref: ref.ref, addedAt: Date.now(), hash, count: b.total };
  if (old) { Store.delFile(old); S.sets = S.sets.map(r => r.id === id ? entry : r); } else S.sets.push(entry);
  BANKS.set(id, b);
  rebuildSets();
  if (S.setId === id) { endTest(); applyBank(b); } else selectSet(id);
  save();
  closeDrawer();
  renderAll();
  const extra = b.skipped ? ', пропущено ' + b.skipped : '';
  toast((targetId ? 'Обновлено' : 'Загружено') + ': «' + setTitle(SETS.find(s => s.id === id)) + '» — ' + b.total + ' ' + plural(b.total, 'вопрос', 'вопроса', 'вопросов') + extra);
}
async function deleteSet(id) {
  const s = SETS.find(x => x.id === id);
  if (!s) return;
  if (S.test && S.test.setId === id) S.test = null;
  if (s.rec) { S.sets = S.sets.filter(r => r.id !== id); Store.delFile(s.rec); }
  if (s.bundled && !S.hiddenBundled.includes(id)) S.hiddenBundled.push(id);
  for (const k of Object.keys(S.answers)) if (k.startsWith(id + '|')) delete S.answers[k];
  for (const k of Object.keys(S.indexByScope)) if (k.startsWith(id + '|')) delete S.indexByScope[k];
  dropResults(id);
  delete S.starred[id];
  delete S.titles[id];
  S.savedTests = S.savedTests.filter(t => t.setId !== id);
  BANKS.delete(id);
  rebuildSets();
  if (S.setId === id) {
    S.setId = SETS.length ? SETS[0].id : '';
    S.category = 'multiple'; S.starOnly = false;
    S.index = S.indexByScope[scopeKey()] || 0;
    activateSet();
  }
  save();
  renderAll();
}

/* =========================================================
   Rendering
   ========================================================= */
const elContent = $('#content'), elScroller = $('#scroller');

function renderAll() { render(); if (drawerOpen && !docked()) renderMenuBody(); }
function render() {
  document.documentElement.style.setProperty('--fs', String(S.fontScale));
  renderTop();
  renderContent();
  renderBottom();
  if (docked()) renderMenuBody();
  tourSoon();
}

function menuFocusKey(el) {

let lastMenuQ = '';
/* ---------- menu search: results with highlighted matches ---------- */
const SRES_MAX = 80; // searchBank() returns at most this many
const isSubseq = (needle, hay) => { let i = 0; for (const ch of hay) { if (ch === needle[i]) i++; if (i === needle.length) return true; } return i === needle.length; };
// Same normalisation as norm(), but char by char, remembering where each char came from.
function normMap(text) {
  let s = '';
  const map = [];
  for (let i = 0; i < text.length; i++) {
    let n = text[i].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (n && !/^[\p{L}\p{N}]+$/u.test(n)) n = ' ';
    for (let k = 0; k < n.length; k++) { s += n[k]; map.push(i); }
  }
  return { s, map };
}
// Ranges [start, end) of the original text that match the query tokens (typos: the whole word).
function matchRanges(text, toks) {
  const { s, map } = normMap(text);
  const out = [];
  for (const t of toks) {
    if (t.length < 2 && toks.length > 1) continue;
    let found = false;
    for (let p = s.indexOf(t); p !== -1; p = s.indexOf(t, p + t.length)) { out.push([map[p], map[p + t.length - 1] + 1]); found = true; }
    if (found || t.length <= 2) continue;
    for (const m of s.matchAll(/[\p{L}\p{N}]+/gu)) {
      const w = m[0];
      if (w.length <= t.length + 4 && isSubseq(t, w)) out.push([map[m.index], map[m.index + w.length - 1] + 1]);
    }
  }
  out.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const r of out) { const last = merged[merged.length - 1]; if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r.slice()); }
  return merged;
}
function markHTML(text, ranges) {
  let h = '', at = 0;
  for (const [a, b] of ranges) { h += esc(text.slice(at, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; at = b; }
  return h + esc(text.slice(at));
}
// Tokens of the query that this text contains (exactly, or as a typo of one of its words).
function tokensIn(text, toks) {
  const { s } = normMap(text);
  const words = s.match(/[\p{L}\p{N}]+/gu) || [];
  return toks.filter(t => s.includes(t) || (t.length > 2 && words.some(w => isSubseq(t, w))));
}
// The question with matches marked; for a long question whose match would fall past the 3-line clamp, start near the match.
function titleHTML(title, toks) {
  let text = title;
  let ranges = matchRanges(text, toks);
  if (ranges.length && text.length > 75 && ranges[0][0] > 50) {
    let a = ranges[0][0] - 28;
    const sp = text.indexOf(' ', a);
    if (sp !== -1 && sp < ranges[0][0]) a = sp + 1;
    text = '…' + text.slice(a);
    ranges = matchRanges(text, toks);
  }
  return markHTML(text, ranges);
}
function searchFields(it) {
  switch (it.kind) {
    case 'case': return it.subs.map(s => ({ label: 'Вопрос кейса', text: s.prompt })).concat([{ label: 'Кейс', text: it.mainText }]);
    case 'dropdown': return it.rows.map(r => ({ label: 'Пара', text: r.left + ' — ' + r.value }));
    case 'sortable': return it.order.map(t => ({ label: 'Пункт', text: t }));
    case 'text': return it.accepted.map(t => ({ label: 'Ответ', text: t }));
    default: return (it.options || []).map(o => ({ label: 'Вариант', text: o.text }));
  }
}
// A short piece of text around the first match, when the match is not in the question itself.
function snippetHTML(it, toks) {
  const inTitle = tokensIn(it.title, toks);
  if (inTitle.length === toks.length) return '';
  const rest = toks.filter(t => !inTitle.includes(t));
  let best = null, bestN = 0;
  for (const f of searchFields(it)) {
    const n = tokensIn(f.text, rest).length;
    if (n > bestN) { best = f; bestN = n; if (n === rest.length) break; }
  }
  if (!best) return '';
  let text = best.text.replace(/\s+/g, ' ').trim();
  const r = matchRanges(text, rest)[0];
  if (r && text.length > 90) {
    // Start just before the match so it stays on the first visible line (the snippet is clamped to 2 lines).
    let a = Math.max(0, r[0] - 18), b = Math.min(text.length, a + 110);
    if (a > 0) { const sp = text.indexOf(' ', a); if (sp !== -1 && sp < r[0]) a = sp + 1; }
    if (b < text.length) { const sp = text.lastIndexOf(' ', b); if (sp > r[1]) b = sp; }
    text = (a > 0 ? '…' : '') + text.slice(a, b) + (b < best.text.length ? '…' : '');
  }
  return `<span class="sres-snip"><em>${best.label}:</em> ${markHTML(text, matchRanges(text, rest))}</span>`;
}

const anySheet = () => !!document.querySelector('.sheet-wrap:not(.closing)');
function openSheet({ cls = '', html, onClick, onClose, dismissible = true }) {
  hideToast();
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-scrim"></div><div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(wrap);
  const panel = wrap.querySelector('.sheet');
  let closed = false;
  const onKey = e => { if (e.key === 'Escape' && dismissible) { e.stopPropagation(); close(); } };
  function close() {
    if (closed) return;
    closed = true;
    document.removeEventListener('keydown', onKey, true);
    wrap.classList.add('closing');
    setTimeout(() => wrap.remove(), 190);
    if (onClose) onClose();
  }
  document.addEventListener('keydown', onKey, true);
  wrap.querySelector('.sheet-scrim').addEventListener('click', () => { if (dismissible) close(); });
  panel.addEventListener('click', e => {
    const b = e.target.closest('[data-s]');
    if (b && !b.disabled && panel.contains(b) && onClick) onClick(b.dataset.s, b, e, close);
  });
  return { panel, close };
}
function dialog({ title, message = '', input = null, buttons, vertical = false }) {
  return new Promise(resolve => {
    let done = false;
    const html = `<div class="dlg"><div class="dlg-title">${esc(title)}</div>${message ? `<div class="dlg-msg">${esc(message)}</div>` : ''}${input ? `<input id="dlgInput" class="f-in" ${input.numeric ? 'inputmode="numeric" pattern="[0-9]*"' : ''} value="${esc(input.value || '')}" placeholder="${esc(input.placeholder || '')}" autocomplete="off" aria-label="${esc(input.placeholder || title)}">` : ''}<div class="dlg-btns${vertical ? ' v' : ''}">${buttons.map(b => `<button type="button" class="dlg-btn ${b.kind || ''}" data-s="${b.id}">${esc(b.label)}</button>`).join('')}</div></div>`;
    const sh = openSheet({
      cls: 'dialog', html,
      onClick: (id, el, e, close) => { const inp = sh.panel.querySelector('#dlgInput'); done = true; close(); resolve({ id, value: inp ? inp.value : '' }); },
      onClose: () => { if (!done) { done = true; resolve({ id: 'cancel', value: '' }); } }
    });
    const inp = sh.panel.querySelector('#dlgInput');
    if (inp) {
      inp.focus();
      if (inp.select) inp.select();
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const p = sh.panel.querySelector('.dlg-btn.primary'); if (p) p.click(); } });
    }
  });
}

let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');

  t.hidden = false;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); setTimeout(() => { t.hidden = true; }, 220); }, 2800);
}
// An old message shouldn't cover a menu or sheet that has just been opened.
function hideToast() {
  const t = $('#toast');

function haptic() {
  try {
    if (navigator.vibrate) { navigator.vibrate(12); return; }
    const l = document.createElement('label');
    l.setAttribute('aria-hidden', 'true');
    l.hidden = true;
    const i = document.createElement('input');
    i.type = 'checkbox';
    i.setAttribute('switch', '');
    l.appendChild(i);
    document.head.appendChild(l);
    l.click();
    l.remove();
  } catch (e) { /* no haptics here */ }
}

function answeredCount(id) {
  let n = 0;
  for (const [k, r] of Object.entries(S.answers)) {
    if (!k.startsWith(id + '|') || !r) continue;
    if (r.checked || r.sel != null || (r.multi && r.multi.length) || (r.dd && Object.keys(r.dd).length) || r.moved || (r.text && r.text.trim())) n++;
  }
  for (const k of Object.keys(S.results)) if (k.startsWith(id + '|') && !S.answers[k]) n++;

async function shareSetFile(s, text) {
  const name = setFileName(s);
  if (Store.downloads) {
    // Inside claude.ai the page can't download by itself: the viewer confirms the save
    // (on iPhone the Claude app then opens the share sheet).
    try { await Store.downloads.save({ filename: name, data: text }); }
    catch (e) {
      const code = e && e.code;
      if (code === 'declined') return;
      toast(code === 'rate_limited' ? 'Подождите секунду и попробуйте ещё раз' : 'Здесь не получилось сохранить файл');
    }
    return;
  }
  const file = new File([text], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: setTitle(s) }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast('Скачивается «' + name + '»');
}
