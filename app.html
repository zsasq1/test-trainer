function openMakeTest() {
  if (!bankReady() || !curSet()) return toast('Сначала выберите файл с вопросами');
  const avail = c => (bank.byCat[c] || []).length;
  // Categories with questions first (their order is the order in the test), empty ones last.
  const cfg = { order: CATS.filter(c => avail(c) > 0).concat(CATS.filter(c => avail(c) <= 0)), counts: {}, points: {} };
  CATS.forEach(c => { cfg.counts[c] = 0; cfg.points[c] = 0; });
  const active = () => cfg.order.filter(c => avail(c) > 0);
  const totals = () => [cfg.order.reduce((a, c) => a + cfg.counts[c], 0), cfg.order.reduce((a, c) => a + cfg.counts[c] * cfg.points[c], 0)];
  const stepper = (label, kind, c, v, max) => `<div class="mt-step"><span class="mt-lbl">${label}</span><span class="mt-ctrls"><button type="button" class="sq-btn" data-s="${kind}-" data-cat="${c}" aria-label="${label}: меньше"${v <= 0 ? ' disabled' : ''}>${I.minus}</button><input class="num-in" data-num="${kind}" data-cat="${c}" inputmode="numeric" pattern="[0-9]*" value="${v || ''}" placeholder="0" aria-label="${label}: ${CAT_TITLE[c]}"><button type="button" class="sq-btn" data-s="${kind}+" data-cat="${c}" aria-label="${label}: больше"${v >= max ? ' disabled' : ''}>${I.plus}</button></span></div>`;
  const bodyHTML = () => {
    const act = active();
    let h = act.length > 1 ? '<div class="mt-hint">Порядок разделов в тесте — стрелками ↑↓</div>' : '';
    act.forEach((c, k) => {
      h += `<div class="mt-card${cfg.counts[c] ? ' on' : ''}" data-card="${c}"><div class="mt-top"><span class="mt-ico">${I.cat[c]}</span><span class="mt-title">${CAT_TITLE[c]}<small>Доступно: ${avail(c)}</small></span>${act.length > 1 ? `<span class="mt-ord"><button type="button" class="sq-btn" data-s="up" data-cat="${c}" aria-label="Поднять «${CAT_TITLE[c]}»"${k === 0 ? ' disabled' : ''}>${I.up}</button><button type="button" class="sq-btn" data-s="down" data-cat="${c}" aria-label="Опустить «${CAT_TITLE[c]}»"${k === act.length - 1 ? ' disabled' : ''}>${I.down}</button></span>` : ''}</div>
<div class="mt-steps">${stepper('Вопросов', 'cnt', c, cfg.counts[c], avail(c))}${stepper('Баллов за вопрос', 'pts', c, cfg.points[c], 100)}</div></div>`;
    });
    cfg.order.filter(c => avail(c) <= 0).forEach(c => {
      h += `<div class="mt-card off"><span class="mt-ico">${I.cat[c]}</span><span class="mt-title">${CAT_TITLE[c]} — нет вопросов</span></div>`;
    });
    if (S.test) h += `<button type="button" class="act red wide" data-s="end">${I.x}Завершить текущий тест</button>`;
    return h;
  };
  const html = `<div class="sheet-head"><button type="button" class="mt-x" data-s="close" aria-label="Закрыть">${I.x}</button><div class="mt-htitle">Сделать тест<small id="mtSum" aria-live="polite"></small></div><button type="button" class="mt-go" data-s="start" id="mtStart">${I.play}Начать</button></div><div class="sheet-body" id="mtBody"></div>`;
  const sh = openSheet({
    cls: 'full mt', html,
    onClick: (id, el, e, close) => {
      const c = el.dataset.cat;
      if (id === 'close') return close();
      if (id === 'end') { endTest(); close(); renderAll(); return; }
      if (id === 'start') {
        if (!totals()[0]) return;
        if (startTest(cfg.order.map(cat => ({ cat, count: cfg.counts[cat], points: cfg.points[cat] })), true)) { close(); closeDrawer(); renderAll(); toast('Тест начат: ' + currentItems().length + ' ' + plural(currentItems().length, 'вопрос', 'вопроса', 'вопросов')); }
        return;
      }
      if (id === 'up' || id === 'down') {
        const act = active(), i = act.indexOf(c), j = i + (id === 'up' ? -1 : 1);
        if (i >= 0 && j >= 0 && j < act.length) {
          [act[i], act[j]] = [act[j], act[i]];
          cfg.order = act.concat(cfg.order.filter(x => avail(x) <= 0));
        }
      }
      if (id === 'cnt-') cfg.counts[c] = Math.max(0, cfg.counts[c] - 1);
      if (id === 'cnt+') cfg.counts[c] = Math.min(avail(c), cfg.counts[c] + 1);
      if (id === 'pts-') cfg.points[c] = Math.max(0, cfg.points[c] - 1);
      if (id === 'pts+') cfg.points[c] = Math.min(100, cfg.points[c] + 1);
      draw();
      if (id === 'up' || id === 'down') {
        // keep the moved card in view and the finger on the same arrow when possible
        const card = body.querySelector(`[data-card="${c}"]`);
        if (card) card.scrollIntoView({ block: 'nearest' });
      }
    }
  });
  const body = sh.panel.querySelector('#mtBody');
  const sum = sh.panel.querySelector('#mtSum');
  const sync = () => {
    const [q, p] = totals();
    sum.textContent = q ? q + ' ' + plural(q, 'вопрос', 'вопроса', 'вопросов') + ', ' + p + ' ' + plural(p, 'балл', 'балла', 'баллов') : 'выберите вопросы';
    sum.classList.toggle('on', q > 0);
    sh.panel.querySelector('#mtStart').disabled = !q;
    body.querySelectorAll('[data-card]').forEach(el => {
      const c = el.dataset.card;
      el.classList.toggle('on', cfg.counts[c] > 0);
      // update −/+ in place (no re-render, so a tap right after typing is not lost)
      [['cnt', cfg.counts[c], avail(c)], ['pts', cfg.points[c], 100]].forEach(([k, v, max]) => {
        const minus = el.querySelector(`[data-s="${k}-"]`), plus = el.querySelector(`[data-s="${k}+"]`);
        if (minus) minus.disabled = v <= 0;
        if (plus) plus.disabled = v >= max;
      });
    });
  };
  function draw() { const t = body.scrollTop; body.innerHTML = bodyHTML(); body.scrollTop = t; sync(); }
  body.addEventListener('input', e => {
    const inp = e.target.closest('.num-in');
    if (!inp) return;
    const c = inp.dataset.cat, max = inp.dataset.num === 'cnt' ? avail(c) : 100;
    const digits = inp.value.replace(/\D/g, '');
    const v = digits ? clamp(parseInt(digits, 10), 0, max) : 0;
    if (inp.dataset.num === 'cnt') cfg.counts[c] = v; else cfg.points[c] = v;
    if (digits && String(v) !== inp.value) inp.value = String(v);
    sync();
  });
  body.addEventListener('change', e => {
    const inp = e.target.closest('.num-in');
    if (!inp) return;
    const v = inp.dataset.num === 'cnt' ? cfg.counts[inp.dataset.cat] : cfg.points[inp.dataset.cat];
    inp.value = v ? String(v) : '';
    sync();
  });
  draw();
}

/* ---------- add own subquestion to a case ---------- */
function openAddSub(caseId) {
  const fresh = () => ({ prompt: '', options: [{ text: '', correct: true }, { text: '', correct: false }], order: ['', ''], choices: [''], rows: [{ left: '', value: '' }], answers: [''] });
  let type = 'single';
  let m = fresh();
  const tr = s => String(s || '').trim();
  const valid = () => {
    if (!tr(m.prompt)) return false;
    switch (type) {
      case 'single': case 'multiple': return m.options.length >= 2 && m.options.every(o => tr(o.text)) && m.options.some(o => o.correct);
      case 'sortable': return m.order.length >= 2 && m.order.every(v => tr(v));
      case 'dropdown': { const ch = m.choices.map(tr).filter(Boolean); return ch.length > 0 && m.rows.length > 0 && m.rows.every(r => tr(r.left) && ch.includes(tr(r.value))); }
      case 'text': return m.answers.some(v => tr(v));
    }
    return false;
  };
  const add = (act, label) => `<button type="button" class="f-add" data-s="${act}">${I.plus}${label}</button>`;
  const del = (act, i, label) => `<button type="button" class="f-del" data-s="${act}" data-i="${i}" aria-label="${label}">${I.minus}</button>`;
  const bodyHTML = () => {
    let h = '<div class="sec-label">Тип вопроса</div><div class="chips">' + SUB_TYPES.map(([t, short]) => `<button type="button" class="chip${type === t ? ' on' : ''}" data-s="type" data-t="${t}" aria-pressed="${type === t}">${I.sub[t]}<span>${short}</span></button>`).join('') + '</div>';
    h += `<div class="sec-label">Вопрос</div><textarea class="f-in f-prompt" data-f="prompt" rows="2" placeholder="Текст вопроса" aria-label="Текст вопроса">${esc(m.prompt)}</textarea>`;
    if (type === 'single' || type === 'multiple') {
      h += `<div class="sec-label">${type === 'single' ? 'Варианты (отметьте один верный)' : 'Варианты (отметьте верные)'}</div>`;
      h += m.options.map((o, i) => `<div class="f-line"><button type="button" class="f-mark" data-s="opt-ok" data-i="${i}" aria-pressed="${o.correct}" aria-label="Верный вариант ${i + 1}">${type === 'single' ? (o.correct ? I.radioOn : I.radioOff) : (o.correct ? I.boxOn : I.boxOff)}</button><input class="f-in" data-f="opt" data-i="${i}" value="${esc(o.text)}" placeholder="Вариант ${i + 1}" aria-label="Вариант ${i + 1}">${m.options.length > 2 ? del('opt-del', i, 'Удалить вариант') : ''}</div>`).join('');
      h += add('opt-add', 'Добавить вариант');
    } else if (type === 'sortable') {
      h += '<div class="sec-label">Элементы в правильном порядке</div>';
      h += m.order.map((v, i) => `<div class="f-line"><span class="f-num">${i + 1}.</span><input class="f-in" data-f="ord" data-i="${i}" value="${esc(v)}" placeholder="Элемент ${i + 1}" aria-label="Элемент ${i + 1}">${m.order.length > 2 ? del('ord-del', i, 'Удалить элемент') : ''}</div>`).join('');
      h += add('ord-add', 'Добавить элемент');
    } else if (type === 'dropdown') {
      const ch = uniq(m.choices.map(tr).filter(Boolean));
      h += '<div class="sec-label">Все варианты в выпадающем списке</div>';
      h += m.choices.map((v, i) => `<div class="f-line"><input class="f-in" data-f="choice" data-i="${i}" value="${esc(v)}" placeholder="Вариант выбора ${i + 1}" aria-label="Вариант выбора ${i + 1}">${m.choices.length > 1 ? del('ch-del', i, 'Удалить вариант выбора') : ''}</div>`).join('');
      h += add('ch-add', 'Добавить вариант выбора') + '<div class="f-hr"></div><div class="sec-label">Строки</div>';
      h += m.rows.map((r, i) => `<div class="f-card"><div class="f-card-head"><span>Строка ${i + 1}</span>${m.rows.length > 1 ? `<button type="button" data-s="row-del" data-i="${i}">Удалить строку</button>` : ''}</div><input class="f-in" data-f="left" data-i="${i}" value="${esc(r.left)}" placeholder="Текст слева, например «Кислород —»" aria-label="Текст строки ${i + 1}"><div class="f-sel"><span>Правильный выбор:</span>${ch.length ? `<select data-f="val" data-i="${i}" aria-label="Правильный выбор для строки ${i + 1}"><option value="">Выбрать</option>${ch.map(c => `<option value="${esc(c)}"${c === tr(r.value) ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>` : '<span class="f-warn">Добавьте варианты выше</span>'}</div></div>`).join('');
      h += add('row-add', 'Добавить строку');
    } else {
      h += '<div class="sec-label">Варианты правильного ответа</div>';
      h += m.answers.map((v, i) => `<div class="f-line"><input class="f-in" data-f="ans" data-i="${i}" value="${esc(v)}" placeholder="Ответ ${i + 1}" autocapitalize="off" aria-label="Ответ ${i + 1}">${m.answers.length > 1 ? del('ans-del', i, 'Удалить ответ') : ''}</div>`).join('');
      h += add('ans-add', 'Добавить правильный ответ');
    }
    const existing = customSubsOf(caseId);
    if (existing.length) {
      h += '<div class="sec-label">Ваши вопросы</div>' + existing.map(s => `<div class="exist"><div class="exist-txt"><b>${esc(s.prompt)}</b><span>${esc(SUB_TITLE[s.type] || '')}. Ответ: ${esc(answerText(subToQ(s), true).replace(/\n/g, '; '))}</span></div><button type="button" class="f-del" data-s="exist-del" data-id="${esc(s.id)}" aria-label="Удалить вопрос">${I.trash}</button></div>`).join('');
    }
    return h;
  };
  const html = `<div class="sheet-head"><button type="button" class="head-btn" data-s="close">Закрыть</button><div class="head-title">Добавить вопрос</div><button type="button" class="head-btn end" data-s="add" id="asTop">Добавить</button></div><div class="sheet-body" id="asBody"></div><div class="sheet-foot"><button type="button" class="act green wide" data-s="add" id="asBtn">${I.plus}Добавить вопрос</button></div>`;
  const sh = openSheet({
    cls: 'full', html,
    onClick: (id, el, e, close) => {
      const i = +el.dataset.i;
      switch (id) {
        case 'close': return close();
        case 'type': type = el.dataset.t; break;
        case 'opt-ok': if (type === 'single') m.options.forEach((o, k) => { o.correct = k === i; }); else m.options[i].correct = !m.options[i].correct; break;
        case 'opt-del': m.options.splice(i, 1); break;
        case 'opt-add': m.options.push({ text: '', correct: false }); break;
        case 'ord-del': m.order.splice(i, 1); break;
        case 'ord-add': m.order.push(''); break;
        case 'ch-del': { const gone = tr(m.choices[i]); m.choices.splice(i, 1); m.rows.forEach(r => { if (tr(r.value) === gone) r.value = ''; }); break; }
        case 'ch-add': m.choices.push(''); break;
        case 'row-del': m.rows.splice(i, 1); break;
        case 'row-add': m.rows.push({ left: '', value: '' }); break;
        case 'ans-del': m.answers.splice(i, 1); break;
        case 'ans-add': m.answers.push(''); break;
        case 'exist-del':
          S.customSubs[caseId] = customSubsOf(caseId).filter(s => s.id !== el.dataset.id);
          if (!S.customSubs[caseId].length) delete S.customSubs[caseId];
          save(); render();
          break;
        case 'add': {
          if (!valid()) return;
          const prompt = tr(m.prompt);
          const sub = { id: sid('custom-sub', caseId + '|' + prompt + '|' + Date.now()), type, prompt, createdAt: Date.now() };
          if (type === 'single' || type === 'multiple') sub.options = m.options.map(o => ({ text: tr(o.text), correct: !!o.correct }));
          if (type === 'sortable') sub.order = m.order.map(tr);
          if (type === 'dropdown') { sub.choices = uniq(m.choices.map(tr).filter(Boolean)); sub.rows = m.rows.map(r => ({ left: tr(r.left), value: tr(r.value) })); }
          if (type === 'text') sub.accepted = m.answers.map(tr).filter(Boolean);
          (S.customSubs[caseId] = customSubsOf(caseId).slice()).push(sub);
          const it = currentItem();
          if (it && it.id === caseId) mut(caseId, r => { r.checked = false; r.reveal = false; });
          m = fresh();
          save(); render();
          toast('Вопрос добавлен в кейс');
          break;
        }
      }
      draw();
    }
  });
  const body = sh.panel.querySelector('#asBody');
  const sync = () => { const ok = valid(); sh.panel.querySelector('#asBtn').disabled = !ok; sh.panel.querySelector('#asTop').disabled = !ok; };
  function draw() { const t = body.scrollTop; body.innerHTML = bodyHTML(); body.scrollTop = t; sync(); }
  body.addEventListener('input', e => {
    const f = e.target.dataset.f, i = +e.target.dataset.i, v = e.target.value;
    if (f === 'prompt') m.prompt = v;
    else if (f === 'opt') m.options[i].text = v;
    else if (f === 'ord') m.order[i] = v;
    else if (f === 'choice') m.choices[i] = v;
    else if (f === 'left') m.rows[i].left = v;
    else if (f === 'ans') m.answers[i] = v;
    sync();
  });
  body.addEventListener('change', e => {
    const f = e.target.dataset.f;
    if (f === 'val') { m.rows[+e.target.dataset.i].value = e.target.value; sync(); }
    if (f === 'choice') draw();
  });
  draw();
}

/* =========================================================
   Events
   ========================================================= */
const ACT = {
  'menu': () => openDrawer(),
  'm-close': () => closeDrawer(),
  'pick': el => { pick(el.dataset.qid, +el.dataset.i); render(); },
  'dd-open': el => openDDPicker(el.dataset.qid, +el.dataset.row),
  'check': () => check(),
  'reveal': () => { reveal(); render(); },
  'finish': () => openFinish(),
  'star': () => {
    const it = currentItem(); if (!it) return;
    toggleStar(it.id); haptic(); render();
    const b = document.querySelector('.star-btn'); if (b) b.classList.add('pop');
  },
  'toggle-auto': () => {
    S.autoAdvance = !S.autoAdvance; save(); renderAll();
    toast(S.autoAdvance ? 'Автопереход включён: после верного ответа — следующий вопрос' : 'Автопереход выключен: после верного ответа вопрос перемешается');
  },
  'add-sub': () => { const it = currentItem(); if (it && it.kind === 'case') openAddSub(it.id); },
  'del-sub': async el => {
    const r = await dialog({ title: 'Удалить ваш вопрос?', buttons: [{ id: 'cancel', label: 'Отмена' }, { id: 'ok', label: 'Удалить', kind: 'danger' }] });
    if (r.id !== 'ok') return;
    const c = el.dataset.case;
    S.customSubs[c] = customSubsOf(c).filter(s => s.id !== el.dataset.sub);
    if (!S.customSubs[c].length) delete S.customSubs[c];
    save(); render();
  },
  'paste-json': () => openPaste(),
  'm-set': el => { selectSet(el.dataset.id); elSearch.value = ''; renderAll(); },
  'm-set-more': el => openSetActions(el.dataset.id),
  'm-unhide': () => { S.hiddenBundled = []; rebuildSets(); save(); renderAll(); toast('Встроенные файлы снова в списке'); },
  'm-cat': el => { selectCategory(el.dataset.cat); closeDrawer(); render(); },
  'm-star-cat': el => { selectStarred(el.dataset.cat); closeDrawer(); render(); },
  'm-star-clear': async el => {
    const c = el.dataset.cat;
    const r = await dialog({ title: 'Очистить избранное?', message: 'Звёздочки в категории «' + CAT_TITLE[c] + '» будут сняты.', buttons: [{ id: 'cancel', label: 'Отмена' }, { id: 'ok', label: 'Очистить', kind: 'danger' }] });
    if (r.id !== 'ok') return;
    const ids = new Set((bank.byCat[c] || []).map(it => it.id));
    const left = (S.starred[S.setId] || []).filter(id => !ids.has(id));
    if (left.length) S.starred[S.setId] = left; else delete S.starred[S.setId];
    if (S.starOnly && S.category === c) { S.starOnly = false; S.index = S.indexByScope[scopeKey()] || 0; clampIndex(); }
    save(); renderAll();
  },
  'm-maketest': () => openMakeTest(),
  'm-saved': async el => {
    const t = S.savedTests.find(x => x.id === el.dataset.id);
    if (!t) return;
    if (!SETS.some(s => s.id === t.setId)) return toast('Файл этого теста удалён');
    if (S.setId !== t.setId) { selectSet(t.setId); render(); await loadingPromise; }
    if (!bankReady()) return toast('Файл теста не открылся');
    if (startTest(t.configs, false)) { closeDrawer(); renderAll(); toast(t.title + ': ' + currentItems().length + ' ' + plural(currentItems().length, 'вопрос', 'вопроса', 'вопросов')); }
  },
  'm-saved-del': async el => {
    const t = S.savedTests.find(x => x.id === el.dataset.id);
    if (!t) return;
    const r = await dialog({ title: 'Удалить «' + t.title + '»?', buttons: [{ id: 'cancel', label: 'Отмена' }, { id: 'ok', label: 'Удалить', kind: 'danger' }] });
    if (r.id === 'ok') { S.savedTests = S.savedTests.filter(x => x.id !== t.id); save(); renderMenuBody(); }
  },
  'm-result': el => { selectItem(el.dataset.cat, el.dataset.id); elSearch.value = ''; closeDrawer(); render(); },
  'm-font-dec': () => setFont(S.fontScale - 0.1),
  'm-font-inc': () => setFont(S.fontScale + 0.1),
  'm-font-reset': () => setFont(1),
  'm-tour': () => {
    const name = TOURS.main.when() ? 'main' : TOURS.intro.when() ? 'intro' : '';
    if (!name) return toast('Откройте любой вопрос — и обучение покажет, как заниматься');
    const wasOpen = drawerOpen;
    closeDrawer();
    setTimeout(() => startTour(name), wasOpen ? 300 : 0); // let the menu slide away first
  }
};
function setFont(v) { S.fontScale = Math.round(clamp(v, 0.5, 1.6) * 100) / 100; save(); render(); renderMenuBody(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || el.closest('.sheet')) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  const lbl = e.target.closest && e.target.closest('label[role="button"]');
  if (lbl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); lbl.click(); return; }
  if (anySheet() || drawerOpen) { if (drawerOpen && e.key === 'Escape') closeDrawer(); return; }
  if (e.key === 'Escape' && e.target === elSearch) { elSearch.blur(); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const press = sel => { const b = document.querySelector(sel); if (b && !b.disabled) { e.preventDefault(); b.click(); } };
  if (e.key === 'ArrowRight') { goNext(); render(); }
  else if (e.key === 'ArrowLeft') { goPrev(); render(); }
  else if (/^[1-9]$/.test(e.key)) press(`#content .choice[data-key="${e.key}"]`);
  // Enter checks — unless focus is on some other button, which Enter should press as usual.
  else if (e.key === 'Enter') { const t = e.target.closest && e.target.closest('button, a, label, summary, [role="button"]'); if (!t || t.classList.contains('choice')) press('[data-act="check"]'); }
  else if (e.code === 'KeyG') press('[data-act="reveal"]');
  else if (e.code === 'Slash' && docked()) { e.preventDefault(); elSearch.focus(); }
});
elScrim.addEventListener('click', closeDrawer);

/* file input & drop */
const fileInput = $('#fileInput');
fileInput.addEventListener('change', async () => {
  const files = [...fileInput.files];
  fileInput.value = '';
  if (files.length) await importFiles(files);
});
let dropEl = null;
window.addEventListener('dragover', e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
  if (!dropEl) { dropEl = document.createElement('div'); dropEl.className = 'dropzone'; dropEl.textContent = 'Отпустите JSON, чтобы загрузить'; document.body.appendChild(dropEl); }
});
window.addEventListener('dragleave', e => { if (dropEl && (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= innerWidth || e.clientY >= innerHeight)) { dropEl.remove(); dropEl = null; } });
window.addEventListener('drop', e => {
  if (dropEl) { dropEl.remove(); dropEl = null; }
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  importFiles([...e.dataTransfer.files]);
});

/* search & font slider in the menu */
elSearch.addEventListener('input', renderMenuBody);
// «Найти» on the iPhone keyboard: hide the keyboard, keep the results.
elSearch.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); elSearch.blur(); } });
$('#searchClear').addEventListener('click', e => { e.preventDefault(); elSearch.value = ''; renderMenuBody(); elSearch.focus(); });
elMenuBody.addEventListener('input', e => {
  if (e.target.id !== 'fontRange') return;

  document.documentElement.style.setProperty('--fs', String(S.fontScale));
  const p = $('#fontPct'); if (p) p.textContent = Math.round(S.fontScale * 100) + '%';

elMenuBody.addEventListener('change', e => { if (e.target.id === 'fontRange') { render(); renderMenuBody(); } });

/* text answers: update state without rebuilding the field */

/* prev / next with press-and-hold repeat */

  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = 0; };

  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));

/* swipes: question area and menu */
let sw = null;

/* sortable drag */
let drag = null;
elContent.addEventListener('pointerdown', e => {

  if (!q) return;
  e.preventDefault();
  const rows = [...list.children];
  const rects = rows.map(r => r.getBoundingClientRect());

  drag = { q, rows, rects, from, to: from, startY: e.clientY, y: e.clientY, startScroll: elScroller.scrollTop, step: rects[from].height + gap, id: e.pointerId, raf: 0 };

  const top = r0.top + dy, bottom = r0.bottom + dy;

  d.rects.forEach((r, i) => {
    if (i === d.from) return;
    const mid = r.top + r.height / 2;
    if (i < d.from ? mid < top : mid < bottom) to++;
  });
  d.to = to;
  d.rows.forEach((el, i) => {
    if (i === d.from) { el.style.transform = `translateY(${dy}px)`; return; }
    let off = 0;
    if (d.from < to && i > d.from && i <= to) off = -d.step;

  if (drag.y < sr.top + edge) v = -Math.ceil((sr.top + edge - drag.y) / 5);

/* =========================================================

const KB = window.matchMedia('(hover: hover) and (pointer: fine)');

};
const TOURS = {
  intro: {
    when: () => bankStatus !== 'boot' && !SETS.length,
    steps: [
      { title: 'Тренажёр тестов', text: 'Сначала загрузим файл.', go: 'Начать' },
      { el: '#content .state label.act', title: 'Загрузите файл', text: 'Выберите JSON в «Файлах», iCloud Drive или сохранённый из Telegram. Можно сразу несколько.', allow: 'label', end: true }
    ]
  },
  main: {
    when: () => bankReady() && !!currentItem(),
    steps: [
      { title: 'Как заниматься', text: 'Покажу главное за полминуты. Обучение всегда можно открыть снова в настройках.', go: 'Показать' },
      { el: () => (currentItem() || {}).kind === 'case' ? '#content' : '#content .q', clip: '#scroller', title: 'Вопрос', text: questionHint, allow: '.choice, textarea' },
      { el: '#actionsRow', title: 'Проверить и подглядеть', text: () => '«Проверить» подсветит верные ответы зелёным, ошибки — красным. Глаз покажет ответ без проверки.' + (KB.matches ? ' Клавиши: Enter и П.' : ''), allow: '[data-act="check"], [data-act="reveal"]' },
      { el: '#nextBtn', title: 'Дальше', text: () => KB.matches ? 'Листайте стрелками здесь или клавишами ← и →. Если держать кнопку, вопросы листаются быстро.' : 'Листайте стрелками или свайпом по вопросу. Если держать кнопку, вопросы листаются быстро.', allow: '#nextBtn' },
      { el: '#counter', title: 'Номер вопроса', text: 'Здесь видно, какой это вопрос и из какого файла. Нажмите, чтобы перейти к вопросу по номеру.' },
      { el: '#topActions', title: 'Автопереход и избранное', text: 'Переключатель после верного ответа сразу открывает следующий вопрос. Звёздочка добавляет вопрос в избранное.', allow: '[data-act="toggle-auto"], [data-act="star"]' },
      { el: () => docked() ? '#drawer' : '#menuBtn', title: 'Меню', text: () => docked() ? 'Слева — категории, поиск, избранное, тесты, файлы и настройки. Клавиша / сразу открывает поиск.' : 'Категории, поиск, избранное, тесты, файлы и настройки. Меню открывается и свайпом от левого края.', allow: '#menuBtn', end: true }
    ]
  }
};
let tour = null, tourTimer = 0;
const tourFree = () => !tour && !drawerOpen && !anySheet() && !document.querySelector('.busy') && document.visibilityState === 'visible';
// Called after every render: start a tour the person hasn't seen yet, once the screen has settled.
function tourSoon() {
  if (tour || tourTimer || bankStatus === 'boot') return;
  const name = !S.tour.intro && TOURS.intro.when() ? 'intro' : !S.tour.main && TOURS.main.when() ? 'main' : '';
  if (!name) return;
  tourTimer = setTimeout(() => { tourTimer = 0; if (!S.tour[name] && TOURS[name].when() && tourFree()) startTour(name); }, 700);
}
function startTour(name) {
  if (tour || !TOURS[name].when()) return;
  hideToast();
  const steps = TOURS[name].steps;
  const root = document.createElement('div');
  root.className = 'tour';
  root.setAttribute('role', 'dialog');
  root.setAttribute('aria-modal', 'true');
  root.setAttribute('aria-labelledby', 'tourTitle');
  root.innerHTML = `<div class="tour-safe"></div><div class="tour-hole none"></div><div class="tour-card"><div class="tour-pop">
<button type="button" class="tour-x" data-tour="skip" aria-label="Закрыть обучение">${I.x}</button>
<div class="tour-body" aria-live="polite"><h2 id="tourTitle"></h2><p></p></div>
<div class="tour-foot"><div class="tour-dots" aria-hidden="true">${steps.map(() => '<span></span>').join('')}</div><div class="tour-btns"><button type="button" class="tour-btn" data-tour="back"></button><button type="button" class="tour-btn pri" data-tour="next"></button></div></div>
</div></div>`;
  document.body.appendChild(root);
  tour = {
    name, steps, i: 0, root, last: '', raf: 0, back: document.activeElement,
    safe: root.querySelector('.tour-safe'), hole: root.querySelector('.tour-hole'), card: root.querySelector('.tour-card'), body: root.querySelector('.tour-body')
  };
  root.addEventListener('click', tourClick);
  tourShow(0, 0);
  // first frame lands in place without gliding; then fade in and let later steps glide
  requestAnimationFrame(() => requestAnimationFrame(() => { if (tour && tour.root === root) root.classList.add('ready', 'on'); }));
  const loop = () => {
    if (!tour || tour.root !== root) return;
    if (!TOURS[name].when() || anySheet()) { endTour(); return; } // e.g. the first file has just been loaded
    tourLayout();
    tour.raf = requestAnimationFrame(loop);
  };
  tour.raf = requestAnimationFrame(loop);
}
function tourShow(i, dir) {
  const t = tour, st = t.steps[i], n = t.steps.length;
  t.i = i;
  t.root.querySelector('h2').textContent = st.title;
  t.root.querySelector('.tour-body p').textContent = typeof st.text === 'function' ? st.text() : st.text;
  const back = t.root.querySelector('[data-tour="back"]'), next = t.root.querySelector('[data-tour="next"]');
  back.textContent = i ? 'Назад' : 'Пропустить';
  next.textContent = i === n - 1 ? 'Готово' : (st.go || 'Далее');
  t.root.querySelector('.tour-x').hidden = i === 0;
  t.root.querySelectorAll('.tour-dots span').forEach((d, k) => d.classList.toggle('on', k === i));
  if (dir && t.body.animate) {
    const from = RM.matches ? { opacity: 0 } : { opacity: 0, transform: `translateX(${dir * 16}px)` };
    t.body.animate([from, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
  }

function tourEl(st) {
  const sel = typeof st.el === 'function' ? st.el() : st.el;
  const el = sel && document.querySelector(sel);
  return el && el.getClientRects().length ? el : null;
}
// Where the spotlight and the card go: card below the control, else above, beside, or — if nothing fits — at the bottom with the spotlight trimmed.
function tourLayout() {

  if (!t) return;
  const st = t.steps[t.i];
  const vw = window.innerWidth, vh = window.innerHeight;
  const sc = getComputedStyle(t.safe), sT = parseFloat(sc.paddingTop) || 0, sB = parseFloat(sc.paddingBottom) || 0;
  const M = 12, G = 12, P = 6;
  const cw = t.card.offsetWidth, ch = t.card.offsetHeight;
  const el = tourEl(st);
  let h = null, x, y, origin = 'center';
  if (el) {
    const r = el.getBoundingClientRect();
    h = { L: r.left - P, T: r.top - P, R: r.right + P, B: r.bottom + P };
    const c = st.clip && document.querySelector(st.clip);
    if (c) { const k = c.getBoundingClientRect(); h.L = Math.max(h.L, k.left); h.T = Math.max(h.T, k.top); h.R = Math.min(h.R, k.right); h.B = Math.min(h.B, k.bottom); }
    h.L = Math.max(h.L, 4); h.T = Math.max(h.T, sT + 4); h.R = Math.min(h.R, vw - 4); h.B = Math.min(h.B, vh - sB - 4);
    if (h.R - h.L < 8 || h.B - h.T < 8) h = null;
  }
  if (h) {
    const fit = { below: h.B + G + ch <= vh - sB - M, above: h.T - G - ch >= sT + M, right: h.R + G + cw <= vw - M, left: h.L - G - cw >= M };
    const side = ['below', 'above', 'right', 'left'].find(k => fit[k]);
    const hx = clamp((h.L + h.R - cw) / 2, M, vw - M - cw), hy = clamp((h.T + h.B - ch) / 2, sT + M, vh - sB - M - ch);

    else if (side === 'above') { x = hx; y = h.T - G - ch; origin = 'bottom center'; }
    else if (side === 'right') { x = h.R + G; y = hy; origin = 'center left'; }
    else if (side === 'left') { x = h.L - G - cw; y = hy; origin = 'center right'; }
    else {
      x = (vw - cw) / 2; y = vh - sB - M - ch; origin = 'bottom center';
      h.B = Math.min(h.B, y - G);
      if (h.B - h.T < 40) h = null;
    }
  }
  if (!h) { x = (vw - cw) / 2; y = (vh - ch) / 2; origin = 'center'; }
  const rad = h ? Math.min(Math.max((parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0) + P, 12), (h.B - h.T) / 2) : 14;
  const key = [x, y, h && h.L, h && h.T, h && h.R, h && h.B, rad].map(v => v == null ? '-' : Math.round(v)).join(',');

  t.last = key;
  const hs = t.hole.style;
  if (h) { hs.width = (h.R - h.L) + 'px'; hs.height = (h.B - h.T) + 'px'; hs.transform = `translate(${h.L}px,${h.T}px)`; hs.borderRadius = rad + 'px'; }
  else { hs.width = '0px'; hs.height = '0px'; hs.transform = `translate(${vw / 2}px,${vh / 2}px)`; }
  t.hole.classList.toggle('none', !h);
  t.card.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px)`;
  t.card.firstElementChild.style.transformOrigin = origin;
}
function tourGo(i, dir) { if (tour && i >= 0 && i < tour.steps.length) tourShow(i, dir); }

function tourBack() { if (!tour) return; if (tour.i) tourGo(tour.i - 1, -1); else endTour(); }
function tourClick(e) {
  const b = e.target.closest('[data-tour]');
  if (b) { ({ next: tourNext, back: tourBack, skip: endTour })[b.dataset.tour](); return; }
  if (!tour || e.target.closest('.tour-card')) return;
  // a tap inside the spotlight reaches the control underneath — the tour is to be tried, not only read
  const st = tour.steps[tour.i], target = tourEl(st);
  if (!st.allow || !target) return;
  tour.root.style.pointerEvents = 'none';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  tour.root.style.pointerEvents = '';
  const hit = under && under.closest(st.allow);
  if (!hit || !target.contains(hit) && hit !== target) return;
  if (st.end) endTour();
  if (hit.matches('textarea, input')) hit.focus(); else hit.click();
}
function endTour() {
  const t = tour;
  if (!t) return;
  tour = null;
  cancelAnimationFrame(t.raf);
  S.tour[t.name] = 1;
  save();
  t.root.classList.remove('on');
  t.root.classList.add('out');
  let gone = false;
  const rm = () => { if (!gone) { gone = true; t.root.remove(); } };
  t.root.addEventListener('transitionend', e => { if (e.target === t.root) rm(); });
  setTimeout(rm, 400);
  setTimeout(tourSoon, 0); // the intro ends when the first file arrives: the main tour follows

}
// While the tour is open, keys drive the tour: → / Enter forward, ← back, Esc closes; Tab stays inside the card.
window.addEventListener('keydown', e => {
  if (!tour) return;
  const inTour = !!(e.target.closest && e.target.closest('.tour'));
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); endTour(); return; }
  if (!inTour && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return; // typing an answer during the tour
  e.stopImmediatePropagation();
  if (e.key === 'ArrowRight') { e.preventDefault(); tourNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (tour.i) tourBack(); }
  else if (e.key === 'Enter' && !inTour) { e.preventDefault(); tourNext(); }
  else if (e.key === 'Tab') {
    e.preventDefault();
    const f = [...tour.root.querySelectorAll('button:not([hidden])')];
    const k = f.indexOf(document.activeElement);
    f[(k + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
}, true);

async function loadBundledList() {
  try {
    const r = await fetch('data/sets.json', { cache: 'no-cache' });
    if (!r.ok) return [];
    const list = await r.json();
    return (Array.isArray(list) ? list : []).filter(x => x && typeof x.file === 'string')
      .map(x => ({ id: 'bundle.' + x.file.replace(/\.json$/i, ''), file: x.file, title: x.title || x.file.replace(/\.json$/i, '') }));
  } catch (e) { return []; }
}

  S.fontScale = clamp(+S.fontScale || 1, 0.5, 1.6);
  ['indexByScope', 'answers', 'starred', 'customSubs', 'titles', 'results', 'tour'].forEach(k => { if (!S[k] || typeof S[k] !== 'object' || Array.isArray(S[k])) S[k] = {}; });
  ['savedTests', 'sets', 'hiddenBundled'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });

}

  if (Store.mode === 'cloud' && await Store.migrateLocalFiles(S.sets)) { /* saved below */ }
  rebuildSets();
  if (!SETS.some(s => s.id === S.setId)) { S.setId = SETS.length ? SETS[0].id : ''; S.index = S.indexByScope[scopeKey()] || 0; }
  bankStatus = 'loading';
  activateSet();
  render();
  if (fresh || Store.mode === 'cloud') flush();
  if (Store.cloudDown) toast('Нет связи с аккаунтом — прогресс сохраняется в этом браузере');
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]') && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});

})();
