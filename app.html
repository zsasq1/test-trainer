<title>Тренажёр тестов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400..700&display=swap">
<style>
/* Layout: the testing frame — a title line, the question in a white box, a row of buttons at the bottom; the menu slides in
   from the left (on a computer it stands beside the frame).
   Look: the INDIGO testing screen — Verdana, the pale-blue jQuery UI «Cupertino» palette, square-ish 4–6px corners.
   After «Проверить»: a green or red line above the answer and, if it was wrong, «Правильный ответ:» with the right one. */
:root{
  color-scheme:light;
  --bg:#FBFBFD; --frame:#F5F5FF; --surface:#FFFFFF; --line:#B1D2EB; --line-soft:#D0E4F3; --tline:#A2C1D8;
  --text:#222222; --ink:#362B36; --q:#000000; --muted:#66667A;
  --ink-soft:#EEF6FC; --ink-line:#74B2E2;
  --accent:#2779AA; --accent-btn:#62BBE8; --soft-accent:#E3F1FA; --accent-line:#B1D2EB;
  --btn:#E3F1FA; --btn-line:#B1D2EB; --btn-fg:#2779AA;
  --btn-h:#EEF6FC; --btn-h-line:#74B2E2; --btn-h-fg:#0070A3;
  --btn-on:#62BBE8; --btn-on-line:#2694E8; --on-accent:#FFFFFF;
  --head:#E6F1F9; --head-soft:#F7F8FA; --focus:#528AA5;
  --radio:#4783A5; --radio-off:#75A2BC; --radio-hover:#F6F6F8;
  --sort:#EBF4FA; --sort-off:#F3F8FC; --sort-ico:#74A6CC;
  --green:#008000; --green-btn:#62BBE8; --soft-green:#EAF5EA; --green-line:rgba(0,128,0,.35);
  --red:#CD0A0A; --wrong:#FF0000; --missed:#808080; --soft-red:#FBEAEA; --red-line:rgba(205,10,10,.4);
  --gray-btn:#FFFFFF; --star:#E0A100; --soft-star:rgba(224,161,0,.14);
  --switch-off:#C5D7E5; --knob:#FFFFFF;
  --scrim:rgba(34,34,34,.35); --shadow:rgba(17,33,40,.15); --bar:#F5F5FF; --btn-shadow:0 1px 3px rgba(17,33,40,.15);
  --toast-bg:#FFFFFF; --toast-fg:#222222; --glow:rgba(0,128,0,.25);
  --side:#FFFFFF; --side-sel:#E3F1FA; --side-hover:#F2F8FC;
  --font:Verdana,Tahoma,"Noto Sans Arabic","DejaVu Sans",Geneva,sans-serif;
  --serif:var(--font);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs:1;
  --ease-out:cubic-bezier(0.23,1,0.32,1);  /* strong ease-out for things that appear */
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);  /* strong ease-in-out for things moving on screen */
  --ease-ios:cubic-bezier(0.32,0.72,0,1);  /* iOS sheet curve for things that glide */
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.4 var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.i.f{fill:currentColor;stroke:none}
.i .fillc{fill:currentColor;stroke:currentColor}
.i .onfill{stroke:var(--on-accent)}

/* ---------- shell: the testing frame ---------- */
/* phone: a narrow page margin, the frame fills the rest; the tiers below follow the frame's own width */
.app{height:calc(100% - 8px);width:calc(100% - 8px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));max-width:1100px;margin:4px auto;display:flex;flex-direction:column;position:relative;background:var(--frame);border:1px solid var(--line);border-radius:5px;container-type:inline-size;container-name:app}
.topbar{flex:none;display:flex;align-items:center;gap:2px;min-height:40px;padding:2px 3px 2px 4px;color:var(--ink)}
.icon-btn{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:transparent;border:1px solid transparent;color:var(--accent);font-size:19px}
.icon-btn:active:not(:disabled){background:var(--btn-h);border-color:var(--btn-h-line)}
.icon-btn:disabled{opacity:.35}
.topbar .icon-btn{width:38px;height:38px;position:relative}
.topbar .icon-btn::after{content:'';position:absolute;inset:-3px}
.titles{flex:1;min-width:0;min-height:36px;display:flex;align-items:center;gap:14px;padding:0 6px;border-radius:4px;text-align:start;color:var(--ink)}
.titles:active:not(:disabled){background:var(--btn-h)}
.title{display:none;flex:1;min-width:0;font-size:16px;font-weight:700;line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-row{flex:1 1 auto;min-width:0;display:flex;align-items:center}
.progress{min-width:0;font-size:15.5px;font-weight:700;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.top-actions{flex:none;display:flex;align-items:center;gap:1px}
.plain-btn,.star-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;border:1px solid transparent;font-size:19px}
.plain-btn{color:var(--accent)}
.star-btn{color:var(--sort-ico)}
.star-btn.on{color:var(--star)}
.star-btn.pop .i{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.3)}}
.switch{position:relative;width:42px;height:24px;flex:none;margin:0 3px;border-radius:999px;background:var(--switch-off);transition:background .2s}
.switch span{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--knob);box-shadow:0 1px 2px rgba(17,33,40,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--btn-on)}
.switch[aria-checked="true"] span{transform:translateX(18px)}

/* the white box the question sits in; it scrolls, the frame around it does not */
.scroller{flex:1;min-height:0;margin:0 5px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:5px}
/* a short question stands in the middle of the box, a long one starts at the top */
.content{min-height:100%;display:flex;flex-direction:column;gap:12px;padding:8px 10px;color:var(--q)}
.content>:first-child{margin-top:auto}
.content>:last-child{margin-bottom:auto}
.content.enter{animation:fadein .2s ease}
@keyframes fadein{from{opacity:.3}to{opacity:1}}

/* bottom row: [Закончить][Подглядеть] … progress … [Проверить][‹ Назад][Далее ›] */
.bottombar{flex:none;display:flex;align-items:center;padding:8px 6px}
.ft-left,.ft-right{flex:none;display:flex;align-items:center;gap:5px}
.ft-left{margin-inline-end:5px}
.ft-right{margin-inline-start:5px}
.ft-mid{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.ft-prog{display:none;flex:1;min-width:0;height:45px;background:#F9FAFB;border:1px solid var(--line);border-radius:4px;box-shadow:var(--btn-shadow);overflow:hidden}
.ft-prog>span{display:block;height:100%;width:0;background:var(--head);border-inline-end:1px solid var(--line);transition:width .25s var(--ease-out)}
.ft-info{flex:none;min-width:0;padding:0 2px;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ft-info:empty{display:none}
/* jQuery UI default button: pale blue, blue bold text, a soft shadow; pressed — solid blue */
.btn{height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 5px;border-radius:4px;background:var(--btn);border:1px solid var(--btn-line);color:var(--btn-fg);font-size:17px;font-weight:700;line-height:1;white-space:nowrap;box-shadow:var(--btn-shadow);transition:background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out}
.btn .i{width:.9em;height:.9em;stroke-width:3.2}
.btn:active:not(:disabled){background:var(--btn-on);border-color:var(--btn-on-line);color:#fff}
.btn:disabled{opacity:.35}
.btn.ib{width:44px;padding:0}
.btn.ib .i{width:20px;height:20px;stroke-width:3}
.btn.ib .lbl{display:none}
.btn.rv .i,.btn.fin .i{display:none}
.btn.rv.ib .i{display:block}
.btn.rv.ib .lbl{display:none}
@media (max-width:389px){ .btn.fin{width:44px;padding:0}.btn.fin .lbl{display:none}.btn.fin .i{display:block;width:20px;height:20px;stroke-width:2.6} }
@media (max-width:359px){ .btn.rv{width:44px;padding:0}.btn.rv .lbl{display:none}.btn.rv .i{display:block;width:20px;height:20px;stroke-width:2.4} }
@media (max-width:439px){ .ft-info{display:none} }
/* ---------- question: INDIGO panels ---------- */
/* phone: the panel has no frame of its own (as on the INDIGO phone screen); wider: a pale-blue bordered panel */
.qp{--lh:1.25;width:100%;max-width:838px;margin:0 auto;padding:4px 2px;font-size:calc(16px * var(--fs));line-height:var(--lh);color:var(--q);overflow-wrap:anywhere}
.qp.wide{max-width:1100px}
/* phone: the panels of a case are parted by a pale-blue line across the box */
.qp+.qp{width:auto;max-width:none;margin-inline:-10px;padding:14px 12px 4px;border-top:1px solid var(--line)}
.q{display:block}
.prompt{margin:0 0 14px;text-wrap:pretty}
.ctx{white-space:pre-line} /* line breaks kept, double spaces of justified text collapsed — as an HTML page shows it */
.choices{display:flex;flex-direction:column}
.choice{width:100%;display:flex;align-items:flex-start;padding:0;margin:0 0 6px;text-align:start;background:none;border:0;border-radius:0;font-size:1em;font-weight:400;line-height:inherit;color:var(--q)}
.choice[aria-disabled="true"]{cursor:default}
.ctext{flex:1;min-width:0;padding-inline-start:7px;overflow-wrap:anywhere}
.choices .rb.cb+.ctext{padding-inline-start:9px}
/* radio and checkbox drawn as in INDIGO: steel-blue outline on white, a dot or a tick when chosen */
.rb{flex:none;width:20px;height:20px;margin-top:max(0px,calc((var(--lh) * 1em - 20px) / 2));overflow:visible}
.rb .o{fill:#fff;stroke:var(--radio);stroke-width:1.5}
.rb.cb .o{stroke-width:1.5}
.rb .d{visibility:hidden;fill:var(--radio)}
.rb.cb .d{fill:none;stroke:var(--radio);stroke-width:3}
.choice[aria-checked="true"] .rb .d{visibility:visible}
.done .rb .o,.ro .rb .o{stroke:var(--radio-off)}
.done .rb .d,.ro .rb .d{fill:var(--radio-off)}
.done .rb.cb .d,.ro .rb.cb .d{fill:none;stroke:var(--radio-off)}
/* after «Проверить»: one coloured line, then the answer given; if it was wrong — the right one below */
.verdict{margin:0 0 5px;line-height:inherit;unicode-bidi:plaintext} /* an Arabic label over a Russian question keeps its own order */
.verdict.ok,.verdict.right{color:var(--green)}
.verdict.bad{color:var(--wrong)}
.verdict.miss{color:var(--missed)}
.verdict.right{margin-top:10px}
/* matching: a two-column table, the right cell is a plain select */
.selt{width:100%;border-collapse:collapse;table-layout:fixed;margin:0 0 8px}
.selt td{width:50%;border:1px solid var(--tline);vertical-align:middle;overflow-wrap:anywhere}
.selt td.l{padding:4px 7px}
.selt td.r{padding:1px}
.dd-btn{width:100%;min-height:calc(var(--lh) * 1em + 6px);display:flex;align-items:center;gap:6px;padding:2px 6px;text-align:start;background:#fff;border:1px solid #fff;border-radius:0;font-size:1em;font-weight:400;line-height:inherit;color:var(--q)}
.dd-btn>span{flex:1;min-width:0;overflow-wrap:anywhere}
.dd-btn .i{width:12px;height:12px;stroke-width:3;color:#333}
.dd-val{display:block;padding:3px 6px}
/* order: numbers on the left, pale-blue bars with ↕ */
.sort-list{position:relative;margin:0 0 8px}
.sort-row{display:flex;align-items:stretch;gap:4px;margin:0 0 5px;transition:transform .18s ease;position:relative}
.sort-row.dragging{transition:none;z-index:3}
.sort-row .num{flex:none;min-width:1.7em;padding:7px 2px 6px 0;text-align:end;font-variant-numeric:tabular-nums}
.sbox{flex:1;min-width:0;display:flex;align-items:flex-start;padding:6px 6px 6px 0;background:var(--sort);border:1px solid var(--line);border-radius:4px}
.sort-row.dragging .sbox{border-color:var(--ink-line);box-shadow:0 6px 18px var(--shadow)}
.handle{flex:none;width:30px;align-self:stretch;margin:-6px 0;display:flex;align-items:center;justify-content:center;color:var(--sort-ico);touch-action:none;cursor:n-resize}
.handle svg{width:15px;height:15px;display:block}
.sbox[data-handle]{cursor:n-resize;touch-action:none}
.sort-row.dragging .handle,.sort-row.dragging .sbox{cursor:grabbing}
.stext{flex:1;min-width:0;overflow-wrap:anywhere}
.done .sbox,.ro .sbox{background:var(--sort-off);border-color:var(--line-soft)}
.done .handle,.ro .handle{opacity:.6}
.ro .handle{cursor:default}
/* a written answer */
.txt{width:100%;display:block;resize:none;overflow:hidden;padding:6px 8px;margin:0 0 5px;border-radius:3px;background:#fff;border:1px solid var(--tline);font-size:max(16px,1em);line-height:1.35;min-height:38px;color:var(--q)}
.txt:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.txt:disabled{opacity:1;-webkit-text-fill-color:var(--q);color:var(--q)}
.done .txt{border-color:var(--line-soft)}
.ans-box{padding:6px 8px;margin:0 0 5px;border-radius:3px;background:var(--sort-off);border:1px solid var(--line-soft);white-space:pre-wrap;overflow-wrap:anywhere}
.sublabel{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;font-size:13px;font-weight:700;color:var(--accent)}
.mini-del{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--red);font-size:15px;border-radius:4px}
.pulse{animation:none}

.state{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px 8px}
.state .big{font-size:36px;color:var(--muted)}
.state h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.3;text-wrap:balance}
.state p{margin:0;font-size:15px;color:var(--muted);max-width:34ch;text-wrap:pretty}
.state .act{margin-top:6px;min-width:220px}
.state .ghost-btn{margin-top:2px}
.ghost-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:5px;color:var(--accent);font-weight:600;font-size:15px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .24s,visibility 0s .24s;z-index:30}
.scrim.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .24s,visibility 0s}
/* iOS 26 lays a soft blur over the top of the page, under the clock, and it smears the top bar too — unless the page
   has its own solid bar pinned up there. This is that bar: the same colour as the top bar, so it is not seen. */
.status-top{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:29}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:40;width:min(88vw,350px);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);column-gap:8px;row-gap:12px;background:var(--surface);box-shadow:8px 0 28px var(--shadow);transform:translateX(-106%);transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(var(--dpad),env(safe-area-inset-left,0px));padding-right:var(--dpad);padding-bottom:0;visibility:hidden;--dpad:16px}
.drawer.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
/* search box and the close button share the first row; the list fills the rest */
.drawer>.searchbox{grid-column:1;grid-row:1}
.d-head{grid-column:2;grid-row:1;display:flex;align-items:center}
.d-head .icon-btn{width:44px;height:44px}
@media (max-width:360px){.drawer{--dpad:12px}}
.searchbox{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:5px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.searchbox:focus-within{border-color:var(--ink-line)}
.searchbox input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:16px;color:var(--text)}
.searchbox input::placeholder{color:var(--muted)}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox button{color:var(--muted);font-size:18px;display:inline-flex}
.menu-body{grid-column:1/-1;grid-row:2;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:20px;padding-top:2px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));margin-right:calc(-1 * var(--dpad));padding-right:var(--dpad)}
.msec{display:flex;flex-direction:column;gap:2px}
.sec-label{font-size:13.5px;font-weight:600;color:var(--muted);margin:0 4px 5px}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.sec-row .sec-label{margin-bottom:0}
.sec-chip{display:inline-flex;align-items:center;gap:3px;min-width:0;max-width:62%;min-height:28px;padding:3px 6px 3px 10px;border-radius:4px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.sec-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-chip .i{width:15px;height:15px}
.sec-chip:active{background:var(--line)}
.msec-note{margin:0;padding:6px 4px;font-size:15px;color:var(--muted)}
.m-note{margin:0 4px 4px;font-size:13px;line-height:1.35;color:var(--muted)}
.mline{display:flex;align-items:center;gap:2px}
.mrow{width:100%;min-height:46px;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:5px;text-align:start;font-size:16px;font-weight:600}
.mrow:active{background:var(--bg)}
.mrow.on{background:var(--ink-soft)}
.mrow .mico{width:22px;display:inline-flex;justify-content:center;color:var(--muted);font-size:18px;flex:none}
.mrow.on .mico{color:var(--text)}
.mrow .mtxt{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.28}
.mrow .mtxt small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.mrow .mtick{color:var(--text);font-size:15px}
.m-res .ok{color:var(--green)}
.mrow.static{cursor:default}
.mrow.static:active{background:none}
.mrow.star-on{background:var(--soft-star)}
.mrow.star-on .mico{color:var(--star)}
.mrow.test-on{background:var(--soft-accent);border:1px solid var(--accent-line)}
.mrow.test-on .mico{color:var(--accent)}
.mrow.test-on .mtxt small{color:var(--accent);font-variant-numeric:tabular-nums}
.mrow.box{background:var(--bg);border:1px solid var(--line)}
.mrow.box .mico:first-child{color:var(--accent)}
.badge{font-size:13px;font-weight:600;color:var(--muted);padding:3px 8px;border-radius:4px;background:var(--bg);font-variant-numeric:tabular-nums;flex:none}
.mrow.on .badge,.mrow.star-on .badge{background:var(--surface)}
.mmore,.mx{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:var(--muted);font-size:18px}
.mmore:active,.mx:active{background:var(--bg)}
.mx{font-size:16px}
.mlink{align-self:flex-start;color:var(--accent);font-size:14px;font-weight:600;padding:6px 4px}
.mbtn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border-radius:5px;background:var(--bg);border:1px solid var(--line);color:var(--accent);font-size:15px;font-weight:600;white-space:nowrap;cursor:pointer}
.mbtn.pri{flex:1;min-width:0}
.mbtn .i{width:18px;height:18px}
.mbtn:active{background:var(--line)}
.mgroup{display:flex;flex-direction:column;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.mgroup>*+*{border-top:1px solid var(--line)}
.mgroup .mrow{border-radius:0;padding-block:10px;min-height:48px}
.mgroup .mrow:active{background:transparent}
.mgroup .mrow .mtxt small{font-size:12.5px}
@media (max-width:360px){.mrow{font-size:15px;gap:9px}.mbtn{font-size:14px;padding:0 10px}.mbtn:not(.pri) .i{display:none}}
.sres-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0}

.cred{position:relative;display:inline-flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;font-size:15px;font-weight:500;color:var(--muted);text-decoration:none;white-space:nowrap}

/* «Жалобы и предложения» above the words: shows up out of nothing once the last word has landed */
.cred .note{position:absolute;left:0;right:0;bottom:100%;margin-bottom:10px;text-align:center;font-size:12px;font-weight:500;color:var(--muted);opacity:.8;pointer-events:none}
.cred.pre .note{opacity:0}
.cred.drop .note{animation:cred-note .9s var(--ease-out) 1.12s both}
@keyframes cred-note{from{opacity:0}}
/* @ziplogo: a faint blue outline around the letters; now and then a soft light slowly passes along the word */
.cred .zl{position:relative;z-index:0;display:inline-block}
.cred .zl::before,.cred .zl::after{content:attr(data-t);position:absolute;left:0;top:0;color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-size:300% 100%;background-position:100% 0;animation:zl-glint 5.5s var(--ease-in-out) 1.6s infinite;pointer-events:none}
.cred .zl::before{z-index:-1;-webkit-text-stroke:2.6px transparent;background-image:linear-gradient(100deg,rgba(42,171,238,.2) 40%,rgba(42,171,238,.5) 50%,rgba(42,171,238,.2) 60%)}
.cred .zl::after{background-image:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%)}
@keyframes zl-glint{0%{background-position:100% 0}45%,100%{background-position:0 0}}
/* whole words fall like something very heavy: from high up, stretched by speed, a dead stop (no bounce);
   each one tears the page a little and the page's own code shows through the rip; scraps fly; the menu jolts (JS).
   They stay where they fell, each at its own angle. */
.w{position:relative;display:inline-block;transform-origin:50% 100%;transform:translateY(var(--y)) rotate(var(--r))}
.w.pl{width:20px;height:18px;color:#2AABEE}
.w.pl>svg{width:100%;height:100%;display:block}
.w .tear{position:absolute;left:50%;width:max(calc(100% + 6px),32px);margin-left:calc(max(calc(100% + 6px),32px) / -2);top:66%;height:11px;z-index:-1;pointer-events:none;transform-origin:50% 30%;transform:rotate(calc(var(--r) * -1));filter:drop-shadow(0 -.6px 0 rgba(255,255,255,.85)) drop-shadow(0 0 .5px rgba(0,0,0,.5)) drop-shadow(0 .8px 1px rgba(0,0,0,.25))}
.w .code{position:relative;display:block;width:100%;height:100%;overflow:hidden;padding:1.5px 3px;background:#1d2026;color:#abb2bf;font:600 6px/1.25 var(--mono);letter-spacing:0;white-space:pre;text-align:left}
.w .code::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.6),transparent 55%)}
.w .code .kw{color:#c678dd}
.w .code .st{color:#98c379}
.w .code .nu{color:#d19a66}
.w .code .fn{color:#61afef}
.w .code .cm{color:#5c6370;font-style:italic}
.w .bit{position:absolute;left:50%;bottom:0;width:4px;height:3px;margin-left:-2px;border-radius:.5px;background:var(--surface);box-shadow:0 0 0 .6px rgba(0,0,0,.35);opacity:0;pointer-events:none}
.cred.pre .w{opacity:0}
.cred.pre .w .tear{transform:rotate(calc(var(--r) * -1)) scale(.25,0)}
.cred.drop .w{animation:w-fall .32s both;animation-delay:var(--d)}
.cred.drop .w .tear{animation:w-tear .2s var(--ease-out) both;animation-delay:calc(var(--d) + 320ms)}
.cred.drop .w .bit{animation:w-bit .55s cubic-bezier(.2,.6,.4,1) forwards;animation-delay:calc(var(--d) + 320ms)}
@keyframes w-fall{
  0%{opacity:1;transform:translateY(-120px) rotate(calc(var(--r) * -.4)) scale(.92,1.16);animation-timing-function:cubic-bezier(.11,0,.5,0)}
  99%{opacity:1;transform:translateY(var(--y)) rotate(var(--r)) scale(.92,1.16)}
  100%{opacity:1;transform:translateY(var(--y)) rotate(var(--r)) scale(1)}
}
@keyframes w-tear{from{transform:rotate(calc(var(--r) * -1)) scale(.25,0)}to{transform:rotate(calc(var(--r) * -1)) scale(1)}}
@keyframes w-bit{0%{opacity:1;transform:translate(0,0) rotate(0deg)}55%{opacity:1;transform:translate(calc(var(--px) * .7),var(--py)) rotate(120deg)}100%{opacity:0;transform:translate(var(--px),5px) rotate(200deg)}}

.sheet-wrap.closing .sheet{animation:down .18s ease forwards}

@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}

   ========================================================= */
const EMPTY_BANK = Object.freeze({ byCat: Object.fromEntries(CATS.map(c => [c, []])), byId: new Map(), total: 0, skipped: 0 });

// Files made by the converter can't repeat a question as a JSON key, so repeats arrive as «… [вариант 2]».
// Shown without it; the full key still names the question, so progress and stars stay with the right one.
const shownPrompt = k => k.replace(/\s*\[вариант \d+\]\s*$/, '');
function buildBank(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
    throw new Error(T('Ожидался объект вида {"Текст вопроса": {"type": "single", "all_options": [...]}}.'));
  }
  const keys = Object.keys(raw);
  const keyIndex = new Map(keys.map((k, i) => [k, i]));
  const entries = keys.map(k => ({ prompt: k, r: raw[k] })).filter(e => e.r && typeof e.r === 'object' && !Array.isArray(e.r));
  entries.sort((a, b) => coll.compare(a.prompt, b.prompt));
  const groups = { single: [], multiple: [], dropdown: [], sortable: [], text: [] };
  let skipped = 0;
  for (const { prompt: key, r } of entries) {
    const prompt = shownPrompt(key);
    const ctx = typeof r.main_text === 'string' && r.main_text.trim() ? r.main_text : null;
    const opts = Array.isArray(r.all_options) ? r.all_options.filter(o => o && typeof o === 'object') : [];
    const answers = Array.isArray(r.answers) ? r.answers.filter(a => typeof a === 'string') : [];
    const seed = key + '|' + (ctx || '');
    switch (r.type) {
      case 'single':
      case 'multiple': {
        const options = opts.filter(o => typeof o.text === 'string' && o.text !== '').map(o => ({ text: o.text, correct: o.correct === true }));
        if (!options.length) { skipped++; break; }
        groups[r.type].push({ kind: r.type, id: sid(r.type, seed), prompt, key, context: ctx, options });
        break;
      }
      case 'dropdown': {
        const rows = opts.filter(o => typeof o.left === 'string' && o.left && typeof o.correct_value === 'string' && o.correct_value)
          .map(o => ({ left: o.left, value: o.correct_value }));
        if (!rows.length) { skipped++; break; }
        groups.dropdown.push({ kind: 'dropdown', id: sid('dropdown', seed), prompt, key, context: ctx, rows, choices: uniq(rows.map(x => x.value)) });
        break;
      }
      case 'sortable': {
        const order = opts.filter(o => Number.isFinite(o.position) && typeof o.text === 'string' && o.text)
          .sort((a, b) => a.position - b.position).map(o => o.text);
        if (!order.length) { skipped++; break; }
        groups.sortable.push({ kind: 'sortable', id: sid('sortable', seed), prompt, key, context: ctx, order });
        break;
      }
      case 'drag_and_drop':
      case 'text_input': {
        const accepted = uniq(answers.concat(opts.filter(o => o.correct === true && typeof o.text === 'string').map(o => o.text))
          .map(s => s.trim()).filter(s => s && !TEXT_PLACEHOLDERS.has(s.toLowerCase())));
        groups.text.push({ kind: 'text', id: sid('text', seed), prompt, key, context: ctx, accepted });
        break;
      }
      case 'cluster_member':
        break; // заголовок кейса: сами подвопросы приходят с main_text
      default:
        skipped++;
    }
  }
  const all = [].concat(groups.single, groups.multiple, groups.dropdown, groups.sortable, groups.text);
  const caseMap = new Map();
  for (const q of all) if (q.context) { if (!caseMap.has(q.context)) caseMap.set(q.context, []); caseMap.get(q.context).push(q); }
  const inCase = new Set();
  const cases = [...caseMap.keys()].sort(coll.compare).map(mainText => {
    const subs = caseMap.get(mainText).sort((a, b) =>
      ((keyIndex.has(a.key) ? keyIndex.get(a.key) : 1e9) - (keyIndex.has(b.key) ? keyIndex.get(b.key) : 1e9)) || coll.compare(a.prompt, b.prompt));
    subs.forEach(s => inCase.add(s.id));
    return { kind: 'case', id: sid('case', mainText), mainText, subs, category: 'caseStudy', title: firstSentence(mainText), searchSrc: [mainText].concat(subs.map(s => s.prompt)).join(' ') };
  });
  const tag = (list, cat, src) => list.filter(q => !inCase.has(q.id)).map(q => Object.assign(q, { category: cat, title: q.prompt, searchSrc: src(q) }));
  const choiceSrc = q => [q.context, q.prompt].concat(q.options.map(o => o.text)).filter(Boolean).join(' ');
  const byCat = {
    multiple: tag(groups.multiple, 'multiple', choiceSrc),
    single: tag(groups.single, 'single', choiceSrc),
    dropdown: tag(groups.dropdown, 'dropdown', q => [q.prompt].concat(q.rows.map(x => x.left + ' ' + x.value)).join(' ')),
    sortable: tag(groups.sortable, 'sortable', q => [q.prompt].concat(q.order).join(' ')),
    text: tag(groups.text, 'text', q => [q.context, q.prompt].concat(q.accepted).filter(Boolean).join(' ')),
    caseStudy: cases
  };
  const byId = new Map();
  for (const c of CATS) for (const it of byCat[c]) byId.set(it.id, it);
  return { byCat, byId, total: all.length, skipped };
}

function searchBank(bank, query) {
  const nq = norm(query);
  if (!nq) return [];
  const toks = nq.split(' ');
  const isSubseq = (needle, hay) => { let i = 0; for (const ch of hay) { if (ch === needle[i]) i++; if (i === needle.length) return true; } return i === needle.length; };
  const out = [];
  for (const c of CATS) for (const it of bank.byCat[c]) {
    const hay = it.hay || (it.hay = norm(it.searchSrc));
    if (!hay) continue;
    let sc;
    if (hay.includes(nq)) sc = 0;
    else if (toks.every(t => hay.includes(t))) sc = 1;
    else {
      const words = hay.split(' ');
      const hit = toks.filter(t => hay.includes(t) || (t.length > 2 && words.some(w => isSubseq(t, w)))).length;
      if (hit >= Math.max(1, Math.ceil(toks.length / 2))) sc = 2; else continue;
    }
    out.push({ it, sc, len: hay.length });
  }
  out.sort((a, b) => a.sc - b.sc || a.len - b.len);
  return out.slice(0, 80).map(x => x.it);
}

/* =========================================================
   Persistence: claude.ai account (db + assets) or this browser
   ========================================================= */
const IDB_NAME = 'TestTrainer', IDB_STORE = 'files';
let idbPromise = null;
function idb() {
  if (!idbPromise) idbPromise = new Promise((resolve, reject) => {
    try {
      const r = indexedDB.open(IDB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE, { keyPath: 'id' });
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    } catch (e) { reject(e); }
  });
  return idbPromise;
}
async function idbReq(mode, fn) {
  const d = await idb();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(IDB_STORE, mode);
    const req = fn(tx.objectStore(IDB_STORE));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}
const idbGet = id => idbReq('readonly', s => s.get(id)).catch(() => null);
const idbPut = rec => idbReq('readwrite', s => s.put(rec)).then(() => true, () => false);
const idbDel = id => idbReq('readwrite', s => s.delete(id)).catch(() => null);
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

const Store = {
  mode: 'local', db: null, assets: null, uid: null, warned: false, downloads: null,
  async init() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') {
      // Own site (GitHub Pages / Mac): ask the browser not to clear saved files and progress.
      try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
      return;
    }
    try {
      const [db, user, assets, downloads] = await Promise.all([c.use('db'), c.use('user'), c.use('assets'), c.use('downloads')]);
      this.downloads = downloads; // claude.ai: files are handed to the viewer only through this
      const uid = db && user ? await user.id() : null;
      if (db && uid) { this.db = db; this.uid = uid; this.assets = assets; this.mode = 'cloud'; }
    } catch (e) { /* stay local */ }
  },
  stateDoc() { return this.db.doc('data/users/' + this.uid + '/state'); },
  readLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } },
  async loadState() {
    const local = this.readLocal();
    if (this.mode === 'cloud') {
      try {
        const snap = await withTimeout(this.stateDoc().get(), 10000);
        if (snap.exists) {
          const d = snap.data();
          if (d && typeof d.json === 'string') { this.lastCloud = d.json; return { state: JSON.parse(d.json), fresh: false }; }
        }
        return { state: local, fresh: true };
      } catch (e) {
        this.mode = 'local';
        this.cloudDown = true;
      }
    }
    return { state: local, fresh: false };
  },
  writing: false, pending: null, lastCloud: '',
  persist(str) {
    try { localStorage.setItem(LS_KEY, str); } catch (e) { /* storage full or blocked */ }
    if (this.mode === 'cloud') this.writeCloud(str);
  },
  async writeCloud(str) {
    if (str === this.lastCloud) return;
    if (this.writing) { this.pending = str; return; }
    this.writing = true;
    try {
      await this.stateDoc().set({ json: str });
      this.lastCloud = str;
    } catch (e) {
      if (!this.warned) { this.warned = true; toast(T('Не удалось сохранить прогресс в аккаунте. Он сохранится в этом браузере.')); }
    }
    this.writing = false;
    if (this.pending != null) { const p = this.pending; this.pending = null; this.writeCloud(p); }
  },
  async putFile(text) {
    if (this.mode === 'cloud' && this.assets) {
      try {
        const r = await this.assets.upload(new Blob([text], { type: 'application/json' }), { type: 'application/json' });
        return { store: 'cloud', ref: r.id };
      } catch (e) { /* fall back to this browser */ }
    }
    const ref = 'f-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    if (!(await idbPut({ id: ref, text }))) throw new Error(T('Память браузера недоступна (частный режим?). Файл не сохранился.'));
    return { store: 'local', ref };
  },
  async getFile(rec) {
    if (rec.store === 'cloud') {
      const r = await fetch('/_blob/' + rec.ref);
      if (!r.ok) throw new Error(T('Файл не открылся из аккаунта (код {0}). Загрузите его заново.', r.status));
      return r.text();
    }
    const row = await idbGet(rec.ref);
    if (!row) throw new Error(T('Файла нет в памяти этого браузера. Загрузите его заново.'));
    return row.text;
  },
  async delFile(rec) {
    try {
      if (rec.store === 'cloud') { if (this.assets) await this.assets.delete(rec.ref); }
      else await idbDel(rec.ref);
    } catch (e) { /* ignore */ }
  },
  async migrateLocalFiles(sets) {
    if (this.mode !== 'cloud' || !this.assets) return false;
    let changed = false;
    for (const rec of sets) {
      if (rec.store !== 'local') continue;
      const row = await idbGet(rec.ref);
      if (!row) continue;
      try {
        const r = await this.assets.upload(new Blob([row.text], { type: 'application/json' }), { type: 'application/json' });
        rec.store = 'cloud'; rec.ref = r.id; changed = true;
      } catch (e) { break; }
    }
    return changed;
  }
};

const setTitle = s => (s && ((!s.bundled && S.titles[s.id]) || s.title)) || '';

/* ---------- answer records ---------- */
const EMPTY_REC = Object.freeze({ sel: null, multi: Object.freeze([]), dd: Object.freeze({}), order: null, text: '', shuf: null, checked: false, reveal: false });
const rec = id => S.answers[akey(id)] || EMPTY_REC;
function mut(id, fn) {
  const k = akey(id);
  if (!S.answers[k]) S.answers[k] = { sel: null, multi: [], dd: {}, order: null, text: '', shuf: null, checked: false, reveal: false };
  fn(S.answers[k]);
  save();
}
const clearRec = id => { delete S.answers[akey(id)]; };
// Last check of each question (1 right, -1 wrong) — survives moving on; counted in the menu.
const resultOf = id => S.results[akey(id)] || 0;
function setResult(id, ok) {
  const k = akey(id);
  delete S.results[k];
  S.results[k] = ok ? 1 : -1;
  const keys = Object.keys(S.results);
  if (keys.length > 4000) keys.slice(0, keys.length - 3000).forEach(x => delete S.results[x]);
}
const dropResults = setId => { for (const k of Object.keys(S.results)) if (k.startsWith(setId + '|')) delete S.results[k]; };
const hlVisible = id => { const r = rec(id); return r.checked || r.reveal; };
const customSubsOf = caseId => S.customSubs[caseId] || [];

function subToQ(s) {
  switch (s.type) {
    case 'single': case 'multiple':
      return { kind: s.type, id: s.id, prompt: s.prompt, context: null, options: (s.options || []).map(o => ({ text: o.text, correct: !!o.correct })) };
    case 'dropdown': {
      const rows = (s.rows || []).map(r => ({ left: r.left, value: r.value }));
      return { kind: 'dropdown', id: s.id, prompt: s.prompt, context: null, rows, choices: (s.choices && s.choices.length) ? s.choices : uniq(rows.map(r => r.value)) };
    }
    case 'sortable':
      return { kind: 'sortable', id: s.id, prompt: s.prompt, context: null, order: s.order || [] };
    default:
      return { kind: 'text', id: s.id, prompt: s.prompt, context: null, accepted: s.accepted || [] };
  }
}
const subsOfCase = it => it.subs.concat(customSubsOf(it.id).map(subToQ));

function ensureShuf(id, n) {
  const r = rec(id);
  if (isPerm(r.shuf, n)) return r.shuf;
  const s = shuffledDifferent(range(n));
  mut(id, x => { x.shuf = s; });
  return s;
}
function sortOrder(q) {
  const r = rec(q.id), n = q.order.length;
  if (isPerm(r.order, n)) return r.order;
  const o = shuffledDifferent(range(n));
  mut(q.id, x => { x.order = o; });
  return o;
}
function isCorrect(q) {
  const r = rec(q.id);
  switch (q.kind) {
    case 'single': return r.sel != null && !!(q.options[r.sel] && q.options[r.sel].correct);
    case 'multiple': {
      const sel = new Set(r.multi);
      const want = q.options.map((o, i) => o.correct ? i : -1).filter(i => i >= 0);
      return sel.size === want.length && want.every(i => sel.has(i));
    }
    case 'dropdown': return q.rows.every((row, i) => r.dd[i] === row.value);
    case 'sortable': { const o = sortOrder(q); return o.every((oi, pos) => q.order[oi] === q.order[pos]); }
    case 'text': { const a = normText(r.text); return !!a && q.accepted.some(x => normText(x) === a); }
    case 'case': return subsOfCase(q).every(isCorrect);
  }
  return false;
}
function answerText(q, short) {
  switch (q.kind) {
    case 'single': { const o = q.options.find(o => o.correct); return o ? o.text : (short ? T('не найден') : T('Правильный ответ не найден.')); }
    case 'multiple': return q.options.filter(o => o.correct).map(o => o.text).join('\n') || T('нет верных вариантов');
    case 'dropdown': return q.rows.map(r => r.left + ' — ' + r.value).join('\n');
    case 'sortable': return q.order.map((v, i) => (i + 1) + '. ' + v).join('\n');
    case 'text': return q.accepted.length ? q.accepted.join('\n') : (short ? T('не найден') : T('Правильный ответ не указан в JSON.'));
    case 'case': {
      const built = q.subs.map((s, i) => (i + 1) + '. ' + s.prompt + '\n' + T('Ответ:') + ' ' + answerText(s, true));
      const own = customSubsOf(q.id).map((s, i) => T('Ваш вопрос {0}', i + 1) + '. ' + s.prompt + '\n' + T('Ответ:') + ' ' + answerText(subToQ(s), true));
      return built.concat(own).join('\n\n');
    }
  }
  return '';
}

/* ---------- navigation & selection ---------- */
function currentItems() {
  if (!bankReady()) return [];
  if (S.test) return S.test.ids.map(id => bank.byId.get(id)).filter(Boolean);
  const base = bank.byCat[S.category] || [];
  if (S.starOnly) { const st = new Set(S.starred[S.setId] || []); return base.filter(it => st.has(it.id)); }
  return base;
}
const currentItem = () => currentItems()[S.index] || null;
function remember() { if (bankReady() && !S.test && !S.starOnly) S.indexByScope[scopeKey()] = S.index; }
function clampIndex() {
  if (!bankReady()) return;
  const n = currentItems().length;
  if (!Number.isInteger(S.index) || S.index < 0) S.index = 0;
  if (n === 0) S.index = 0; else if (S.index >= n) S.index = n - 1;
  remember();
}
function resetItem(it) {
  if (!it) return;
  clearRec(it.id);
  if (it.kind === 'case') subsOfCase(it).forEach(s => clearRec(s.id));
}
function shuffleQ(q) {
  switch (q.kind) {
    case 'single': case 'multiple': mut(q.id, r => { r.shuf = shuffledDifferent(range(q.options.length)); r.checked = false; r.reveal = false; }); break;
    case 'dropdown': mut(q.id, r => { r.shuf = shuffledDifferent(range(q.choices.length)); r.checked = false; r.reveal = false; }); break;
    case 'sortable': mut(q.id, r => { r.order = shuffledDifferent(range(q.order.length)); r.moved = false; r.checked = false; r.reveal = false; }); break;
    case 'case': subsOfCase(q).forEach(shuffleQ); break;
  }
}
function endTest() {
  if (!S.test) return;
  if (bankReady()) S.test.ids.forEach(id => resetItem(bank.byId.get(id)));
  S.test = null;
  S.index = S.indexByScope[scopeKey()] || 0;
  clampIndex();
  save();
}
function selectSet(id) {
  if (!SETS.some(s => s.id === id)) return;
  if (id === S.setId && bankStatus !== 'error') return;
  endTest();
  remember();
  S.setId = id;
  S.starOnly = false;
  S.index = S.indexByScope[scopeKey()] || 0;
  const t = SETS.find(s => s.id === id);
  if (t && t.bundled && t.course) S.course = t.course;
  activateSet();
  save();
}
// The file to open in this faculty: one of the chosen course, else any of its files, else one of the person's own.
function facFirstSet() {
  const b = SETS.filter(s => s.bundled), c = S.course;
  return (c && b.find(s => s.course === c)) || b[0] || SETS[0] || null;
}
const facEmpty = () => bundledOk && !SETS.some(s => s.bundled);
// Show another faculty: its courses and files. The open file is kept if it is still listed (an own file),
// else the faculty's first one opens. mine = the person chose it here, so the account gets it too.
function changeFac(f, { mine = false, say = false } = {}) {

}
// Course shown in the menu: the one picked, else the open file's, else the first that has files.
function curCourse() {

  const s = curSet();
  if (s && s.bundled && s.course) return s.course;
  const any = SETS.find(x => x.bundled && x.course);
  return any ? any.course : 1;
}
// n round buttons, one per course of the faculty (5 for Стоматология)
const coursePills = (count, cur, act, has) => `<div class="courses" role="radiogroup" aria-label="${T('Курс')}">${range(count).map(i => i + 1).map(n => `<button type="button" class="course${n === cur ? ' on' : ''}${has && !has.has(n) ? ' empty' : ''}" role="radio" aria-checked="${n === cur}" ${act}="${n}" aria-label="${T('{0} курс', n)}">${n}</button>`).join('')}</div>`;
function selectCategory(cat) {

/* ---------- answering ---------- */
function answerChanged(qid) {
  checkSeq++;
  const it = currentItem();
  if (it && it.kind === 'case' && it.id !== qid && subsOfCase(it).some(s => s.id === qid)) {
    mut(it.id, r => { r.checked = false; r.reveal = false; });
  }
}
function pick(qid, i) {
  if (isLocked(currentItem())) return;
  const q = QMAP.get(qid);
  if (!q) return;
  if (q.kind === 'single') mut(qid, r => { r.sel = i; r.checked = false; r.reveal = false; });
  else mut(qid, r => { const s = new Set(r.multi); s.has(i) ? s.delete(i) : s.add(i); r.multi = [...s]; r.checked = false; r.reveal = false; });
  answerChanged(qid);
}

  if (isLocked(currentItem())) return;
  mut(qid, r => { if (value) r.dd[row] = value; else delete r.dd[row]; r.checked = false; r.reveal = false; });
  answerChanged(qid);

  answerChanged(qid);

  mut(qid, r => { r.text = text; r.checked = false; r.reveal = false; });

}
function check() {
  const it = currentItem();
  if (!it) return;
  // After «Подглядеть» the answer is already known, so «Проверить» doesn't grade it: the question starts over.
  if (rec(it.id).reveal) { resetItem(it); shuffleQ(it); checkSeq++; save(); render(); return; }
  mut(it.id, r => { r.checked = true; r.reveal = false; });
  const ok = isCorrect(it);
  const seq = ++checkSeq;
  S.checks++;
  if (S.checks >= SIGNUP_AFTER - 2 && !Account.user) Account.probe();
  if (S.checks === SIGNUP_AFTER && needsSignup()) setTimeout(() => { if (needsSignup()) openAuth(); }, 1300); // after the answer has been seen
  haptic();
  setResult(it.id, ok);
  if (ok) pulse = { scope: it.id };
  render();
  const items = currentItems();
  const lastInTest = S.test && S.index >= items.length - 1;
  if (ok && S.autoAdvance && !lastInTest) {
    setTimeout(() => {
      const cur = currentItem();
      if (cur && cur.id === it.id && checkSeq === seq && !anySheet()) { goNext(); render(); }
    }, 800);
  } else if (ok && !S.autoAdvance && !S.test) {
    setTimeout(() => {
      const cur = currentItem();
      if (cur && cur.id === it.id && checkSeq === seq) { resetItem(it); shuffleQ(it); save(); render(); }
    }, 800);
  }
}
function reveal() {
  const it = currentItem();
  if (!it) return;
  // «Подглядеть» works after «Проверить» too: only an open answer is hidden again
  if (rec(it.id).reveal) { resetItem(it); shuffleQ(it); }
  else mut(it.id, r => { r.reveal = true; if (!S.test) r.checked = false; });
  checkSeq++;
  save();
}
const isStarred = id => (S.starred[S.setId] || []).includes(id);
function toggleStar(id) {
  const list = new Set(S.starred[S.setId] || []);
  list.has(id) ? list.delete(id) : list.add(id);
  if (list.size) S.starred[S.setId] = [...list]; else delete S.starred[S.setId];
  if (S.starOnly) clampIndex();
  save();
}

/* ---------- custom test ---------- */
const pointsFor = it => (S.test && S.test.points[it.category]) || 0;
const testTotal = () => currentItems().reduce((a, it) => a + pointsFor(it), 0);
const testEarned = () => currentItems().reduce((a, it) => a + (rec(it.id).checked && isCorrect(it) ? pointsFor(it) : 0), 0);
function startTest(configs, shouldSave) {
  const ids = [], points = {}, saved = [];
  for (const c of configs) {
    if (!(c.count > 0)) continue;
    const avail = bank.byCat[c.cat] || [];
    const n = Math.min(c.count, avail.length);
    if (!n) continue;
    shuffle(avail.slice()).slice(0, n).forEach(it => ids.push(it.id));
    points[c.cat] = Math.max(0, c.points | 0);
    saved.push({ cat: c.cat, count: n, points: points[c.cat] });
  }
  if (!ids.length) return false;
  if (shouldSave) {
    let k = S.savedTests.length + 1;
    while (S.savedTests.some(t => t.title === T('Тест {0}', k))) k++;
    S.savedTests.unshift({ id: sid('saved-test', S.setId + '|' + k + '|' + Date.now()), title: T('Тест {0}', k), setId: S.setId, setTitle: setTitle(curSet()), configs: saved, createdAt: Date.now() });
  }
  remember();
  S.test = { setId: S.setId, ids, points };
  S.starOnly = false;
  S.index = 0;
  ids.forEach(id => { const it = bank.byId.get(id); resetItem(it); shuffleQ(it); });
  save();
  return true;
}

// data/ped/2/anatomy.json: each part encoded on its own — the «/» must stay a folder.
const bundleURL = file => 'data/' + file.split('/').map(encodeURIComponent).join('/');
async function loadBank(entry) {
  if (BANKS.has(entry.id)) return BANKS.get(entry.id);
  if (LOADING.has(entry.id)) return LOADING.get(entry.id);
  const p = (async () => {
    let text;
    if (entry.rec) text = await Store.getFile(entry.rec);
    else {
      const r = await fetch(bundleURL(entry.file));
      if (!r.ok) throw new Error(T('Встроенный файл не открылся (код {0}).', r.status));
      text = await r.text();
    }
    text = text.replace(/^﻿/, '');
    entry.hash = cyrb53(text).toString(36);
    const b = buildBank(JSON.parse(text));
    BANKS.set(entry.id, b);
    return b;
  })().catch(e => { const v = { error: e.message || String(e) }; BANKS.set(entry.id, v); return v; })
    .finally(() => LOADING.delete(entry.id));
  LOADING.set(entry.id, p);
  return p;
}
function applyBank(b) {
  if (!b || b.error) { bank = EMPTY_BANK; bankStatus = 'error'; bankError = (b && b.error) || T('Неизвестная ошибка'); return; }
  bank = b; bankStatus = 'ready'; bankError = '';
  if (S.test && (S.test.setId !== S.setId || !S.test.ids.some(id => bank.byId.has(id)))) S.test = null;
  clampIndex();
}
function activateSet() {
  const s = curSet();
  if (!s) { bank = EMPTY_BANK; bankStatus = 'ready'; loadingPromise = Promise.resolve(); return loadingPromise; }
  if (BANKS.has(s.id)) { applyBank(BANKS.get(s.id)); loadingPromise = Promise.resolve(); return loadingPromise; }
  bank = EMPTY_BANK; bankStatus = 'loading'; bankError = '';
  const id = s.id;
  loadingPromise = loadBank(s).then(b => { if (S.setId === id) { applyBank(b); renderAll(); } });
  return loadingPromise;
}

/* ---------- import ---------- */
function uniqueTitle(t) {
  const taken = new Set(SETS.map(s => setTitle(s).toLowerCase()));
  if (!taken.has(t.toLowerCase())) return t;
  let k = 2;
  while (taken.has((t + ' (' + k + ')').toLowerCase())) k++;
  return t + ' (' + k + ')';
}
async function importFiles(files) {
  for (const f of files) {
    let text;
    try { text = await f.text(); } catch (e) { await alertDlg(T('Не удалось прочитать файл'), f.name); continue; }
    await importText(text, (f.name || '').replace(/\.[^.]+$/, '').trim() || T('вопросы'));
  }
}
async function importText(text, title) {
  text = String(text).replace(/^﻿/, '').trim();
  title = (title || '').trim() || T('вопросы');
  let raw;
  try { raw = JSON.parse(text); }
  catch (e) { return alertDlg(T('Это не JSON'), T('«{0}» не читается как JSON: {1}', title, e.message) + '\n\n' + T('Проверьте, что файл скопирован целиком.')); }
  let b;
  try { b = buildBank(raw); } catch (e) { return alertDlg(T('Формат не подходит'), e.message); }
  if (!b.total) return alertDlg(T('В файле нет вопросов'), T('Ожидается объект вида {"Текст вопроса": {"type": "single", "all_options": [...]}}. Поддерживаются типы single, multiple, dropdown, sortable, text_input и drag_and_drop.'));
  const hash = cyrb53(text).toString(36);
  const same = SETS.find(s => (s.rec && s.rec.hash === hash) || s.hash === hash);
  if (same) {
    selectSet(same.id); closeDrawer(); renderAll();
    return toast(T('«{0}» уже загружен — открыл его', setTitle(same)));
  }
  let targetId = null;
  const twin = SETS.find(s => !s.bundled && setTitle(s).toLowerCase() === title.toLowerCase());
  if (twin) {
    const r = await dialog({
      title: T('Файл «{0}» уже есть', title),
      message: T('Обновить его этой версией? Прогресс и избранное сохранятся у совпадающих вопросов.'),
      buttons: [{ id: 'update', label: T('Обновить'), kind: 'primary' }, { id: 'new', label: T('Добавить отдельным файлом') }, { id: 'cancel', label: T('Отмена') }],
      vertical: true
    });
    if (r.id === 'cancel') return;
    if (r.id === 'update') targetId = twin.id; else title = uniqueTitle(title);
  }
  const done = busy(T('Сохраняю файл…'));
  let ref;
  try { ref = await Store.putFile(text); }
  catch (e) { done(); return alertDlg(T('Файл не сохранился'), e.message); }
  done();
  const id = targetId || ('imp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  const old = S.sets.find(r => r.id === id);
  const entry = { id, title: targetId ? ((old && old.title) || twin.title) : title, store: ref.store, ref: ref.ref, addedAt: Date.now(), hash, count: b.total, };
  if (old) { Store.delFile(old); S.sets = S.sets.map(r => r.id === id ? entry : r); } else S.sets.push(entry);
  BANKS.set(id, b);
  rebuildSets();
  if (S.setId === id) { endTest(); applyBank(b); } else selectSet(id);
  save();
  closeDrawer();
  renderAll();
  const extra = b.skipped ? T(', пропущено {0}', b.skipped) : '';
  const nm = setTitle(SETS.find(s => s.id === id)), qn = b.total + ' ' + plural(b.total, 'вопрос', 'вопроса', 'вопросов');
  toast((targetId ? T('Обновлено: «{0}» — {1}', nm, qn) : T('Загружено в «Мои файлы»: «{0}» — {1}', nm, qn)) + extra);
}
async function deleteSet(id) {
  const s = SETS.find(x => x.id === id);
  if (!s) return;
  if (S.test && S.test.setId === id) S.test = null;
  if (s.rec) { S.sets = S.sets.filter(r => r.id !== id); Store.delFile(s.rec); }
  for (const k of Object.keys(S.answers)) if (k.startsWith(id + '|')) delete S.answers[k];
  for (const k of Object.keys(S.indexByScope)) if (k.startsWith(id + '|')) delete S.indexByScope[k];
  dropResults(id);
  delete S.starred[id];
  delete S.titles[id];
  S.savedTests = S.savedTests.filter(t => t.setId !== id);
  BANKS.delete(id);
  rebuildSets();
  if (S.setId === id) {
    S.setId = SETS.length ? SETS[0].id : '';
    S.category = 'multiple'; S.starOnly = false;
    S.index = S.indexByScope[scopeKey()] || 0;
    activateSet();
  }
  save();
  renderAll();
}

const loadBtn = label => `<label class="act green" for="fileInput" role="button" tabindex="0">${I.plus}${esc(label)}</label>`;

// In a test, a checked question is closed, as in INDIGO: the answer can no longer be changed.
const isLocked = it => !!(S.test && it && rec(it.id).checked);
// How the question is shown: '' while answering, 'checked' after «Проверить», 'reveal' after «Подглядеть».
const qState = id => { const r = rec(id); return r.checked ? 'checked' : r.reveal ? 'reveal' : ''; };
const panelHTML = (q, inner) => `<div class="qp${q.kind === 'dropdown' || q.kind === 'sortable' ? ' wide' : ''}">${inner}</div>`;
const contextHTML = t => `<div class="qp ctxp"><div class="ctx">${esc(t)}</div></div>`;
function itemHTML(it) {
  const st = qState(it.id), lock = isLocked(it);
  if (it.kind !== 'case') return (it.context ? contextHTML(it.context) : '') + panelHTML(it, qHTML(it, { st, lock, pts: S.test ? pointsFor(it) : 1 }));
  // a case: its text in one panel, each question in a panel of its own
  let h = contextHTML(it.mainText);
  const pts = S.test ? 0 : 1; // in a test the case scores as a whole
  it.subs.forEach(q => { h += panelHTML(q, qHTML(q, { st, lock, pts })); });
  customSubsOf(it.id).forEach((sub, i) => {
    const q = subToQ(sub);
    h += panelHTML(q, `<div class="sublabel own"><span>${T('Ваш вопрос {0}', i + 1)}</span><button type="button" class="mini-del" data-act="del-sub" data-case="${esc(it.id)}" data-sub="${esc(sub.id)}" aria-label="${T('Удалить ваш вопрос {0}', i + 1)}">${I.trash}</button></div>` + qHTML(q, { st, lock, pts }));
  });
  return h;
}

function qHTML(q, { st = '', lock = false, pts = 0 } = {}) {
  QMAP.set(q.id, q);
  const done = st === 'checked';
  let h = `<div class="prompt">${esc(q.prompt)}</div>`;
  if (done) h += verdictHTML(q, pts);
  const o = { done, lock };
  if (q.kind === 'single' || q.kind === 'multiple') h += choicesHTML(q, o);
  else if (q.kind === 'dropdown') h += ddHTML(q, o);
  else if (q.kind === 'sortable') h += sortHTML(q, o);
  else if (q.kind === 'text') h += textHTML(q, o);
  if ((done && !isCorrect(q)) || st === 'reveal') h += `<div class="right-ans"><div class="verdict right">${T('Правильный ответ:')}</div>${rightHTML(q)}</div>`;
  return `<section class="q${done ? ' done' : ''}" data-qid="${esc(q.id)}">${h}</section>`;
}
// Was anything answered at all? Nothing — «Вопрос пропущен», as in INDIGO.
function answered(q) {
  const r = rec(q.id);
  switch (q.kind) {
    case 'single': return r.sel != null;
    case 'multiple': return r.multi.length > 0;
    case 'dropdown': return Object.values(r.dd || {}).some(Boolean);
    case 'sortable': return !!r.moved;
    case 'text': return !!normText(r.text);
  }
  return true;
}
function verdictHTML(q, pts) {
  const ok = isCorrect(q), miss = !ok && !answered(q);
  const word = ok ? T('Верный ответ') : miss ? T('Вопрос пропущен') : T('Неверный ответ');
  return `<div class="verdict ${ok ? 'ok' : miss ? 'miss' : 'bad'}">${word}${pts ? ' ' + T('(балл {0} из {1})', ok ? pts : 0, pts) : ''}:</div>`;
}
// radio and checkbox as INDIGO draws them
const RB = {
  r: '<svg class="rb" viewBox="0 0 20 20" aria-hidden="true"><circle class="o" cx="10" cy="10" r="8.6"/><circle class="d" cx="10" cy="10" r="4"/></svg>',
  c: '<svg class="rb cb" viewBox="0 0 20 20" aria-hidden="true"><rect class="o" x=".75" y=".75" width="18.5" height="18.5" rx="2"/><path class="d" d="M5 10.2l3.8 3.8L15 5.3"/></svg>'
};
const SORT_ICO = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 .6 12.7 5.3H9.6v5.4h3.1L8 15.4 3.3 10.7h3.1V5.3H3.3Z"/></svg>';
const FINE = window.matchMedia('(hover: hover) and (pointer: fine)');
function choicesHTML(q, { lock }) {
  const r = rec(q.id), single = q.kind === 'single';
  const order = ensureShuf(q.id, q.options.length);
  return `<div class="choices" role="${single ? 'radiogroup' : 'group'}">` + order.map(i => {
    const sel = single ? r.sel === i : r.multi.includes(i);
    const act = lock ? ' aria-disabled="true"' : ` data-act="pick" data-qid="${esc(q.id)}" data-i="${i}"`;
    return `<button type="button" class="choice"${act} role="${single ? 'radio' : 'checkbox'}" aria-checked="${sel}">${single ? RB.r : RB.c}<span class="ctext">${esc(q.options[i].text)}</span></button>`;
  }).join('') + '</div>';
}
function ddHTML(q, { done, lock }) {
  const r = rec(q.id);
  return '<table class="selt"><tbody>' + q.rows.map((row, i) => {
    const sel = r.dd[i] || '';
    const cell = lock ? `<span class="dd-val">${esc(sel) || '&nbsp;'}</span>`
      : `<button type="button" class="dd-btn" data-act="dd-open" data-qid="${esc(q.id)}" data-row="${i}" aria-label="${T('Выбрать ответ для «{0}»', esc(row.left))}"><span>${sel ? esc(sel) : done ? '' : T('выберите ответ')}</span>${done ? '' : I.chevD}</button>`;
    return `<tr><td class="l">${esc(row.left)}</td><td class="r">${cell}</td></tr>`;
  }).join('') + '</tbody></table>';
}
function sortHTML(q, { lock }) {
  const order = sortOrder(q);
  // a mouse drags the whole bar (as in INDIGO); a finger takes the ↕, so the page still scrolls
  const whole = FINE.matches && !lock;
  return `<div class="sort-list" data-qid="${esc(q.id)}">` + order.map((oi, pos) =>
    `<div class="sort-row" data-oi="${oi}"><span class="num">${pos + 1}.</span><span class="sbox"${whole ? ' data-handle' : ''}><span class="handle"${lock || whole ? '' : ` data-handle aria-label="${T('Перетащить')}"`}>${SORT_ICO}</span><span class="stext">${esc(q.order[oi])}</span></span></div>`
  ).join('') + '</div>';
}
function textHTML(q, { lock }) {
  const r = rec(q.id);
  return `<textarea id="${esc('t-' + q.id)}" class="txt" data-text="${esc(q.id)}" rows="1" aria-label="${T('Ваш ответ')}" placeholder="${T('Введите ответ')}" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"${lock ? ' disabled' : ''}>${esc(r.text)}</textarea>`;
}
// «Правильный ответ:» — drawn the way the answer itself is, only greyed and not clickable
function rightHTML(q) {
  switch (q.kind) {
    case 'single': case 'multiple': {
      const single = q.kind === 'single', order = ensureShuf(q.id, q.options.length);

const anySheet = () => !!document.querySelector('.sheet-wrap:not(.closing)');
function openSheet({ cls = '', html, onClick, onClose, dismissible = true }) {
  hideToast();
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-scrim"></div><div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(wrap);
  const panel = wrap.querySelector('.sheet');
  let closed = false;
  const onKey = e => { if (e.key === 'Escape' && dismissible) { e.stopPropagation(); close(); } };
  function close() {
    if (closed) return;
    closed = true;
    document.removeEventListener('keydown', onKey, true);
    wrap.classList.add('closing');
    setTimeout(() => wrap.remove(), 190);
    if (onClose) onClose();
  }
  document.addEventListener('keydown', onKey, true);
  wrap.querySelector('.sheet-scrim').addEventListener('click', () => { if (dismissible) close(); });
  panel.addEventListener('click', e => {
    const b = e.target.closest('[data-s]');
    if (b && !b.disabled && panel.contains(b) && onClick) onClick(b.dataset.s, b, e, close);
  });
  return { panel, close };
}
function dialog({ title, message = '', input = null, buttons, vertical = false }) {
  return new Promise(resolve => {
    let done = false;
    const html = `<div class="dlg"><div class="dlg-title">${esc(title)}</div>${message ? `<div class="dlg-msg">${esc(message)}</div>` : ''}${input ? `<input id="dlgInput" class="f-in" ${input.numeric ? 'inputmode="numeric" pattern="[0-9]*"' : ''} value="${esc(input.value || '')}" placeholder="${esc(input.placeholder || '')}" autocomplete="off" aria-label="${esc(input.placeholder || title)}">` : ''}<div class="dlg-btns${vertical ? ' v' : ''}">${buttons.map(b => `<button type="button" class="dlg-btn ${b.kind || ''}" data-s="${b.id}">${esc(b.label)}</button>`).join('')}</div></div>`;
    const sh = openSheet({
      cls: 'dialog', html,
      onClick: (id, el, e, close) => { const inp = sh.panel.querySelector('#dlgInput'); done = true; close(); resolve({ id, value: inp ? inp.value : '' }); },
      onClose: () => { if (!done) { done = true; resolve({ id: 'cancel', value: '' }); } }
    });
    const inp = sh.panel.querySelector('#dlgInput');
    if (inp) {
      inp.focus();
      if (inp.select) inp.select();
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const p = sh.panel.querySelector('.dlg-btn.primary'); if (p) p.click(); } });
    }
  });
}

let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); setTimeout(() => { t.hidden = true; }, 220); }, 2800);
}
// An old message shouldn't cover a menu or sheet that has just been opened.
function hideToast() {
  const t = $('#toast');
  if (t.hidden) return;
  clearTimeout(toastTimer);
  t.classList.remove('show');
  t.hidden = true;
}
function busy(msg) {
  const el = document.createElement('div');
  el.className = 'busy';
  el.innerHTML = `<div><span class="spinner"></span><span>${esc(msg)}</span></div>`;
  document.body.appendChild(el);
  return () => el.remove();
}
function haptic() {
  try {
    if (navigator.vibrate) { navigator.vibrate(12); return; }
    const l = document.createElement('label');
    l.setAttribute('aria-hidden', 'true');
    l.hidden = true;
    const i = document.createElement('input');
    i.type = 'checkbox';
    i.setAttribute('switch', '');
    l.appendChild(i);
    document.head.appendChild(l);
    l.click();
    l.remove();
  } catch (e) { /* no haptics here */ }
}

const MT_SIZES = [10, 20, 30, 50];

function openAddSub(caseId) {

/* prev / next with press-and-hold repeat */
function repeatable(btn, fn) {
  let t1 = 0, t2 = 0, repeated = false;
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = 0; };
  btn.addEventListener('pointerdown', () => {
    if (btn.disabled) return;
    repeated = false; stop();
    t1 = setTimeout(() => { t2 = setInterval(() => { if (btn.disabled) { stop(); return; } repeated = true; fn(); }, 90); }, 450);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('click', () => { if (repeated) { repeated = false; return; } fn(); });
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
repeatable($('#prevBtn'), () => { goPrev(); render(); });
repeatable($('#nextBtn'), () => { goNext(); render(); });

}, { passive: true });
elScroller.addEventListener('touchend', e => {

  sw = null;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.4) return;

  if (dx < 0 && S.index < n - 1) { goNext(); render(); }
  else if (dx > 0 && S.index > 0) { goPrev(); render(); }
}, { passive: true });

let drag = null;

  const q = list && QMAP.get(list.dataset.qid);
  if (!q) return;
  e.preventDefault();
  const rows = [...list.children];
  const rects = rows.map(r => r.getBoundingClientRect());
  const from = rows.indexOf(row);
  const gap = rows.length > 1 ? Math.max(0, rects[1].top - rects[0].bottom) : 8;
  drag = { q, rows, rects, from, to: from, startY: e.clientY, y: e.clientY, startScroll: elScroller.scrollTop, step: rects[from].height + gap, id: e.pointerId, raf: 0 };
  row.classList.add('dragging');

function layoutDrag() {
  const d = drag;
  const dy = (d.y - d.startY) + (elScroller.scrollTop - d.startScroll);

  // A neighbour gives way once the dragged row's leading edge passes its middle (as on iOS).
  const top = r0.top + dy, bottom = r0.bottom + dy;
  let to = 0;
  d.rects.forEach((r, i) => {
    if (i === d.from) return;
    const mid = r.top + r.height / 2;
    if (i < d.from ? mid < top : mid < bottom) to++;
  });
  d.to = to;
  d.rows.forEach((el, i) => {

  document.querySelectorAll('.sheet-wrap').forEach(w => w.remove());
  if (tour) endTour();
  if (drawerOpen && !docked()) closeDrawer();
  [...document.body.children].forEach(c => { c.inert = true; });
  el = document.createElement('div');
  el.className = 'blocked'; el.id = 'blockScreen';
  el.setAttribute('role', 'alertdialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'blkT');
  el.innerHTML = `<div class="blk-card"><div class="blk-ico">${I.lock}</div><h2 id="blkT">${T('Доступ закрыт')}</h2><p>${T('Автор сайта закрыл доступ для аккаунта «{0}».', esc(Account.user.name))}</p><p class="blk-note">${T('Если это ошибка, напишите: tg @ziplogo')}</p></div>`;
  document.body.appendChild(el);
  Presence.off();
}

// Sign-up and sign-in in one sheet. As a gate (after a few answers) it cannot be dismissed.
function openAuth({ dismissible = false, mode = 'up', g = null } = {}) {
  if (anySheet() || tour || Account.blocked()) return;
  const gOn = Account.googleOn(), tOn = Account.tgOn(), extOn = gOn || tOn;
  let course = curCourse() || S.course || 0, busy = false, checkT = 0, checkN = 0, skip = false;
  const tgCode = TG_BOT ? rid(24) : ''; // ready before the tap: the link must open straight away
  // Telegram in one tap is the main way; Google and name + password fold away under «Другие способы входа»
  // (they stay open for someone who used them last time on this device)
  const hero = tOn && !!tgCode;
  let folded = hero && lastVia() !== 'pass' && lastVia() !== 'g';
  const legacy = g ? suggestName(g.name) : S.profile && S.profile.name ? cleanName(S.profile.name).slice(0, 24) : '';
  const html = `<div class="dlg su">
<div class="su-ico">${I.user}</div>
<div class="dlg-title" id="suTitle"></div>
<div class="dlg-msg" id="suMsg">${dismissible ? '' : T('Все функции откроются сразу после входа.')}</div>
${hero ? `<div class="su-tg" id="suTg"><span class="tg-badge">${T('Быстрее всего')}</span><a class="tg-btn big shine" data-s="tg-tap" href="${tgLink(tgCode)}" target="_blank" rel="noopener">${TG_LOGO}<span>${T('Войти через Telegram')}</span></a></div>
<button type="button" class="su-more" id="suMore" data-s="more" aria-expanded="false">${T('Другие способы входа')}${I.chevD}</button>` : ''}
${(tOn && !hero) || gOn ? `<div class="su-ext su-x" id="suExt">${tOn && !hero ? `<button type="button" class="tg-btn" data-s="telegram">${TG_LOGO}<span>${T('Продолжить с Telegram')}</span></button>` : ''}${gOn ? `<button type="button" class="g-btn" data-s="google">${G_LOGO}<span>${T('Продолжить с Google')}</span></button>` : ''}</div>` : ''}${extOn ? T('<div class="su-or su-x" id="suOr">или по имени и паролю</div>') : ''}
<div class="su-seg su-x" id="suSeg" role="tablist" aria-label="${T('Регистрация или вход')}"><button type="button" role="tab" data-s="m-up">${T('Регистрация')}</button><button type="button" role="tab" data-s="m-in">${T('Вход')}</button></div>
<div class="su-field su-x"><input id="suName" class="f-in" placeholder="${T('Имя пользователя')}" maxlength="24" autocomplete="username" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next" value="${esc(legacy)}" aria-label="${T('Имя пользователя')}" aria-describedby="suNameHint"><div class="su-hint" id="suNameHint" aria-live="polite"></div></div>
<div class="su-field su-x" id="suPassF"><div class="su-pass"><input id="suPass" class="f-in" type="password" placeholder="${T('Пароль')}" maxlength="128" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="${T('Пароль')}" aria-describedby="suPassHint"><button type="button" class="su-eye" data-s="eye" aria-label="${T('Показать пароль')}" aria-pressed="false">${I.eye}</button></div><div class="su-hint" id="suPassHint"></div></div>
<div class="su-course su-x" id="suCourse"><span>${T('Курс')}</span>${coursePills(curFac().courses, course, 'data-s="su-c" data-c', null)}</div>
<div class="su-err" id="suErr" role="alert"></div>
<button type="button" class="dlg-btn primary su-x" data-s="go"></button>
<div class="su-note" id="suNote"></div>
</div>`;
  const sh = openSheet({
    cls: 'dialog', html, dismissible,
    onClick: (act, el, e) => {
      if (act === 'm-up' || act === 'm-in') { if (skip) { skip = false; Account.works = true; } return setMode(act.slice(2)); }
      if (act === 'eye') {
        const show = passInp.type === 'password';
        passInp.type = show ? 'text' : 'password';
        el.innerHTML = show ? I.eyeOff : I.eye;
        el.setAttribute('aria-pressed', String(show));
        el.setAttribute('aria-label', show ? T('Скрыть пароль') : T('Показать пароль'));
        return;
      }
      if (act === 'su-c') {
        course = +el.dataset.c;
        el.parentElement.querySelectorAll('.course').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); });
        return;
      }
      if (act === 'go') go();
      if (act === 'more') { folded = false; setMode(mode); setTimeout(() => nameInp.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 50); return; }
      if (act === 'tg-tap') {
        // the link itself opens Telegram; this page waits for «Запустить»
        if (navigator.onLine === false) { e.preventDefault(); return fail({ msg: T('Нет связи с интернетом. Попробуйте ещё раз') }); }
        if (busy) { e.preventDefault(); return; }
        tgPending(tgCode);
        const m = mode;
        sh.close();
        tgWait({ code: tgCode, back: () => { if (dismissible || needsSignup()) openAuth({ dismissible, mode: m }); } });
        return;
      }
      if (act === 'google' || act === 'telegram') {
        if (navigator.onLine === false) return fail({ msg: T('Нет связи с интернетом. Попробуйте ещё раз') });
        el.disabled = true;
        if (act === 'google') Account.google(); else Account.telegram();
      }
    }
  });
  const $p = s => sh.panel.querySelector(s);
  const nameInp = $p('#suName'), passInp = $p('#suPass'), btn = $p('[data-s="go"]'), err = $p('#suErr');
  const hint = (el, text, kind = '') => { el.textContent = text; el.className = 'su-hint' + (kind ? ' ' + kind : ''); };
  function setMode(m) {
    mode = m;
    const gm = m === 'g'; // back from Google: only a name and a course are left
    sh.panel.querySelectorAll('.su-seg button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.s === 'm-' + m)));
    $p('#suTitle').textContent = gm ? T('Почти готово') : m === 'up' ? (dismissible ? T('Регистрация') : T('Лёгкая регистрация')) : T('Вход в аккаунт');
    if (gm) $p('#suMsg').innerHTML = T('Придумайте имя пользователя — так вас будет видеть автор сайта.') + (g.who ? `<div class="su-who">${esc(g.via)}: <b>${esc(g.who)}</b></div>` : '');
    btn.textContent = gm ? T('Готово') : m === 'up' ? T('Зарегистрироваться') : T('Войти');
    passInp.setAttribute('autocomplete', m === 'up' ? 'new-password' : 'current-password');
    $p('#suSeg').hidden = gm; $p('#suPassF').hidden = gm;
    if ($p('#suExt')) $p('#suExt').hidden = gm;
    if (extOn) $p('#suOr').hidden = gm;
    if (hero) { $p('#suTg').hidden = gm; $p('#suMore').hidden = gm || !folded; }
    const fold = folded && !gm;
    $p('.su').classList.toggle('folded', fold);
    $p('#suCourse').hidden = m === 'in';
    $p('#suNote').textContent = fold ? T('Автор сайта увидит только ваш @username в Telegram.')
      : gm ? T('Сменить имя потом можно один раз — в настройках.')
      : m === 'up' ? T('Пароль хранится у Google — даже автор сайта его не видит.') + (gOn ? ' ' + (tOn ? T('При входе через Google автор видит вашу почту, через Telegram — ваш @username.') : T('При входе через Google автор видит вашу почту.')) : tOn ? ' ' + T('При входе через Telegram автор видит ваш @username.') : '')
      : T('Забыли пароль? Напишите автору сайта: tg @ziplogo');
    hint($p('#suPassHint'), m === 'up' ? T('Минимум 6 символов') : '');
    err.textContent = '';
    nameInp.classList.remove('bad'); passInp.classList.remove('bad');
    checkName();
  }
  // live «имя свободно / занято» while signing up
  function checkName() {
    clearTimeout(checkT);
    const h = $p('#suNameHint'), n = cleanName(nameInp.value);
    if (mode === 'in' || n.length < 3) return hint(h, '');
    const p = nameProblem(n);
    if (p) return hint(h, p, 'bad');
    const my = ++checkN;
    hint(h, '');
    checkT = setTimeout(() => {
      Account.owner(nameKey(n)).then(o => { if (my === checkN && mode !== 'in') hint(h, o ? T('Это имя уже занято') : T('Имя свободно'), o ? 'bad' : 'ok'); }, () => {});
    }, 450);
  }
  function fail(r) {
    err.textContent = r.msg;
    const el = r.f === 'name' ? nameInp : r.f === 'pass' ? passInp : null;
    if (el) { el.classList.add('bad'); el.focus(); }
  }
  async function go() {
    if (busy) return;
    if (skip) { sh.close(); return; }
    err.textContent = '';
    const name = cleanName(nameInp.value), pass = passInp.value;
    const np = nameProblem(name);
    if (np) return fail({ msg: np, f: 'name' });
    if (mode !== 'g' && pass.length < 6) return fail({ msg: mode === 'up' ? T('Пароль — минимум 6 символов') : T('Неверный пароль'), f: 'pass' });
    busy = true; btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = mode === 'in' ? T('Вхожу…') : T('Регистрирую…');
    try {
      if (mode === 'g') await Account.claimExternal(g, name, course);
      else if (mode === 'up') await Account.signUp(name, pass, course);
      else await Account.signIn(name, pass);
    } catch (e) {
      busy = false; btn.disabled = false; btn.textContent = label;
      const r = authError(e);
      if (r.down && !dismissible) {
        // the service is down: never lock the person out of the trainer — ask again next time
        Account.works = false; skip = true;
        err.textContent = T('Регистрация сейчас не работает. Можно заниматься дальше — предложим позже.');
        btn.textContent = T('Продолжить');
        return;
      }
      return fail(r);
    }
    const u = Account.user;
    S.profile = null;
    if (u.course) S.course = u.course;
    sh.close();
    facAfterSignIn(u);
    save(); renderAll(); applyBlock(); Presence.live();
    if (!u.blocked) toast(mode === 'in' ? T('С возвращением, {0}!', u.name) : T('Готово, {0}! Всё открыто', u.name));
  }
  nameInp.addEventListener('input', () => { nameInp.classList.remove('bad'); err.textContent = ''; checkName(); });
  passInp.addEventListener('input', () => { passInp.classList.remove('bad'); err.textContent = ''; });
  nameInp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); passInp.focus(); } });
  passInp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
  setMode(mode);
  if (!folded) setTimeout(() => (legacy && mode === 'up' ? passInp : nameInp).focus({ preventScroll: true }), 250);
  return sh;
}

// A small sheet with fields; submit() resolves to null when done, or { msg, f } to show an error and stay.
function formSheet({ title, msg = '', fields, ok, submit }) {
  const html = `<div class="dlg su">
<div class="dlg-title">${esc(title)}</div>${msg ? `<div class="dlg-msg">${esc(msg)}</div>` : ''}
${fields.map((f, i) => `<input class="f-in" data-f="${i}" type="${f.type || 'text'}" placeholder="${esc(f.ph)}" value="${esc(f.value || '')}" maxlength="${f.max || 128}" autocomplete="${f.ac || 'off'}" autocapitalize="${f.type === 'password' ? 'off' : 'words'}" autocorrect="off" spellcheck="false" enterkeyhint="${i === fields.length - 1 ? 'done' : 'next'}" aria-label="${esc(f.ph)}">`).join('\n')}
<div class="su-err" role="alert"></div>
<div class="dlg-btns"><button type="button" class="dlg-btn" data-s="cancel">${T('Отмена')}</button><button type="button" class="dlg-btn primary" data-s="ok">${esc(ok)}</button></div>
</div>`;
  let busy = false;
  const sh = openSheet({
    cls: 'dialog', html,
    onClick: async (act, el, e, close) => {
      if (act === 'cancel') return close();
      if (act !== 'ok' || busy) return;
      busy = true; el.disabled = true;
      const label = el.textContent;
      el.textContent = T('Подождите…');
      let r;
      try { r = await submit(inputs.map(i => i.value)); } catch (x) { r = authError(x); }
      busy = false; el.disabled = false; el.textContent = label;
      if (!r) return close();
      sh.panel.querySelector('.su-err').textContent = r.msg;
      const bad = inputs[fields.findIndex(f => f.id === r.f)] || inputs[0];
      bad.classList.add('bad'); bad.focus();
    }
  });
  const inputs = [...sh.panel.querySelectorAll('[data-f]')];
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => { inp.classList.remove('bad'); sh.panel.querySelector('.su-err').textContent = ''; });
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (inputs[i + 1]) inputs[i + 1].focus(); else sh.panel.querySelector('[data-s="ok"]').click();
    });
  });
  setTimeout(() => inputs[0].focus({ preventScroll: true }), 250);
}
