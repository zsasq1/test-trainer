<title>Тренажёр тестов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen trainer — top bar, scrolling question, thumb-zone controls at the bottom; menu slides in from the left. Mirrors the native TestTrainer look. */
:root{
  --bg:#F7FAFA; --surface:#FFFFFF; --line:#DBE0E6; --text:#1A1F29; --muted:#6B7585;
  --green:#1F8C4D; --green-btn:#1F8C4D; --soft-green:#E3F5E8; --green-line:rgba(31,140,77,.55);
  --red:#D93A3F; --soft-red:#FAE8E8; --red-line:rgba(217,58,63,.55);
  --gray-btn:#8E8E93; --star:#E9AE00; --soft-star:rgba(233,174,0,.14);
  --switch-off:#D3D8DE; --knob:#FFFFFF; --on-accent:#FFFFFF;
  --scrim:rgba(10,14,20,.28); --shadow:rgba(16,24,40,.16); --bar:rgba(247,250,250,.92);
  --toast-bg:#1A1F29; --toast-fg:#FFFFFF; --glow:rgba(31,140,77,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113; --surface:#171B1F; --line:#2A3036; --text:#E8ECEF; --muted:#8E98A5;
    --green:#3DBA72; --green-btn:#1F8C4D; --soft-green:#122B1C; --green-line:rgba(61,186,114,.5);
    --red:#FF6B6B; --soft-red:#341A1C; --red-line:rgba(255,107,107,.5);
    --gray-btn:#4B5158; --star:#FFD43B; --soft-star:rgba(255,212,59,.12);
    --switch-off:#3A4047; --knob:#FFFFFF; --on-accent:#FFFFFF;
    --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.5); --bar:rgba(14,17,19,.92);
    --toast-bg:#E8ECEF; --toast-fg:#0E1113; --glow:rgba(61,186,114,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113; --surface:#171B1F; --line:#2A3036; --text:#E8ECEF; --muted:#8E98A5;
  --green:#3DBA72; --green-btn:#1F8C4D; --soft-green:#122B1C; --green-line:rgba(61,186,114,.5);
  --red:#FF6B6B; --soft-red:#341A1C; --red-line:rgba(255,107,107,.5);
  --gray-btn:#4B5158; --star:#FFD43B; --soft-star:rgba(255,212,59,.12);
  --switch-off:#3A4047; --knob:#FFFFFF; --on-accent:#FFFFFF;
  --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.5); --bar:rgba(14,17,19,.92);
  --toast-bg:#E8ECEF; --toast-fg:#0E1113; --glow:rgba(61,186,114,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;box-sizing:border-box;-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.4 var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.i.f{fill:currentColor;stroke:none}
.i .fillc{fill:currentColor;stroke:currentColor}
.i .onfill{stroke:var(--on-accent)}

/* ---------- shell ---------- */
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}
.topbar{flex:none;display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.icon-btn{width:42px;height:42px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:17px}
.icon-btn:active:not(:disabled){opacity:.7}
.icon-btn:disabled{opacity:.4}
.titles{flex:1;min-width:0}
.title{font-size:20px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{font-size:13px;font-weight:500;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.top-actions{flex:none;display:flex;align-items:center;gap:10px}
.plain-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--green);font-size:19px;border-radius:8px}
.star-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:21px;border-radius:8px}
.star-btn.on{color:var(--star)}
.star-btn.pop .i{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.3)}}
.switch{position:relative;width:46px;height:28px;flex:none;border-radius:999px;background:var(--switch-off);transition:background .2s}
.switch span{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px var(--shadow);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--green-btn)}
.switch[aria-checked="true"] span{transform:translateX(18px)}

.scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.content{display:flex;flex-direction:column;gap:18px;padding-block:18px 28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.content.enter{animation:fadein .22s ease}
@keyframes fadein{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}

.bottombar{flex:none;display:flex;flex-direction:column;gap:10px;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.actions-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions-row.last{grid-template-columns:1fr 48px 48px}
.act{height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;color:var(--on-accent);font-size:16px;font-weight:600;padding:0 12px}
.act .i{font-size:19px}
.act.gray{background:var(--gray-btn)}
.act.green{background:var(--green-btn)}
.act.red{background:var(--red)}
.act.wide{width:100%}
.act:active:not(:disabled){filter:brightness(.88)}
.act:disabled{opacity:.45}
.nav-row{display:flex;align-items:center;gap:12px}
.counter{flex:1;height:42px;font-size:15px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter:active{background:var(--surface)}

/* ---------- question ---------- */
.q{display:flex;flex-direction:column;gap:16px}
.prompt{font-size:calc(20px * var(--fs));font-weight:600;line-height:1.35;text-wrap:pretty;overflow-wrap:anywhere}
.prompt.sm{font-size:calc(18px * var(--fs))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ctx,.reveal-text{font-size:calc(16px * var(--fs));line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.choices,.dd-list{display:flex;flex-direction:column;gap:10px}
.choice{width:100%;display:flex;align-items:flex-start;gap:12px;padding:12px;text-align:left;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:calc(16px * var(--fs));line-height:1.4;transition:background .15s,border-color .15s,transform .12s}
.choice:active{transform:scale(.99)}
.choice .ico{width:24px;height:calc(22px * var(--fs));min-height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;flex:none}
.choice.is-sel{background:var(--soft-green);border-color:var(--green-line)}
.choice.is-sel .ico.base{color:var(--green)}
.ctext{flex:1;min-width:0;overflow-wrap:anywhere}
.choice .ico.status{display:none}
.choice.st-ok .ico.status{color:var(--green)}
.choice.st-bad .ico.status{color:var(--red)}
.q[data-hl="1"] .choice.st-ok{background:var(--soft-green);border-color:var(--green-line)}
.q[data-hl="1"] .choice.st-bad{background:var(--soft-red);border-color:var(--red-line)}
.q[data-hl="1"] .choice.st-ok .ico.base,.q[data-hl="1"] .choice.st-bad .ico.base{display:none}
.q[data-hl="1"] .choice.st-ok .ico.status,.q[data-hl="1"] .choice.st-bad .ico.status{display:inline-flex}

.dd-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(118px,44%);gap:12px;align-items:start;padding:12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.dd-left{font-size:calc(16px * var(--fs));font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.dd-right{min-width:0;display:flex;flex-direction:column;gap:6px}
.dd-btn{width:100%;display:flex;align-items:flex-start;gap:8px;padding:8px 10px;text-align:left;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:calc(16px * var(--fs));font-weight:600;line-height:1.35}
.dd-btn>span{flex:1;min-width:0;overflow-wrap:anywhere}
.dd-btn .ph{color:var(--muted)}
.dd-btn .i{font-size:13px;color:var(--muted);margin-top:3px}
.hint-correct{display:none;color:var(--green);font-size:calc(15px * var(--fs));font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.q[data-hl="1"] .hint-correct{display:block}
.q[data-hl="1"] .dd-row.st-ok{background:var(--soft-green);border-color:var(--green-line)}
.q[data-hl="1"] .dd-row.st-bad{background:var(--soft-red);border-color:var(--red-line)}

.sort-hint{font-size:14px;font-weight:500;color:var(--muted);margin-bottom:-8px}
.sort-list{display:flex;flex-direction:column;gap:8px;position:relative}
.sort-row{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);transition:transform .18s ease;position:relative}
.sort-row.dragging{transition:none;z-index:3;box-shadow:0 10px 24px var(--shadow)}
.num{width:24px;height:24px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.stext{flex:1;min-width:0;font-size:calc(16px * var(--fs));font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.handle{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:19px;touch-action:none;cursor:grab;border-radius:8px}
.sort-row.dragging .handle{cursor:grabbing;color:var(--green)}
.sort-row .ico.status{display:none;font-size:20px}
.sort-row.st-ok .ico.status{color:var(--green)}
.sort-row.st-bad .ico.status{color:var(--red)}
.q[data-hl="1"] .sort-row .num,.q[data-hl="1"] .handle,.q[data-hl="1"] .sort-hint{display:none}
.q[data-hl="1"] .sort-row .ico.status{display:inline-flex}
.q[data-hl="1"] .sort-row{padding-right:12px}
.q[data-hl="1"] .sort-row.st-ok{background:var(--soft-green);border-color:var(--green-line)}
.q[data-hl="1"] .sort-row.st-bad{background:var(--soft-red);border-color:var(--red-line)}

.field{display:flex;flex-direction:column;gap:8px}
.txt{width:100%;display:block;resize:none;overflow:hidden;padding:12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:max(16px,calc(17px * var(--fs)));font-weight:600;line-height:1.35;min-height:48px}
.txt:focus{outline:none;border-color:var(--green-line)}
.q[data-hl="1"] .txt.st-ok{background:var(--soft-green);border-color:var(--green-line)}
.q[data-hl="1"] .txt.st-bad{background:var(--soft-red);border-color:var(--red-line)}

.case-sub{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.sublabel{font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sublabel.own{color:var(--green)}
.mini-del{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--red);font-size:15px;border-radius:8px}
.feedback{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:15px;font-weight:600}
.feedback .i{font-size:20px}
.feedback.ok{background:var(--soft-green);color:var(--green)}
.feedback.bad{background:var(--soft-red);color:var(--red)}
.pulse{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 transparent}35%{transform:scale(1.035);box-shadow:0 0 14px 2px var(--glow)}100%{transform:scale(1);box-shadow:0 0 0 0 transparent}}

.state{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px 8px}
.state .big{font-size:36px;color:var(--muted)}
.state h2{margin:0;font-size:20px;font-weight:600;text-wrap:balance}
.state p{margin:0;font-size:15px;color:var(--muted);max-width:34ch;text-wrap:pretty}
.state .act{margin-top:6px;min-width:220px}
.state .ghost-btn{margin-top:2px}
.ghost-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:8px;color:var(--green);font-weight:600;font-size:15px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .24s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:40;width:min(86vw,350px);display:flex;flex-direction:column;gap:16px;background:var(--surface);box-shadow:8px 0 24px var(--shadow);transform:translateX(-106%);transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-bottom:0;visibility:hidden}
.drawer.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
.d-head{display:flex;align-items:center;gap:12px}
.d-head>div{flex:1;min-width:0}
.d-title{font-size:24px;font-weight:600}
.d-sub{font-size:14px;font-weight:500;color:var(--muted)}
.searchbox{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.searchbox input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:16px;color:var(--text)}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox button{color:var(--muted);font-size:18px;display:inline-flex}
.menu-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:22px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));margin-right:-8px;padding-right:8px}
.msec{display:flex;flex-direction:column;gap:6px}
.sec-label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.msec-note{margin:0;padding:6px 0;font-size:15px;color:var(--muted)}
.mline{display:flex;align-items:center;gap:4px}
.mrow{width:100%;min-height:46px;display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;text-align:left;font-size:16px;font-weight:600}
.mrow:active{background:var(--bg)}
.mrow.on{background:var(--soft-green)}
.mrow .mico{width:22px;display:inline-flex;justify-content:center;color:var(--muted);font-size:18px;flex:none}
.mrow.on .mico{color:var(--green)}
.mrow .mtxt{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.3}
.mrow .mtxt small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.mrow .mtick{color:var(--green);font-size:15px}
.mrow.outline{background:var(--bg);border:1px solid var(--line);color:var(--green);cursor:pointer}
.mrow.outline .mico{color:var(--green)}
.mrow.subtle{color:var(--green);font-size:15px;min-height:40px;cursor:pointer}
.mrow.subtle .mico{color:var(--green)}
.mrow.static{cursor:default}
.mrow.static:active{background:none}
.mrow.star-on{background:var(--soft-star)}
.mrow.star-on .mico{color:var(--star)}
.mrow.test-on{background:var(--soft-green);border:1px solid var(--green-line)}
.mrow.box{background:var(--bg);border:1px solid var(--line)}
.badge{font-size:13px;font-weight:600;color:var(--muted);padding:4px 8px;border-radius:999px;background:var(--bg);font-variant-numeric:tabular-nums}
.mrow.on .badge{background:var(--surface)}
.mmore,.mx{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);font-size:18px}
.mmore:active,.mx:active{background:var(--bg)}
.mx{font-size:16px}
.mlink{align-self:flex-start;color:var(--green);font-size:14px;font-weight:600;padding:6px 2px}
.sres{width:100%;display:flex;flex-direction:column;gap:5px;padding:10px;border-radius:8px;background:var(--bg);text-align:left}
.sres b{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sres span{font-size:13px;font-weight:500;color:var(--muted)}
.panel-s{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.fs-row{display:flex;align-items:center;gap:12px}
.fs-row input{flex:1;min-width:0;accent-color:var(--green-btn)}
.fs-foot{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;color:var(--muted);min-height:28px}
.fs-foot .mlink{padding:2px}
.sq-btn{width:36px;height:36px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-weight:700;font-size:15px}
.sq-btn:disabled{opacity:.4}
.sq-btn.a-sm{font-size:13px}
.sq-btn.a-lg{font-size:20px}
.store-note{font-size:13px;color:var(--muted);line-height:1.4;padding:2px 2px 0}
details.help{border-radius:8px;background:var(--bg);border:1px solid var(--line)}
details.help summary{list-style:none;cursor:pointer;padding:11px 12px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.help summary::-webkit-details-marker{display:none}
details.help summary .i{font-size:14px;color:var(--muted);transition:transform .2s}
details.help[open] summary .i{transform:rotate(180deg)}
details.help p{margin:0;padding:0 12px 12px;font-size:14px;line-height:1.45;color:var(--muted)}
details.help pre{margin:0 12px 12px;padding:10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font:12px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.d-foot{font-size:12px;color:var(--muted);text-align:center;padding-top:4px}

/* ---------- sheets & dialogs ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px var(--shadow);animation:up .24s cubic-bezier(.2,.8,.2,1);padding-block:18px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet.full{height:calc(100% - 10px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;overflow:hidden;padding:0}
.sheet-wrap.closing .sheet{animation:down .18s ease forwards}
.sheet-wrap.closing .sheet-scrim{animation:fade .18s ease reverse forwards}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@media (min-width:640px){
  .sheet-wrap{align-items:center;padding:24px}
  .sheet{border-radius:14px}

const EMPTY_BANK = Object.freeze({ byCat: Object.fromEntries(CATS.map(c => [c, []])), byId: new Map(), total: 0, skipped: 0 });

function buildBank(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
    throw new Error('Ожидался объект вида {"Текст вопроса": {"type": "single", "all_options": [...]}}.');
  }
  const keys = Object.keys(raw);
  const keyIndex = new Map(keys.map((k, i) => [k, i]));
  const entries = keys.map(k => ({ prompt: k, r: raw[k] })).filter(e => e.r && typeof e.r === 'object' && !Array.isArray(e.r));
  entries.sort((a, b) => coll.compare(a.prompt, b.prompt));
  const groups = { single: [], multiple: [], dropdown: [], sortable: [], text: [] };

  for (const { prompt, r } of entries) {
    const ctx = typeof r.main_text === 'string' && r.main_text.trim() ? r.main_text : null;

      case 'multiple': {
        const options = opts.filter(o => typeof o.text === 'string' && o.text !== '').map(o => ({ text: o.text, correct: o.correct === true }));

      }

      }

    single: tag(groups.single, 'single', choiceSrc),
    dropdown: tag(groups.dropdown, 'dropdown', q => [q.prompt].concat(q.rows.map(x => x.left + ' ' + x.value)).join(' ')),
    sortable: tag(groups.sortable, 'sortable', q => [q.prompt].concat(q.order).join(' ')),
    text: tag(groups.text, 'text', q => [q.context, q.prompt].concat(q.accepted).filter(Boolean).join(' ')),
    caseStudy: cases
  };
  const byId = new Map();
  for (const c of CATS) for (const it of byCat[c]) byId.set(it.id, it);
  return { byCat, byId, total: all.length, skipped };
}

function searchBank(bank, query) {
  const nq = norm(query);
  if (!nq) return [];
  const toks = nq.split(' ');
  const isSubseq = (needle, hay) => { let i = 0; for (const ch of hay) { if (ch === needle[i]) i++; if (i === needle.length) return true; } return i === needle.length; };
  const out = [];
  for (const c of CATS) for (const it of bank.byCat[c]) {
    const hay = it.hay || (it.hay = norm(it.searchSrc));
    if (!hay) continue;
    let sc;
    if (hay.includes(nq)) sc = 0;
    else if (toks.every(t => hay.includes(t))) sc = 1;
    else {
      const words = hay.split(' ');
      const hit = toks.filter(t => hay.includes(t) || (t.length > 2 && words.some(w => isSubseq(t, w)))).length;
      if (hit >= Math.max(1, Math.ceil(toks.length / 2))) sc = 2; else continue;
    }
    out.push({ it, sc, len: hay.length });
  }
  out.sort((a, b) => a.sc - b.sc || a.len - b.len);
  return out.slice(0, 80).map(x => x.it);
}

/* =========================================================
   Persistence: claude.ai account (db + assets) or this browser
   ========================================================= */
const IDB_NAME = 'TestTrainer', IDB_STORE = 'files';
let idbPromise = null;
function idb() {
  if (!idbPromise) idbPromise = new Promise((resolve, reject) => {
    try {
      const r = indexedDB.open(IDB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE, { keyPath: 'id' });
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    } catch (e) { reject(e); }
  });
  return idbPromise;
}
async function idbReq(mode, fn) {
  const d = await idb();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(IDB_STORE, mode);
    const req = fn(tx.objectStore(IDB_STORE));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}
const idbGet = id => idbReq('readonly', s => s.get(id)).catch(() => null);
const idbPut = rec => idbReq('readwrite', s => s.put(rec)).then(() => true, () => false);
const idbDel = id => idbReq('readwrite', s => s.delete(id)).catch(() => null);
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

const Store = {
  mode: 'local', db: null, assets: null, uid: null, warned: false,
  async init() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') {
      // Own site (GitHub Pages / Mac): ask the browser not to clear saved files and progress.
      try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
      return;
    }
    try {
      const [db, user, assets] = await Promise.all([c.use('db'), c.use('user'), c.use('assets')]);
      const uid = db && user ? await user.id() : null;
      if (db && uid) { this.db = db; this.uid = uid; this.assets = assets; this.mode = 'cloud'; }
    } catch (e) { /* stay local */ }
  },
  stateDoc() { return this.db.doc('data/users/' + this.uid + '/state'); },
  readLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } },
  async loadState() {
    const local = this.readLocal();
    if (this.mode === 'cloud') {
      try {
        const snap = await withTimeout(this.stateDoc().get(), 10000);
        if (snap.exists) {
          const d = snap.data();
          if (d && typeof d.json === 'string') { this.lastCloud = d.json; return { state: JSON.parse(d.json), fresh: false }; }
        }
        return { state: local, fresh: true };
      } catch (e) {
        this.mode = 'local';
        this.cloudDown = true;
      }
    }
    return { state: local, fresh: false };
  },
  writing: false, pending: null, lastCloud: '',
  persist(str) {
    try { localStorage.setItem(LS_KEY, str); } catch (e) { /* storage full or blocked */ }
    if (this.mode === 'cloud') this.writeCloud(str);
  },
  async writeCloud(str) {
    if (str === this.lastCloud) return;
    if (this.writing) { this.pending = str; return; }
    this.writing = true;
    try {
      await this.stateDoc().set({ json: str });
      this.lastCloud = str;
    } catch (e) {
      if (!this.warned) { this.warned = true; toast('Не удалось сохранить прогресс в аккаунте. Он сохранится в этом браузере.'); }
    }
    this.writing = false;
    if (this.pending != null) { const p = this.pending; this.pending = null; this.writeCloud(p); }
  },
  async putFile(text) {
    if (this.mode === 'cloud' && this.assets) {
      try {
        const r = await this.assets.upload(new Blob([text], { type: 'application/json' }), { type: 'application/json' });
        return { store: 'cloud', ref: r.id };
      } catch (e) { /* fall back to this browser */ }
    }
    const ref = 'f-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    if (!(await idbPut({ id: ref, text }))) throw new Error('Память браузера недоступна (частный режим?). Файл не сохранился.');
    return { store: 'local', ref };
  },
  async getFile(rec) {
    if (rec.store === 'cloud') {
      const r = await fetch('/_blob/' + rec.ref);
      if (!r.ok) throw new Error('Файл не открылся из аккаунта (код ' + r.status + '). Загрузите его заново.');
      return r.text();
    }
    const row = await idbGet(rec.ref);
    if (!row) throw new Error('Файла нет в памяти этого браузера. Загрузите его заново.');
    return row.text;
  },
  async delFile(rec) {
    try {
      if (rec.store === 'cloud') { if (this.assets) await this.assets.delete(rec.ref); }
      else await idbDel(rec.ref);
    } catch (e) { /* ignore */ }
  },
  async migrateLocalFiles(sets) {
    if (this.mode !== 'cloud' || !this.assets) return false;
    let changed = false;
    for (const rec of sets) {
      if (rec.store !== 'local') continue;
      const row = await idbGet(rec.ref);
      if (!row) continue;
      try {
        const r = await this.assets.upload(new Blob([row.text], { type: 'application/json' }), { type: 'application/json' });
        rec.store = 'cloud'; rec.ref = r.id; changed = true;
      } catch (e) { break; }
    }
    return changed;
  }
};

/* ---------- answer records ---------- */
const EMPTY_REC = Object.freeze({ sel: null, multi: Object.freeze([]), dd: Object.freeze({}), order: null, text: '', shuf: null, checked: false, reveal: false });
const rec = id => S.answers[akey(id)] || EMPTY_REC;
function mut(id, fn) {
  const k = akey(id);
  if (!S.answers[k]) S.answers[k] = { sel: null, multi: [], dd: {}, order: null, text: '', shuf: null, checked: false, reveal: false };
  fn(S.answers[k]);

const clearRec = id => { delete S.answers[akey(id)]; };
const hlVisible = id => { const r = rec(id); return r.checked || r.reveal; };
const customSubsOf = caseId => S.customSubs[caseId] || [];

function subToQ(s) {
  switch (s.type) {
    case 'single': case 'multiple':
      return { kind: s.type, id: s.id, prompt: s.prompt, context: null, options: (s.options || []).map(o => ({ text: o.text, correct: !!o.correct })) };
    case 'dropdown': {
      const rows = (s.rows || []).map(r => ({ left: r.left, value: r.value }));
      return { kind: 'dropdown', id: s.id, prompt: s.prompt, context: null, rows, choices: (s.choices && s.choices.length) ? s.choices : uniq(rows.map(r => r.value)) };
    }
    case 'sortable':
      return { kind: 'sortable', id: s.id, prompt: s.prompt, context: null, order: s.order || [] };
    default:
      return { kind: 'text', id: s.id, prompt: s.prompt, context: null, accepted: s.accepted || [] };
  }
}
const subsOfCase = it => it.subs.concat(customSubsOf(it.id).map(subToQ));

function ensureShuf(id, n) {
  const r = rec(id);
  if (isPerm(r.shuf, n)) return r.shuf;
  const s = shuffledDifferent(range(n));
  mut(id, x => { x.shuf = s; });
  return s;
}
function sortOrder(q) {
  const r = rec(q.id), n = q.order.length;
  if (isPerm(r.order, n)) return r.order;
  const o = shuffledDifferent(range(n));
  mut(q.id, x => { x.order = o; });
  return o;
}
function isCorrect(q) {
  const r = rec(q.id);
  switch (q.kind) {
    case 'single': return r.sel != null && !!(q.options[r.sel] && q.options[r.sel].correct);
    case 'multiple': {
      const sel = new Set(r.multi);
      const want = q.options.map((o, i) => o.correct ? i : -1).filter(i => i >= 0);
      return sel.size === want.length && want.every(i => sel.has(i));
    }
    case 'dropdown': return q.rows.every((row, i) => r.dd[i] === row.value);
    case 'sortable': { const o = sortOrder(q); return o.every((oi, pos) => q.order[oi] === q.order[pos]); }
    case 'text': { const a = normText(r.text); return !!a && q.accepted.some(x => normText(x) === a); }
    case 'case': return subsOfCase(q).every(isCorrect);
  }
  return false;
}
function answerText(q, short) {
  switch (q.kind) {
    case 'single': { const o = q.options.find(o => o.correct); return o ? o.text : (short ? 'не найден' : 'Правильный ответ не найден.'); }
    case 'multiple': return q.options.filter(o => o.correct).map(o => o.text).join('\n') || 'нет верных вариантов';
    case 'dropdown': return q.rows.map(r => r.left + ' — ' + r.value).join('\n');
    case 'sortable': return q.order.map((v, i) => (i + 1) + '. ' + v).join('\n');
    case 'text': return q.accepted.length ? q.accepted.join('\n') : (short ? 'не найден' : 'Правильный ответ не указан в JSON.');
    case 'case': {
      const built = q.subs.map((s, i) => (i + 1) + '. ' + s.prompt + '\nОтвет: ' + answerText(s, true));
      const own = customSubsOf(q.id).map((s, i) => 'Ваш вопрос ' + (i + 1) + '. ' + s.prompt + '\nОтвет: ' + answerText(subToQ(s), true));
      return built.concat(own).join('\n\n');
    }
  }
  return '';
}

/* ---------- navigation & selection ---------- */
function currentItems() {
  if (!bankReady()) return [];
  if (S.test) return S.test.ids.map(id => bank.byId.get(id)).filter(Boolean);
  const base = bank.byCat[S.category] || [];
  if (S.starOnly) { const st = new Set(S.starred[S.setId] || []); return base.filter(it => st.has(it.id)); }
  return base;
}
const currentItem = () => currentItems()[S.index] || null;
function remember() { if (bankReady() && !S.test && !S.starOnly) S.indexByScope[scopeKey()] = S.index; }
function clampIndex() {
  if (!bankReady()) return;
  const n = currentItems().length;
  if (!Number.isInteger(S.index) || S.index < 0) S.index = 0;
  if (n === 0) S.index = 0; else if (S.index >= n) S.index = n - 1;
  remember();
}
function resetItem(it) {
  if (!it) return;
  clearRec(it.id);
  if (it.kind === 'case') subsOfCase(it).forEach(s => clearRec(s.id));
}
function shuffleQ(q) {
  switch (q.kind) {
    case 'single': case 'multiple': mut(q.id, r => { r.shuf = shuffledDifferent(range(q.options.length)); r.checked = false; r.reveal = false; }); break;
    case 'dropdown': mut(q.id, r => { r.shuf = shuffledDifferent(range(q.choices.length)); r.checked = false; r.reveal = false; }); break;
    case 'sortable': mut(q.id, r => { r.order = shuffledDifferent(range(q.order.length)); r.checked = false; r.reveal = false; }); break;
    case 'case': subsOfCase(q).forEach(shuffleQ); break;
  }
}
function endTest() {
  if (!S.test) return;
  if (bankReady()) S.test.ids.forEach(id => resetItem(bank.byId.get(id)));
  S.test = null;
  S.index = S.indexByScope[scopeKey()] || 0;
  clampIndex();
  save();
}
function selectSet(id) {
  if (!SETS.some(s => s.id === id)) return;
  if (id === S.setId && bankStatus !== 'error') return;
  endTest();
  remember();
  S.setId = id;
  S.starOnly = false;
  S.index = S.indexByScope[scopeKey()] || 0;
  activateSet();
  save();
}
function selectCategory(cat) {

  remember();
  S.category = cat;
  S.starOnly = false;

}
function selectStarred(cat) {

  S.index = 0;

}
function selectItem(cat, id) {

  remember();
  const i = (bank.byCat[cat] || []).findIndex(x => x.id === id);
  S.category = cat;
  S.starOnly = false;
  S.index = i < 0 ? 0 : i;
  remember();

}
function goPrev() {
  if (S.index <= 0) return;
  S.index--;
  checkSeq++;
  remember();
  save();
}
function goNext() {
  const items = currentItems();
  if (!items.length) return;
  const leaving = S.test ? null : items[S.index];
  S.index = S.index >= items.length - 1 ? 0 : S.index + 1;
  if (leaving) resetItem(leaving);
  checkSeq++;

function jumpTo(i) {

  if (!n) return;
  S.index = clamp(i, 0, n - 1);

/* ---------- answering ---------- */
function answerChanged(qid) {
  checkSeq++;
  const it = currentItem();
  if (it && it.kind === 'case' && it.id !== qid && subsOfCase(it).some(s => s.id === qid)) {
    mut(it.id, r => { r.checked = false; r.reveal = false; });
  }
}
function pick(qid, i) {
  const q = QMAP.get(qid);
  if (!q) return;
  if (q.kind === 'single') mut(qid, r => { r.sel = i; r.checked = false; r.reveal = false; });
  else mut(qid, r => { const s = new Set(r.multi); s.has(i) ? s.delete(i) : s.add(i); r.multi = [...s]; r.checked = false; r.reveal = false; });
  answerChanged(qid);
}
function setDD(qid, row, value) {
  mut(qid, r => { if (value) r.dd[row] = value; else delete r.dd[row]; r.checked = false; r.reveal = false; });
  answerChanged(qid);
}
function setOrder(qid, order) {
  mut(qid, r => { r.order = order; r.checked = false; r.reveal = false; });
  answerChanged(qid);
}
function setText(qid, text) {
  mut(qid, r => { r.text = text; r.checked = false; r.reveal = false; });
  answerChanged(qid);
}
function check() {
  const it = currentItem();
  if (!it) return;
  mut(it.id, r => { r.checked = true; });
  const ok = isCorrect(it);
  const seq = ++checkSeq;
  haptic();
  if (ok) pulse = { scope: it.id };
  render();
  const items = currentItems();
  const lastInTest = S.test && S.index >= items.length - 1;
  if (ok && S.autoAdvance && !lastInTest) {
    setTimeout(() => {
      const cur = currentItem();
      if (cur && cur.id === it.id && checkSeq === seq && !anySheet()) { goNext(); render(); }
    }, 800);
  } else if (ok && !S.autoAdvance && !S.test) {
    setTimeout(() => {
      const cur = currentItem();
      if (cur && cur.id === it.id && checkSeq === seq) { resetItem(it); shuffleQ(it); save(); render(); }
    }, 800);
  }
}
function reveal() {
  const it = currentItem();
  if (!it) return;
  if (hlVisible(it.id)) { resetItem(it); shuffleQ(it); }
  else mut(it.id, r => { r.reveal = true; });
  checkSeq++;
  save();
}
const isStarred = id => (S.starred[S.setId] || []).includes(id);
function toggleStar(id) {
  const list = new Set(S.starred[S.setId] || []);
  list.has(id) ? list.delete(id) : list.add(id);

/* ---------- custom test ---------- */
const pointsFor = it => (S.test && S.test.points[it.category]) || 0;
const testTotal = () => currentItems().reduce((a, it) => a + pointsFor(it), 0);
const testEarned = () => currentItems().reduce((a, it) => a + (rec(it.id).checked && isCorrect(it) ? pointsFor(it) : 0), 0);
function startTest(configs, shouldSave) {
  const ids = [], points = {}, saved = [];
  for (const c of configs) {
    if (!(c.count > 0)) continue;
    const avail = bank.byCat[c.cat] || [];
    const n = Math.min(c.count, avail.length);
    if (!n) continue;
    shuffle(avail.slice()).slice(0, n).forEach(it => ids.push(it.id));
    points[c.cat] = Math.max(0, c.points | 0);
    saved.push({ cat: c.cat, count: n, points: points[c.cat] });
  }
  if (!ids.length) return false;
  if (shouldSave) {
    let k = S.savedTests.length + 1;
    while (S.savedTests.some(t => t.title === 'Тест ' + k)) k++;
    S.savedTests.unshift({ id: sid('saved-test', S.setId + '|' + k + '|' + Date.now()), title: 'Тест ' + k, setId: S.setId, setTitle: setTitle(curSet()), configs: saved, createdAt: Date.now() });
  }
  remember();
  S.test = { setId: S.setId, ids, points };
  S.starOnly = false;
  S.index = 0;
  ids.forEach(id => { const it = bank.byId.get(id); resetItem(it); shuffleQ(it); });
  save();
  return true;
}

/* =========================================================
   Loading sets
   ========================================================= */
async function loadBank(entry) {
  if (BANKS.has(entry.id)) return BANKS.get(entry.id);
  if (LOADING.has(entry.id)) return LOADING.get(entry.id);
  const p = (async () => {
    let text;
    if (entry.rec) text = await Store.getFile(entry.rec);
    else {
      const r = await fetch('data/' + encodeURIComponent(entry.file));
      if (!r.ok) throw new Error('Встроенный файл не открылся (код ' + r.status + ').');
      text = await r.text();
    }
    text = text.replace(/^﻿/, '');
    entry.hash = cyrb53(text).toString(36);
    const b = buildBank(JSON.parse(text));
    BANKS.set(entry.id, b);
    return b;
  })().catch(e => { const v = { error: e.message || String(e) }; BANKS.set(entry.id, v); return v; })
    .finally(() => LOADING.delete(entry.id));
  LOADING.set(entry.id, p);
  return p;
}
function applyBank(b) {
  if (!b || b.error) { bank = EMPTY_BANK; bankStatus = 'error'; bankError = (b && b.error) || 'Неизвестная ошибка'; return; }
  bank = b; bankStatus = 'ready'; bankError = '';
  if (S.test && (S.test.setId !== S.setId || !S.test.ids.some(id => bank.byId.has(id)))) S.test = null;
  clampIndex();
}
function activateSet() {
  const s = curSet();
  if (!s) { bank = EMPTY_BANK; bankStatus = 'ready'; loadingPromise = Promise.resolve(); return loadingPromise; }
  if (BANKS.has(s.id)) { applyBank(BANKS.get(s.id)); loadingPromise = Promise.resolve(); return loadingPromise; }
  bank = EMPTY_BANK; bankStatus = 'loading'; bankError = '';
  const id = s.id;
  loadingPromise = loadBank(s).then(b => { if (S.setId === id) { applyBank(b); renderAll(); } });
  return loadingPromise;
}

/* ---------- import ---------- */
function uniqueTitle(t) {
  const taken = new Set(SETS.map(s => setTitle(s).toLowerCase()));
  if (!taken.has(t.toLowerCase())) return t;
  let k = 2;
  while (taken.has((t + ' (' + k + ')').toLowerCase())) k++;
  return t + ' (' + k + ')';
}
async function importFiles(files) {
  for (const f of files) {
    let text;
    try { text = await f.text(); } catch (e) { await alertDlg('Не удалось прочитать файл', f.name); continue; }
    await importText(text, (f.name || '').replace(/\.[^.]+$/, '').trim() || 'вопросы');

async function importText(text, title) {
  text = String(text).replace(/^﻿/, '').trim();
  title = (title || '').trim() || 'вопросы';
  let raw;
  try { raw = JSON.parse(text); }
  catch (e) { return alertDlg('Это не JSON', '«' + title + '» не читается как JSON: ' + e.message + '\n\nПроверьте, что файл скопирован целиком.'); }
  let b;
  try { b = buildBank(raw); } catch (e) { return alertDlg('Формат не подходит', e.message); }
  if (!b.total) return alertDlg('В файле нет вопросов', 'Ожидается объект вида {"Текст вопроса": {"type": "single", "all_options": [...]}}. Поддерживаются типы single, multiple, dropdown, sortable, text_input и drag_and_drop.');
  const hash = cyrb53(text).toString(36);
  const same = SETS.find(s => (s.rec && s.rec.hash === hash) || s.hash === hash);
  if (same) {
    selectSet(same.id); closeDrawer(); renderAll();
    return toast('«' + setTitle(same) + '» уже загружен — открыл его');
  }
  let targetId = null;
  const twin = SETS.find(s => setTitle(s).toLowerCase() === title.toLowerCase());
  if (twin) {
    const r = await dialog({
      title: 'Файл «' + title + '» уже есть',
      message: 'Обновить его этой версией? Прогресс и избранное сохранятся у совпадающих вопросов.',
      buttons: [{ id: 'update', label: 'Обновить', kind: 'primary' }, { id: 'new', label: 'Добавить отдельным файлом' }, { id: 'cancel', label: 'Отмена' }],
      vertical: true
    });
    if (r.id === 'cancel') return;
    if (r.id === 'update') targetId = twin.id; else title = uniqueTitle(title);
  }
  const done = busy('Сохраняю файл…');
  let ref;
  try { ref = await Store.putFile(text); }
  catch (e) { done(); return alertDlg('Файл не сохранился', e.message); }
  done();
  const id = targetId || ('imp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  const old = S.sets.find(r => r.id === id);
  const entry = { id, title: targetId ? ((old && old.title) || twin.title) : title, store: ref.store, ref: ref.ref, addedAt: Date.now(), hash, count: b.total };
  if (old) { Store.delFile(old); S.sets = S.sets.map(r => r.id === id ? entry : r); } else S.sets.push(entry);
  BANKS.set(id, b);
  rebuildSets();
  if (S.setId === id) { endTest(); applyBank(b); } else selectSet(id);
  save();
  closeDrawer();
  renderAll();
  const extra = b.skipped ? ', пропущено ' + b.skipped : '';
  toast((targetId ? 'Обновлено' : 'Загружено') + ': «' + setTitle(SETS.find(s => s.id === id)) + '» — ' + b.total + ' ' + plural(b.total, 'вопрос', 'вопроса', 'вопросов') + extra);
}
async function deleteSet(id) {
  const s = SETS.find(x => x.id === id);
  if (!s) return;
  if (S.test && S.test.setId === id) S.test = null;
  if (s.rec) { S.sets = S.sets.filter(r => r.id !== id); Store.delFile(s.rec); }
  if (s.bundled && !S.hiddenBundled.includes(id)) S.hiddenBundled.push(id);
  for (const k of Object.keys(S.answers)) if (k.startsWith(id + '|')) delete S.answers[k];
  for (const k of Object.keys(S.indexByScope)) if (k.startsWith(id + '|')) delete S.indexByScope[k];
  delete S.starred[id];
  delete S.titles[id];
  S.savedTests = S.savedTests.filter(t => t.setId !== id);
  BANKS.delete(id);
  rebuildSets();
  if (S.setId === id) {
    S.setId = SETS.length ? SETS[0].id : '';
    S.category = 'multiple'; S.starOnly = false;
    S.index = S.indexByScope[scopeKey()] || 0;
    activateSet();
  }
  save();
  renderAll();
}

/* =========================================================
   Sheets & dialogs
   ========================================================= */
const anySheet = () => !!document.querySelector('.sheet-wrap:not(.closing)');
function openSheet({ cls = '', html, onClick, onClose, dismissible = true }) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-scrim"></div><div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(wrap);
  const panel = wrap.querySelector('.sheet');
  let closed = false;
  const onKey = e => { if (e.key === 'Escape' && dismissible) { e.stopPropagation(); close(); } };
  function close() {
    if (closed) return;
    closed = true;
    document.removeEventListener('keydown', onKey, true);
    wrap.classList.add('closing');
    setTimeout(() => wrap.remove(), 190);
    if (onClose) onClose();
  }
  document.addEventListener('keydown', onKey, true);
  wrap.querySelector('.sheet-scrim').addEventListener('click', () => { if (dismissible) close(); });
  panel.addEventListener('click', e => {
    const b = e.target.closest('[data-s]');
    if (b && !b.disabled && panel.contains(b) && onClick) onClick(b.dataset.s, b, e, close);
  });
  return { panel, close };
}
function dialog({ title, message = '', input = null, buttons, vertical = false }) {
  return new Promise(resolve => {
    let done = false;
    const html = `<div class="dlg"><div class="dlg-title">${esc(title)}</div>${message ? `<div class="dlg-msg">${esc(message)}</div>` : ''}${input ? `<input id="dlgInput" class="f-in" ${input.numeric ? 'inputmode="numeric" pattern="[0-9]*"' : ''} value="${esc(input.value || '')}" placeholder="${esc(input.placeholder || '')}" autocomplete="off" aria-label="${esc(input.placeholder || title)}">` : ''}<div class="dlg-btns${vertical ? ' v' : ''}">${buttons.map(b => `<button type="button" class="dlg-btn ${b.kind || ''}" data-s="${b.id}">${esc(b.label)}</button>`).join('')}</div></div>`;
    const sh = openSheet({
      cls: 'dialog', html,
      onClick: (id, el, e, close) => { const inp = sh.panel.querySelector('#dlgInput'); done = true; close(); resolve({ id, value: inp ? inp.value : '' }); },
      onClose: () => { if (!done) { done = true; resolve({ id: 'cancel', value: '' }); } }
    });
    const inp = sh.panel.querySelector('#dlgInput');
    if (inp) {
      inp.focus();
      if (inp.select) inp.select();
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const p = sh.panel.querySelector('.dlg-btn.primary'); if (p) p.click(); } });
    }
  });
}
const alertDlg = (title, message) => dialog({ title, message, buttons: [{ id: 'ok', label: 'Понятно', kind: 'primary' }] });

let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); setTimeout(() => { t.hidden = true; }, 220); }, 2800);
}
function busy(msg) {
  const el = document.createElement('div');
  el.className = 'busy';
  el.innerHTML = `<div><span class="spinner"></span><span>${esc(msg)}</span></div>`;
  document.body.appendChild(el);
  return () => el.remove();
}
function haptic() {
  try {
    if (navigator.vibrate) { navigator.vibrate(12); return; }
    const l = document.createElement('label');
    l.setAttribute('aria-hidden', 'true');
    l.hidden = true;
    const i = document.createElement('input');
    i.type = 'checkbox';
    i.setAttribute('switch', '');
    l.appendChild(i);
    document.head.appendChild(l);
    l.click();
    l.remove();
  } catch (e) { /* no haptics here */ }
}

/* ---------- make test ---------- */
function openMakeTest() {
  if (!bankReady() || !curSet()) return toast('Сначала выберите файл с вопросами');
  const cfg = { order: CATS.slice(), counts: {}, points: {} };
  CATS.forEach(c => { cfg.counts[c] = 0; cfg.points[c] = 0; });
  const avail = c => (bank.byCat[c] || []).length;
  const totals = () => [cfg.order.reduce((a, c) => a + cfg.counts[c], 0), cfg.order.reduce((a, c) => a + cfg.counts[c] * cfg.points[c], 0)];
  const stepper = (label, kind, c, v, max) => {
    const dis = max <= 0;
    return `<div class="mt-line${dis ? ' dis' : ''}"><span>${label}</span><span class="mt-ctrls"><button type="button" class="sq-btn" data-s="${kind}-" data-cat="${c}" aria-label="Уменьшить"${dis || v <= 0 ? ' disabled' : ''}>${I.minus}</button><input class="num-in" data-num="${kind}" data-cat="${c}" inputmode="numeric" pattern="[0-9]*" value="${v || ''}" placeholder="0" aria-label="${label}: ${CAT_TITLE[c]}"${dis ? ' disabled' : ''}><button type="button" class="sq-btn" data-s="${kind}+" data-cat="${c}" aria-label="Увеличить"${dis || v >= max ? ' disabled' : ''}>${I.plus}</button></span></div>`;
  };
  const bodyHTML = () => {
    const [q, p] = totals();
    let h = `<div class="sec-label">Итого</div><div class="metrics"><div class="metric"><b id="mtQ">${q}</b><span>заданий</span></div><div class="metric"><b id="mtP">${p}</b><span>баллов</span></div></div><div class="sec-label">Категории</div>`;
    cfg.order.forEach((c, k) => {
      h += `<div class="mt-card"><div class="mt-head"><span class="mt-ico">${I.cat[c]}</span><span class="mt-title">${CAT_TITLE[c]}<small>Доступно: ${avail(c)}</small></span></div>
<div class="mt-line"><span>Порядок: ${k + 1}</span><span class="mt-ctrls"><button type="button" class="sq-btn" data-s="up" data-cat="${c}" aria-label="Поднять категорию"${k === 0 ? ' disabled' : ''}>${I.up}</button><button type="button" class="sq-btn" data-s="down" data-cat="${c}" aria-label="Опустить категорию"${k === cfg.order.length - 1 ? ' disabled' : ''}>${I.down}</button></span></div>
${stepper('Вопросов в тесте', 'cnt', c, cfg.counts[c], avail(c))}${stepper('Баллов за вопрос', 'pts', c, cfg.points[c], 100)}</div>`;
    });
    if (S.test) h += `<button type="button" class="act red wide" data-s="end">${I.x}Завершить текущий тест</button>`;
    return h;
  };
  const html = `<div class="sheet-head"><button type="button" class="head-btn" data-s="close">Закрыть</button><div class="head-title">Сделать тест</div><button type="button" class="head-btn end" data-s="start" id="mtStartTop">Начать</button></div><div class="sheet-body" id="mtBody"></div><div class="sheet-foot"><button type="button" class="act green wide" data-s="start" id="mtStart">${I.play}Начать тест</button></div>`;
  const sh = openSheet({
    cls: 'full', html,
    onClick: (id, el, e, close) => {
      const c = el.dataset.cat;
      if (id === 'close') return close();
      if (id === 'end') { endTest(); close(); renderAll(); return; }
      if (id === 'start') {
        if (!totals()[0]) return;
        if (startTest(cfg.order.map(cat => ({ cat, count: cfg.counts[cat], points: cfg.points[cat] })), true)) { close(); closeDrawer(); renderAll(); toast('Тест начат: ' + currentItems().length + ' ' + plural(currentItems().length, 'вопрос', 'вопроса', 'вопросов')); }
        return;
      }
      if (id === 'up' || id === 'down') {
        const i = cfg.order.indexOf(c), j = i + (id === 'up' ? -1 : 1);
        if (j >= 0 && j < cfg.order.length) [cfg.order[i], cfg.order[j]] = [cfg.order[j], cfg.order[i]];
      }
      if (id === 'cnt-') cfg.counts[c] = Math.max(0, cfg.counts[c] - 1);
      if (id === 'cnt+') cfg.counts[c] = Math.min(avail(c), cfg.counts[c] + 1);
      if (id === 'pts-') cfg.points[c] = Math.max(0, cfg.points[c] - 1);
      if (id === 'pts+') cfg.points[c] = Math.min(100, cfg.points[c] + 1);
      draw();
    }
  });
  const body = sh.panel.querySelector('#mtBody');
  const sync = () => {
    const [q, p] = totals();
    const a = body.querySelector('#mtQ'), b = body.querySelector('#mtP');
    if (a) a.textContent = q;
    if (b) b.textContent = p;
    sh.panel.querySelector('#mtStart').disabled = !q;
    sh.panel.querySelector('#mtStartTop').disabled = !q;
  };
  function draw() { const t = body.scrollTop; body.innerHTML = bodyHTML(); body.scrollTop = t; sync(); }
  body.addEventListener('input', e => {
    const inp = e.target.closest('.num-in');
    if (!inp) return;
    const c = inp.dataset.cat, max = inp.dataset.num === 'cnt' ? avail(c) : 100;
    const digits = inp.value.replace(/\D/g, '');
    const v = digits ? clamp(parseInt(digits, 10), 0, max) : 0;
    if (inp.dataset.num === 'cnt') cfg.counts[c] = v; else cfg.points[c] = v;
    if (digits && String(v) !== inp.value) inp.value = String(v);
    sync();
  });
  body.addEventListener('change', e => { if (e.target.closest('.num-in')) draw(); });
  draw();
}

/* ---------- add own subquestion to a case ---------- */
function openAddSub(caseId) {
  const fresh = () => ({ prompt: '', options: [{ text: '', correct: true }, { text: '', correct: false }], order: ['', ''], choices: [''], rows: [{ left: '', value: '' }], answers: [''] });
  let type = 'single';
  let m = fresh();
  const tr = s => String(s || '').trim();
  const valid = () => {
    if (!tr(m.prompt)) return false;
    switch (type) {
      case 'single': case 'multiple': return m.options.length >= 2 && m.options.every(o => tr(o.text)) && m.options.some(o => o.correct);
      case 'sortable': return m.order.length >= 2 && m.order.every(v => tr(v));
      case 'dropdown': { const ch = m.choices.map(tr).filter(Boolean); return ch.length > 0 && m.rows.length > 0 && m.rows.every(r => tr(r.left) && ch.includes(tr(r.value))); }
      case 'text': return m.answers.some(v => tr(v));
    }
    return false;
  };
  const add = (act, label) => `<button type="button" class="f-add" data-s="${act}">${I.plus}${label}</button>`;
  const del = (act, i, label) => `<button type="button" class="f-del" data-s="${act}" data-i="${i}" aria-label="${label}">${I.minus}</button>`;
  const bodyHTML = () => {
    let h = '<div class="sec-label">Тип вопроса</div><div class="chips">' + SUB_TYPES.map(([t, short]) => `<button type="button" class="chip${type === t ? ' on' : ''}" data-s="type" data-t="${t}" aria-pressed="${type === t}">${I.sub[t]}<span>${short}</span></button>`).join('') + '</div>';
    h += `<div class="sec-label">Вопрос</div><textarea class="f-in f-prompt" data-f="prompt" rows="2" placeholder="Текст вопроса" aria-label="Текст вопроса">${esc(m.prompt)}</textarea>`;
    if (type === 'single' || type === 'multiple') {
      h += `<div class="sec-label">${type === 'single' ? 'Варианты (отметьте один верный)' : 'Варианты (отметьте верные)'}</div>`;
      h += m.options.map((o, i) => `<div class="f-line"><button type="button" class="f-mark" data-s="opt-ok" data-i="${i}" aria-pressed="${o.correct}" aria-label="Верный вариант ${i + 1}">${type === 'single' ? (o.correct ? I.radioOn : I.radioOff) : (o.correct ? I.boxOn : I.boxOff)}</button><input class="f-in" data-f="opt" data-i="${i}" value="${esc(o.text)}" placeholder="Вариант ${i + 1}" aria-label="Вариант ${i + 1}">${m.options.length > 2 ? del('opt-del', i, 'Удалить вариант') : ''}</div>`).join('');
      h += add('opt-add', 'Добавить вариант');
    } else if (type === 'sortable') {
      h += '<div class="sec-label">Элементы в правильном порядке</div>';
      h += m.order.map((v, i) => `<div class="f-line"><span class="f-num">${i + 1}.</span><input class="f-in" data-f="ord" data-i="${i}" value="${esc(v)}" placeholder="Элемент ${i + 1}" aria-label="Элемент ${i + 1}">${m.order.length > 2 ? del('ord-del', i, 'Удалить элемент') : ''}</div>`).join('');
      h += add('ord-add', 'Добавить элемент');
    } else if (type === 'dropdown') {
      const ch = uniq(m.choices.map(tr).filter(Boolean));
      h += '<div class="sec-label">Все варианты в выпадающем списке</div>';
      h += m.choices.map((v, i) => `<div class="f-line"><input class="f-in" data-f="choice" data-i="${i}" value="${esc(v)}" placeholder="Вариант выбора ${i + 1}" aria-label="Вариант выбора ${i + 1}">${m.choices.length > 1 ? del('ch-del', i, 'Удалить вариант выбора') : ''}</div>`).join('');

    }

  };
  const html = `<div class="sheet-head"><button type="button" class="head-btn" data-s="close">Закрыть</button><div class="head-title">Добавить вопрос</div><button type="button" class="head-btn end" data-s="add" id="asTop">Добавить</button></div><div class="sheet-body" id="asBody"></div><div class="sheet-foot"><button type="button" class="act green wide" data-s="add" id="asBtn">${I.plus}Добавить вопрос</button></div>`;
  const sh = openSheet({
    cls: 'full', html,
    onClick: (id, el, e, close) => {
      const i = +el.dataset.i;
      switch (id) {
        case 'close': return close();
        case 'type': type = el.dataset.t; break;
        case 'opt-ok': if (type === 'single') m.options.forEach((o, k) => { o.correct = k === i; }); else m.options[i].correct = !m.options[i].correct; break;
        case 'opt-del': m.options.splice(i, 1); break;
        case 'opt-add': m.options.push({ text: '', correct: false }); break;
        case 'ord-del': m.order.splice(i, 1); break;
        case 'ord-add': m.order.push(''); break;
        case 'ch-del': { const gone = tr(m.choices[i]); m.choices.splice(i, 1); m.rows.forEach(r => { if (tr(r.value) === gone) r.value = ''; }); break; }
        case 'ch-add': m.choices.push(''); break;
        case 'row-del': m.rows.splice(i, 1); break;
        case 'row-add': m.rows.push({ left: '', value: '' }); break;
        case 'ans-del': m.answers.splice(i, 1); break;
        case 'ans-add': m.answers.push(''); break;
        case 'exist-del':
          S.customSubs[caseId] = customSubsOf(caseId).filter(s => s.id !== el.dataset.id);
          if (!S.customSubs[caseId].length) delete S.customSubs[caseId];
          save(); render();
          break;
        case 'add': {
          if (!valid()) return;
          const prompt = tr(m.prompt);
          const sub = { id: sid('custom-sub', caseId + '|' + prompt + '|' + Date.now()), type, prompt, createdAt: Date.now() };
          if (type === 'single' || type === 'multiple') sub.options = m.options.map(o => ({ text: tr(o.text), correct: !!o.correct }));
          if (type === 'sortable') sub.order = m.order.map(tr);
          if (type === 'dropdown') { sub.choices = uniq(m.choices.map(tr).filter(Boolean)); sub.rows = m.rows.map(r => ({ left: tr(r.left), value: tr(r.value) })); }
          if (type === 'text') sub.accepted = m.answers.map(tr).filter(Boolean);
          (S.customSubs[caseId] = customSubsOf(caseId).slice()).push(sub);
          const it = currentItem();
          if (it && it.id === caseId) mut(caseId, r => { r.checked = false; r.reveal = false; });
          m = fresh();
          save(); render();
          toast('Вопрос добавлен в кейс');
          break;
        }
      }
      draw();
    }
  });
  const body = sh.panel.querySelector('#asBody');
  const sync = () => { const ok = valid(); sh.panel.querySelector('#asBtn').disabled = !ok; sh.panel.querySelector('#asTop').disabled = !ok; };
  function draw() { const t = body.scrollTop; body.innerHTML = bodyHTML(); body.scrollTop = t; sync(); }
  body.addEventListener('input', e => {
    const f = e.target.dataset.f, i = +e.target.dataset.i, v = e.target.value;
    if (f === 'prompt') m.prompt = v;
    else if (f === 'opt') m.options[i].text = v;
    else if (f === 'ord') m.order[i] = v;
    else if (f === 'choice') m.choices[i] = v;
    else if (f === 'left') m.rows[i].left = v;
    else if (f === 'ans') m.answers[i] = v;
    sync();
  });
  body.addEventListener('change', e => {
    const f = e.target.dataset.f;
    if (f === 'val') { m.rows[+e.target.dataset.i].value = e.target.value; sync(); }
    if (f === 'choice') draw();
  });
  draw();
}

  'm-set-more': el => openSetActions(el.dataset.id),
  'm-unhide': () => { S.hiddenBundled = []; rebuildSets(); save(); renderAll(); toast('Встроенные файлы снова в списке'); },
  'm-cat': el => { selectCategory(el.dataset.cat); closeDrawer(); render(); },
  'm-star-cat': el => { selectStarred(el.dataset.cat); closeDrawer(); render(); },
  'm-star-clear': async el => {

    if (S.starOnly && S.category === c) { S.starOnly = false; S.index = S.indexByScope[scopeKey()] || 0; clampIndex(); }
    save(); renderAll();
  },
  'm-maketest': () => openMakeTest(),
  'm-saved': async el => {
    const t = S.savedTests.find(x => x.id === el.dataset.id);
    if (!t) return;
    if (!SETS.some(s => s.id === t.setId)) return toast('Файл этого теста удалён');
    if (S.setId !== t.setId) { selectSet(t.setId); render(); await loadingPromise; }
    if (!bankReady()) return toast('Файл теста не открылся');
    if (startTest(t.configs, false)) { closeDrawer(); renderAll(); toast(t.title + ': ' + currentItems().length + ' ' + plural(currentItems().length, 'вопрос', 'вопроса', 'вопросов')); }
  },
  'm-saved-del': async el => {
    const t = S.savedTests.find(x => x.id === el.dataset.id);
    if (!t) return;
    const r = await dialog({ title: 'Удалить «' + t.title + '»?', buttons: [{ id: 'cancel', label: 'Отмена' }, { id: 'ok', label: 'Удалить', kind: 'danger' }] });
    if (r.id === 'ok') { S.savedTests = S.savedTests.filter(x => x.id !== t.id); save(); renderMenuBody(); }
  },
  'm-result': el => { selectItem(el.dataset.cat, el.dataset.id); elSearch.value = ''; closeDrawer(); render(); },
  'm-font-dec': () => setFont(S.fontScale - 0.1),
  'm-font-inc': () => setFont(S.fontScale + 0.1),
  'm-font-reset': () => setFont(1)
};
function setFont(v) { S.fontScale = Math.round(clamp(v, 0.5, 1.6) * 100) / 100; save(); render(); renderMenuBody(); }

document.addEventListener('click', e => {

  const lbl = e.target.closest && e.target.closest('label[role="button"]');

  if (anySheet() || drawerOpen) { if (drawerOpen && e.key === 'Escape') closeDrawer(); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') { goNext(); render(); }

/* prev / next with press-and-hold repeat */
function repeatable(btn, fn) {
  let t1 = 0, t2 = 0, repeated = false;
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = 0; };
  btn.addEventListener('pointerdown', () => {
    if (btn.disabled) return;
    repeated = false; stop();
    t1 = setTimeout(() => { t2 = setInterval(() => { if (btn.disabled) { stop(); return; } repeated = true; fn(); }, 90); }, 450);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('click', () => { if (repeated) { repeated = false; return; } fn(); });
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
repeatable($('#prevBtn'), () => { goPrev(); render(); });
repeatable($('#nextBtn'), () => { goNext(); render(); });
$('#counter').addEventListener('click', openGoTo);

/* swipes: question area and menu */
let sw = null;
elScroller.addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || drag || e.target.closest('[data-handle], textarea, input, select')) { sw = null; return; }
  const t = e.touches[0];
  sw = { x: t.clientX, y: t.clientY };
}, { passive: true });
elScroller.addEventListener('touchend', e => {
  if (!sw) return;
  const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y, x0 = sw.x;
  sw = null;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
  if (dx > 0 && x0 < 28) { openDrawer(); return; }
  const n = currentItems().length;
  if (dx < 0 && S.index < n - 1) { goNext(); render(); }
  else if (dx > 0 && S.index > 0) { goPrev(); render(); }
}, { passive: true });
let dsw = null;
elDrawer.addEventListener('touchstart', e => { const t = e.touches[0]; dsw = { x: t.clientX, y: t.clientY }; }, { passive: true });
elDrawer.addEventListener('touchend', e => {
  if (!dsw) return;
  const t = e.changedTouches[0], dx = t.clientX - dsw.x, dy = t.clientY - dsw.y;
  dsw = null;
  if (dx < -60 && Math.abs(dx) > Math.abs(dy) * 1.3) closeDrawer();
}, { passive: true });

/* sortable drag */
let drag = null;
elContent.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-handle]');
  if (!h || drag) return;
  const row = h.closest('.sort-row'), list = row && row.parentElement;
  const q = list && QMAP.get(list.dataset.qid);
  if (!q) return;
  e.preventDefault();
  const rows = [...list.children];
  const rects = rows.map(r => r.getBoundingClientRect());
  const from = rows.indexOf(row);
  const gap = rows.length > 1 ? Math.max(0, rects[1].top - rects[0].bottom) : 8;
  drag = { q, rows, rects, from, to: from, startY: e.clientY, y: e.clientY, startScroll: elScroller.scrollTop, step: rects[from].height + gap, id: e.pointerId, raf: 0 };
  row.classList.add('dragging');
  try { h.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  drag.raf = requestAnimationFrame(dragTick);
});
function layoutDrag() {
  const d = drag;
  const dy = (d.y - d.startY) + (elScroller.scrollTop - d.startScroll);
  const r0 = d.rects[d.from];
  const center = r0.top + r0.height / 2 + dy;
  let to = 0;
  d.rects.forEach((r, i) => { if (i !== d.from && r.top + r.height / 2 < center) to++; });
  d.to = to;
  d.rows.forEach((el, i) => {
    if (i === d.from) { el.style.transform = `translateY(${dy}px)`; return; }
    let off = 0;
    if (d.from < to && i > d.from && i <= to) off = -d.step;
    else if (d.from > to && i >= to && i < d.from) off = d.step;
    el.style.transform = off ? `translateY(${off}px)` : '';
  });
}
function dragTick() {
  if (!drag) return;
  const sr = elScroller.getBoundingClientRect(), edge = 60;
  let v = 0;
  if (drag.y < sr.top + edge) v = -Math.ceil((sr.top + edge - drag.y) / 5);
  else if (drag.y > sr.bottom - edge) v = Math.ceil((drag.y - (sr.bottom - edge)) / 5);
  if (v) { const before = elScroller.scrollTop; elScroller.scrollTop += v; if (elScroller.scrollTop !== before) layoutDrag(); }
  drag.raf = requestAnimationFrame(dragTick);
}
document.addEventListener('pointermove', e => { if (drag && e.pointerId === drag.id) { drag.y = e.clientY; layoutDrag(); } }, { passive: true });
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  cancelAnimationFrame(drag.raf);
  const d = drag;
  drag = null;
  if (d.to !== d.from) {
    const order = d.rows.map(el => +el.dataset.oi);
    const [moved] = order.splice(d.from, 1);
    order.splice(d.to, 0, moved);
    setOrder(d.q.id, order);
  }
  render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

async function loadBundledList() {
  try {
    const r = await fetch('data/sets.json', { cache: 'no-cache' });
    if (!r.ok) return [];
    const list = await r.json();
    return (Array.isArray(list) ? list : []).filter(x => x && typeof x.file === 'string')
      .map(x => ({ id: 'bundle.' + x.file.replace(/\.json$/i, ''), file: x.file, title: x.title || x.file.replace(/\.json$/i, '') }));
  } catch (e) { return []; }
}
function normalizeState(st) {
  S = Object.assign(defaults(), st && typeof st === 'object' ? st : {});
  if (!CATS.includes(S.category)) S.category = 'multiple';
  S.fontScale = clamp(+S.fontScale || 1, 0.5, 1.6);
  ['indexByScope', 'answers', 'starred', 'customSubs', 'titles'].forEach(k => { if (!S[k] || typeof S[k] !== 'object' || Array.isArray(S[k])) S[k] = {}; });
  ['savedTests', 'sets', 'hiddenBundled'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
  if (S.test && (!Array.isArray(S.test.ids) || !S.test.points)) S.test = null;
}
async function boot() {
  render();
  const [list] = await Promise.all([loadBundledList(), Store.init()]);
  BUNDLED = list;
  const { state, fresh } = await Store.loadState();
  normalizeState(state);
  if (Store.mode === 'cloud' && await Store.migrateLocalFiles(S.sets)) { /* saved below */ }
  rebuildSets();
  if (!SETS.some(s => s.id === S.setId)) { S.setId = SETS.length ? SETS[0].id : ''; S.index = S.indexByScope[scopeKey()] || 0; }
  bankStatus = 'loading';
  activateSet();
  render();
  if (fresh || Store.mode === 'cloud') flush();
  if (Store.cloudDown) toast('Нет связи с аккаунтом — прогресс сохраняется в этом браузере');
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]') && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
boot();
})();
